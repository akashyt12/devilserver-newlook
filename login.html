<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL LOGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--emerald:#10b981;--emerald-light:#34d399;--emerald-dark:#059669;--bg:#030712;--card:rgba(255,255,255,.02);--border:rgba(255,255,255,.06);--text:#f9fafb;--muted:#6b7280;--dim:#374151;--input-bg:rgba(255,255,255,.03)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}

/* BG */
.bg{position:fixed;inset:0;z-index:0}
.bg::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% -20%,rgba(16,185,129,.12),transparent),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(5,150,105,.08),transparent)}
.bg-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(16,185,129,.02) 1px,transparent 1px),
  linear-gradient(90deg,rgba(16,185,129,.02) 1px,transparent 1px);
  background-size:80px 80px;animation:gridShift 30s linear infinite}
@keyframes gridShift{to{background-position:80px 80px}}

.aurora{position:fixed;inset:0;overflow:hidden;z-index:0}
.aurora-beam{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:conic-gradient(from 90deg,transparent,rgba(16,185,129,.04),transparent,rgba(52,211,153,.02),transparent);animation:auroraRotate 22s linear infinite;filter:blur(60px)}
@keyframes auroraRotate{to{transform:rotate(360deg)}}

.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:0}
.orb-1{width:400px;height:400px;background:rgba(16,185,129,.08);top:-200px;left:50%;transform:translateX(-50%)}
.orb-2{width:300px;height:300px;background:rgba(5,150,105,.06);bottom:-150px;right:-100px}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;border-radius:50%;animation:particleRise linear infinite}
@keyframes particleRise{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

/* BACK BTN */
.back{position:fixed;top:20px;left:20px;z-index:100;width:48px;height:48px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;justify-content:center;align-items:center;cursor:pointer;backdrop-filter:blur(20px);transition:all .3s}
.back:hover{background:rgba(255,255,255,.06);border-color:rgba(16,185,129,.15)}
.back:active{transform:scale(.92)}
.back svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.back:hover svg{stroke:var(--text)}

/* MAIN */
.main{position:relative;z-index:10;width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:24px}

/* GLASS CARD */
.card{width:100%;max-width:400px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);border-radius:36px;padding:44px 32px;backdrop-filter:blur(40px);position:relative;overflow:hidden;animation:cardEntry .8s ease-out both}
@keyframes cardEntry{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.2),transparent)}
.card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(16,185,129,.03),transparent 50%);pointer-events:none}

/* LOGO */
.logo-section{display:flex;flex-direction:column;align-items:center;margin-bottom:36px}
.logo-box{width:88px;height:88px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.12);border-radius:28px;display:flex;justify-content:center;align-items:center;position:relative;animation:logoPulse 4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 40px rgba(16,185,129,.08)}50%{box-shadow:0 0 60px rgba(16,185,129,.15)}}
.logo-box::before{content:'';position:absolute;inset:-1px;border-radius:29px;background:linear-gradient(135deg,var(--emerald),transparent,var(--emerald-light));opacity:.1;z-index:-1}
.logo-box svg{width:38px;height:38px;stroke:var(--emerald);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:1px;margin-top:20px}
.title .g{color:var(--emerald);text-shadow:0 0 30px rgba(16,185,129,.3)}
.subtitle{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:8px}

/* INPUT */
.input-group{margin-bottom:24px}
.input-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:block}
.input-wrap{position:relative}
.input{width:100%;height:58px;background:var(--input-bg);border:1px solid var(--border);border-radius:18px;padding:0 52px 0 50px;color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;outline:none;transition:all .3s cubic-bezier(.4,0,.2,1)}
.input:focus{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.02);box-shadow:0 0 0 4px rgba(16,185,129,.05),0 8px 30px rgba(0,0,0,.1)}
.input::placeholder{color:var(--dim)}
.input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.input:focus~.input-icon{stroke:var(--emerald)}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(255,255,255,.03);border:none;border-radius:12px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .3s}
.eye:hover{background:rgba(255,255,255,.06)}
.eye:active{transform:translateY(-50%) scale(.9)}
.eye svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* BUTTON */
.btn{width:100%;height:58px;border:none;border-radius:18px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .3s}
.btn:active{transform:scale(.96)}
.btn-login{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;box-shadow:0 12px 40px rgba(16,185,129,.35),0 0 0 1px rgba(16,185,129,.3)}
.btn-login:hover::before{opacity:1}
.btn-login:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-loader{display:none;width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* INFO */
.info{text-align:center;margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.info-row{display:flex;align-items:center;gap:6px}
.info-row svg{width:14px;height:14px;stroke:var(--emerald);fill:none;stroke-width:2}
.info-text{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:1px}

/* TOAST */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(120px);min-width:320px;background:rgba(10,10,10,.95);border:1px solid var(--border);border-radius:24px;padding:18px 24px;z-index:999;backdrop-filter:blur(30px);transition:all .5s cubic-bezier(.4,0,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.toast-dot{width:8px;height:8px;border-radius:50%}
.toast-dot.success{background:var(--emerald);box-shadow:0 0 12px var(--emerald)}
.toast-dot.error{background:#ef4444;box-shadow:0 0 12px #ef4444}
.toast-dot.warning{background:#f59e0b;box-shadow:0 0 12px #f59e0b}
.toast-title{font-size:14px;font-weight:700}
.toast-msg{font-size:12px;color:var(--muted);line-height:16px}

@media(max-width:400px){
  .card{padding:36px 24px;border-radius:32px}
  .title{font-size:26px}
}
</style>
</head>
<body>

<div class="bg"><div class="bg-grid"></div></div>
<div class="aurora"><div class="aurora-beam"></div></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="particles" id="particles"></div>

<div class="back" onclick="location.href='welcome.html'">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div class="main">
  <div class="card">
    <div class="logo-section">
      <div class="logo-box">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <div class="title">VERIFY <span class="g">ACCESS</span></div>
      <div class="subtitle">Premium Server Login</div>
    </div>

    <div class="input-group">
      <label class="input-label">Access Key</label>
      <div class="input-wrap">
        <input class="input" type="password" id="key" placeholder="Enter your access key" autocomplete="off">
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <button class="eye" onclick="toggleEye()" type="button">
          <svg id="eyeOff" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg id="eyeOn" style="display:none" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-login" id="loginBtn" onclick="login()">
      <span id="btnText">VALIDATE KEY</span>
      <div class="btn-loader" id="btnLoader"></div>
      <svg class="btn-icon" id="btnArrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <div class="info">
      <div class="info-row">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="info-text">Firebase Encrypted Verification</span>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="info-text">Expiry Detection Enabled</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-head">
    <div class="toast-dot" id="toastDot"></div>
    <div class="toast-title" id="toastTitle">Status</div>
  </div>
  <div class="toast-msg" id="toastMsg">Message</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",authDomain:"admin-pannel-de3f4.firebaseapp.com",databaseURL:"https://admin-pannel-de3f4-default-rtdb.firebaseio.com",projectId:"admin-pannel-de3f4",storageBucket:"admin-pannel-de3f4.firebasestorage.app",messagingSenderId:"318138798074",appId:"1:318138798074:web:0252256f3ddc783d815e43",measurementId:"G-CYXFXYN27Z"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);

const btnText=document.getElementById('btnText');
const btnLoader=document.getElementById('btnLoader');
const btnArrow=document.getElementById('btnArrow');
const loginBtn=document.getElementById('loginBtn');

function showToast(type,title,msg){
  const t=document.getElementById('toast');
  document.getElementById('toastDot').className='toast-dot '+type;
  document.getElementById('toastTitle').innerText=title;
  document.getElementById('toastMsg').innerText=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000);
}

window.login=async function(){
  const key=document.getElementById('key').value.trim();
  if(key===''){showToast('warning','Empty Key','Please enter your access key');return}
  btnText.style.display='none';btnArrow.style.display='none';btnLoader.style.display='block';loginBtn.disabled=true;
  try{
    const snap=await get(ref(db,'keys/'+key));
    if(snap.exists()){
      const d=snap.val();const exp=d.expiry||0;
      if(Date.now()>exp){showToast('error','Key Expired','Your access key has expired');resetBtn();return}
      localStorage.setItem('premium','true');localStorage.setItem('accessKey',key);
      showToast('success','Access Granted','Login successful. Redirecting...');
      setTimeout(()=>window.location.href='home.html',1200);
    }else{showToast('error','Invalid Key','Access key not found in database')}
  }catch(e){console.log(e);showToast('error','Server Error','Firebase connection failed')}
  resetBtn();
}

function resetBtn(){btnText.style.display='block';btnArrow.style.display='block';btnLoader.style.display='none';loginBtn.disabled=false}

window.toggleEye=function(){
  const i=document.getElementById('key'),o=document.getElementById('eyeOff'),n=document.getElementById('eyeOn');
  if(i.type==='password'){i.type='text';o.style.display='none';n.style.display='block'}
  else{i.type='password';o.style.display='block';n.style.display='none'}
}

const pc=document.getElementById('particles');
for(let i=0;i<25;i++){
  const p=document.createElement('div');p.className='p';
  const s=Math.random()*3+1;
  p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:hsl(${150+Math.random()*30},${70+Math.random()*30}%,${60+Math.random()*30}%);animation-delay:${Math.random()*6}s;animation-duration:${4+Math.random()*6}s;opacity:${.2+Math.random()*.4}`;
  pc.appendChild(p);
}
</script>
</body>
</html>
