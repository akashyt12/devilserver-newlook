<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Key Verification</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
  --green: #10b981;
  --green-light: #34d399;
  --green-dark: #059669;
  --bg: #070b14;
  --card-bg: #0d1420;
  --input-bg: #111a2b;
  --muted: #6b7a90;
  --border: #1a2740;
  --text: #e2e8f0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(16,185,129,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(5,150,105,0.04) 0%, transparent 50%);
  animation: bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}

.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
  width: 42px;
  height: 42px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--muted);
}

.back-btn:hover {
  border-color: var(--green);
  color: var(--green);
  background: rgba(16,185,129,0.05);
}

.back-btn svg {
  width: 18px;
  height: 18px;
}

.card {
  position: relative;
  z-index: 10;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  width: 100%;
  max-width: 380px;
  padding: 36px 32px;
  margin: 20px;
}

.card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 20%;
  right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}

.lottie-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

lottie-player {
  width: 130px;
  height: 130px;
  filter: drop-shadow(0 0 20px rgba(16,185,129,0.3));
}

.title {
  font-family: 'DM Sans', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 28px;
}

.input-group {
  position: relative;
  margin-bottom: 16px;
}

.input-group input {
  width: 100%;
  height: 48px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 46px 0 16px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #fff;
  letter-spacing: 0.5px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-group input::placeholder {
  color: #3a4a60;
}

.input-group input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(16,185,129,0.12);
}

.eye-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: color 0.2s;
}

.eye-btn:hover {
  color: var(--green);
}

.eye-btn svg {
  width: 18px;
  height: 18px;
}

.verify-btn {
  width: 100%;
  height: 48px;
  background: var(--green);
  border: none;
  border-radius: 3px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
}

.verify-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition: left 0.5s;
}

.verify-btn:hover {
  background: var(--green-light);
}

.verify-btn:hover::before {
  left: 100%;
}

.verify-btn:active {
  transform: scale(0.98);
}

.verify-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.info-text {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 20px;
  letter-spacing: 0.3px;
}

.info-text span {
  color: var(--green-dark);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 12px 24px;
  border-radius: 3px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.success {
  background: rgba(16,185,129,0.15);
  border: 1px solid var(--green);
  color: var(--green-light);
}

.toast.error {
  background: rgba(239,68,68,0.12);
  border: 1px solid #ef4444;
  color: #fca5a5;
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  border-top-color: #000;
  border-radius: 3px;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  animation: fadeIn 0.5s ease-out;
}
</style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='welcome.html'">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
</button>

<div class="card">
  <div class="lottie-wrap">
    <lottie-player
      src="https://assets3.lottiefiles.com/packages/lf20_u4yrau.json"
      background="transparent"
      speed="1"
      style="width:130px;height:130px"
      loop
      autoplay>
    </lottie-player>
  </div>

  <div class="title">ENTER ACCESS KEY</div>
  <div class="subtitle">Enter your premium access key</div>

  <div class="input-group">
    <input type="password" id="keyInput" placeholder="Enter your access key" autocomplete="off" spellcheck="false">
    <button class="eye-btn" id="eyeBtn" type="button" onclick="toggleEye()">
      <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      <svg id="eyeOn" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <button class="verify-btn" id="verifyBtn" onclick="verifyKey()">VERIFY KEY</button>

  <div class="info-text">Firebase Encrypted <span>&#8226;</span> Expiry Detection</div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",
  databaseURL: "https://admin-pannel-de3f4-default-rtdb.firebaseio.com",
  projectId: "admin-pannel-de3f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const keyInput = document.getElementById('keyInput');
const verifyBtn = document.getElementById('verifyBtn');
const toast = document.getElementById('toast');

function toggleEye() {
  const isPassword = keyInput.type === 'password';
  keyInput.type = isPassword ? 'text' : 'password';
  document.getElementById('eyeOff').style.display = isPassword ? 'none' : 'block';
  document.getElementById('eyeOn').style.display = isPassword ? 'block' : 'none';
}

function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = 'toast ' + type;
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function setLoading(on) {
  verifyBtn.disabled = on;
  verifyBtn.innerHTML = on
    ? '<span class="spinner"></span>VERIFYING...'
    : 'VERIFY KEY';
}

async function verifyKey() {
  const key = keyInput.value.trim();
  if (!key) {
    showToast('Please enter an access key', 'error');
    return;
  }

  setLoading(true);

  try {
    const snapshot = await db.ref('keys/' + key).once('value');
    const data = snapshot.val();

    if (!data) {
      showToast('Invalid access key', 'error');
      setLoading(false);
      return;
    }

    if (data.expiry && data.expiry < Date.now()) {
      showToast('Key has expired', 'error');
      setLoading(false);
      return;
    }

    localStorage.setItem('premium', 'true');
    localStorage.setItem('accessKey', key);

    showToast('Access granted!', 'success');

    setTimeout(() => {
      window.location.href = 'home.html';
    }, 800);

  } catch (err) {
    showToast('Connection error. Try again.', 'error');
    setLoading(false);
  }
}

keyInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyKey();
});

keyInput.focus();
</script>
</body>
</html>
