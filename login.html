<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL LOGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#030712;color:#fff}

/* BG */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{background-position:60px 60px}}
.bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
.bg-glow-1{background:#10b981;top:-250px;left:50%;transform:translateX(-50%)}
.bg-glow-2{background:#059669;bottom:-250px;right:-150px}

.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:#10b981;border-radius:50%;opacity:0;animation:particleFloat 5s ease-in-out infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh) scale(0)}50%{opacity:.5}100%{opacity:0;transform:translateY(-100px) scale(1)}}

/* BACK BTN */
.back-btn{position:fixed;top:20px;left:20px;z-index:100;width:44px;height:44px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;display:flex;justify-content:center;align-items:center;cursor:pointer;backdrop-filter:blur(10px);transition:all .3s}
.back-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(16,185,129,.2)}
.back-btn svg{width:20px;height:20px;stroke:#6b7280;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MAIN */
.main{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px}

/* CARD */
.card{width:100%;max-width:380px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:32px;padding:40px 28px;backdrop-filter:blur(40px);position:relative;overflow:hidden;animation:slideUp .8s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.3),transparent)}

/* LOGO */
.logo-wrap{display:flex;justify-content:center;margin-bottom:32px}
.logo-box{width:80px;height:80px;background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.15);border-radius:24px;display:flex;justify-content:center;align-items:center;position:relative}
.logo-box::after{content:'';position:absolute;inset:-1px;border-radius:25px;background:linear-gradient(135deg,#10b981,transparent);opacity:.2;z-index:-1}
.logo-box svg{width:36px;height:36px;stroke:#10b981;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* TEXT */
.title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.title .highlight{color:#10b981}
.subtitle{text-align:center;font-size:12px;color:#6b7280;letter-spacing:3px;text-transform:uppercase;margin-bottom:32px;font-weight:400}

/* INPUT GROUP */
.input-group{margin-bottom:20px}
.input-label{font-size:12px;color:#6b7280;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.input-wrap{position:relative}
.input-wrap input{width:100%;height:56px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:0 18px 0 48px;color:#fff;font-family:'Outfit',sans-serif;font-size:15px;outline:none;transition:all .3s}
.input-wrap input:focus{border-color:rgba(16,185,129,.4);box-shadow:0 0 0 4px rgba(16,185,129,.06);background:rgba(16,185,129,.02)}
.input-wrap input::placeholder{color:#4b5563}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#4b5563;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.input-wrap input:focus~.input-icon{stroke:#10b981}

/* EYE TOGGLE */
.eye-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:rgba(255,255,255,.04);border:none;border-radius:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .3s}
.eye-btn:hover{background:rgba(255,255,255,.08)}
.eye-btn svg{width:18px;height:18px;stroke:#6b7280;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* BUTTON */
.btn{width:100%;height:56px;border:none;border-radius:16px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:all .3s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:opacity .3s}
.btn:active{transform:scale(.98)}
.btn-login{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 40px rgba(16,185,129,.3)}
.btn-login:hover::before{opacity:1}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.btn-icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* LOADER */
.btn-loader{display:none;width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* INFO */
.info{text-align:center;margin-top:20px;font-size:11px;color:#374151;line-height:18px;letter-spacing:.5px}
.info .lock-icon{display:inline-block;width:12px;height:12px;stroke:#10b981;fill:none;stroke-width:2;vertical-align:-2px;margin-right:4px}

/* TOAST */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(100px);min-width:300px;background:rgba(15,15,15,.95);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:16px 20px;z-index:999;backdrop-filter:blur(20px);transition:all .4s cubic-bezier(.4,0,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.toast-dot{width:8px;height:8px;border-radius:50%}
.toast-dot.success{background:#10b981;box-shadow:0 0 10px #10b981}
.toast-dot.error{background:#ef4444;box-shadow:0 0 10px #ef4444}
.toast-dot.warning{background:#f59e0b;box-shadow:0 0 10px #f59e0b}
.toast-title{font-size:14px;font-weight:700}
.toast-msg{font-size:12px;color:#9ca3af;line-height:16px}

@media(max-width:400px){
  .card{padding:32px 20px;border-radius:28px}
  .title{font-size:24px}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="particles" id="particles"></div>

<div class="back-btn" onclick="location.href='welcome.html'">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div class="main">
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-box">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
    </div>

    <div class="title">VERIFY <span class="highlight">ACCESS</span></div>
    <div class="subtitle">Premium Server Login</div>

    <div class="input-group">
      <div class="input-label">Access Key</div>
      <div class="input-wrap">
        <input type="password" id="key" placeholder="Enter your access key" autocomplete="off">
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <button class="eye-btn" onclick="toggleEye()" type="button">
          <svg id="eyeOff" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg id="eyeOn" style="display:none" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-login" id="loginBtn" onclick="login()">
      <span id="btnText">VALIDATE KEY</span>
      <div class="btn-loader" id="btnLoader"></div>
      <svg class="btn-icon" id="btnArrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <div class="info">
      <svg class="lock-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Firebase Encrypted Verification<br>Expiry Detection Enabled
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-header">
    <div class="toast-dot" id="toastDot"></div>
    <div class="toast-title" id="toastTitle">Status</div>
  </div>
  <div class="toast-msg" id="toastMsg">Message</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",authDomain:"admin-pannel-de3f4.firebaseapp.com",databaseURL:"https://admin-pannel-de3f4-default-rtdb.firebaseio.com",projectId:"admin-pannel-de3f4",storageBucket:"admin-pannel-de3f4.firebasestorage.app",messagingSenderId:"318138798074",appId:"1:318138798074:web:0252256f3ddc783d815e43",measurementId:"G-CYXFXYN27Z"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const btnText=document.getElementById('btnText');
const btnLoader=document.getElementById('btnLoader');
const btnArrow=document.getElementById('btnArrow');
const loginBtn=document.getElementById('loginBtn');

function showToast(type,title,msg){
  const toast=document.getElementById('toast');
  const dot=document.getElementById('toastDot');
  dot.className='toast-dot '+type;
  document.getElementById('toastTitle').innerText=title;
  document.getElementById('toastMsg').innerText=msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3500);
}

window.login=async function(){
  const key=document.getElementById('key').value.trim();
  if(key===''){showToast('warning','Empty Key','Please enter your access key');return}

  btnText.style.display='none';btnArrow.style.display='none';btnLoader.style.display='block';loginBtn.disabled=true;

  try{
    const keyRef=ref(db,'keys/'+key);
    const snapshot=await get(keyRef);
    if(snapshot.exists()){
      const data=snapshot.val();
      const expiry=data.expiry||0;
      const now=Date.now();
      if(now>expiry){
        showToast('error','Key Expired','Your access key has expired. Contact admin.');
        btnText.style.display='block';btnArrow.style.display='block';btnLoader.style.display='none';loginBtn.disabled=false;
        return;
      }
      localStorage.setItem('premium','true');
      localStorage.setItem('accessKey',key);
      showToast('success','Access Granted','Login successful. Redirecting...');
      setTimeout(()=>window.location.href='home.html',1200);
    }else{
      showToast('error','Invalid Key','Access key not found in database');
    }
  }catch(err){
    console.log(err);
    showToast('error','Server Error','Firebase connection failed. Try again.');
  }

  btnText.style.display='block';btnArrow.style.display='block';btnLoader.style.display='none';loginBtn.disabled=false;
}

// Particles
const pc=document.getElementById('particles');
for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*5+'s';p.style.animationDuration=(4+Math.random()*4)+'s';pc.appendChild(p)}

// Eye toggle
window.toggleEye=function(){
  const inp=document.getElementById('key');
  const off=document.getElementById('eyeOff');
  const on=document.getElementById('eyeOn');
  if(inp.type==='password'){inp.type='text';off.style.display='none';on.style.display='block'}
  else{inp.type='password';off.style.display='block';on.style.display='none'}
}
</script>
</body>
</html>
