<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL PREDICTOR // ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--red:#ef4444;--red-light:#f87171;--red-dark:#dc2626;
--bg:#0a0a0a;--card:rgba(239,68,68,.03);--border:rgba(239,68,68,.1);
}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:#fff;overflow:hidden}

#matrix-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.35}
.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(239,68,68,.015) 2px,rgba(239,68,68,.015) 4px)}
.scanlines::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(239,68,68,.03) 50%,transparent 100%);
  animation:scan-move 4s ease-in-out infinite}
@keyframes scan-move{0%,100%{transform:translateY(-100%)}50%{transform:translateY(100%)}}

#particles-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

.page{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}

.back-btn{
  position:absolute;top:24px;left:24px;
  width:48px;height:48px;border-radius:50%;
  background:rgba(239,68,68,.08);border:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .3s ease;color:var(--red);text-decoration:none;z-index:10
}
.back-btn:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.25);transform:scale(1.08)}
.back-btn svg{width:22px;height:22px}

.card{
  width:100%;max-width:400px;padding:44px 36px 36px;
  background:var(--card);border:1px solid var(--border);
  border-radius:36px;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:60%;height:1px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.5}
.card::after{content:'';position:absolute;inset:0;border-radius:36px;
  background:radial-gradient(ellipse at 50% 0%,rgba(239,68,68,.06),transparent 70%);pointer-events:none}

.icon-box{
  width:88px;height:88px;border-radius:28px;margin:0 auto 28px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(239,68,68,.3),0 0 60px rgba(239,68,68,.1);
  position:relative
}
.icon-box::after{content:'';position:absolute;inset:-1px;border-radius:29px;
  background:linear-gradient(135deg,var(--red-light),var(--red-dark));z-index:-1;opacity:.4}
.icon-box svg{width:40px;height:40px;color:#fff}

.title{
  font-family:'Share Tech Mono',monospace;font-size:26px;font-weight:600;text-align:center;
  margin-bottom:6px;letter-spacing:3px
}
.title .g{color:var(--red)}
.subtitle{
  font-family:'Share Tech Mono',monospace;font-size:12px;text-align:center;
  color:var(--red);opacity:.7;margin-bottom:32px;letter-spacing:2px
}

.input-group{position:relative;margin-bottom:18px}
.input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--red);opacity:.5;pointer-events:none}
.input-icon svg{width:18px;height:18px}
.input-group input{
  width:100%;height:58px;border-radius:16px;border:1px solid var(--border);
  background:rgba(239,68,68,.04);color:#fff;font-family:'Space Grotesk',sans-serif;
  font-size:15px;padding:0 52px 0 48px;outline:none;transition:all .3s ease
}
.input-group input::placeholder{color:rgba(255,255,255,.25);font-family:'Share Tech Mono',monospace;font-size:13px}
.input-group input:focus{border-color:var(--red);box-shadow:0 0 20px rgba(239,68,68,.12)}
.eye-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(239,68,68,.08);color:var(--red);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .3s ease
}
.eye-toggle:hover{background:rgba(239,68,68,.15)}
.eye-toggle svg{width:18px;height:18px}

.validate-btn{
  width:100%;height:58px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;
  letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .3s ease;position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(239,68,68,.3)
}
.validate-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--red-light),var(--red));opacity:0;transition:opacity .3s}
.validate-btn:hover::before{opacity:1}
.validate-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(239,68,68,.4)}
.validate-btn:active{transform:translateY(0)}
.validate-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.validate-btn span,.validate-btn svg{position:relative;z-index:1}
.validate-btn .spinner{display:none;width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.validate-btn.loading .spinner{display:block}
.validate-btn.loading .btn-text,.validate-btn.loading .btn-arrow{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.info-rows{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;align-items:center;gap:10px}
.info-row svg{width:16px;height:16px;color:var(--red);opacity:.7;flex-shrink:0}
.info-row p{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.5px}

.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(120px);
  padding:14px 24px;border-radius:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  font-family:'Share Tech Mono',monospace;font-size:13px;
  display:flex;align-items:center;gap:10px;z-index:100;
  transition:transform .4s cubic-bezier(.175,.885,.32,1.275),opacity .3s;
  opacity:0;pointer-events:none;white-space:nowrap
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.25);color:#34d399}
.toast.error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.25);color:var(--red-light)}
.toast.warning{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.25);color:#fbbf24}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeIn .6s ease .2s both}
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="scanlines"></div>
<div id="particles-container"></div>

<div class="page">
  <a href="welcome.html" class="back-btn" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>

  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>

    <h1 class="title">VERIFY <span class="g">ACCESS</span></h1>
    <p class="subtitle">// PREMIUM SERVER LOGIN</p>

    <div class="input-group">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </span>
      <input type="password" id="keyInput" placeholder="Access Key" autocomplete="off" spellcheck="false">
      <button class="eye-toggle" id="eyeToggle" type="button" aria-label="Toggle visibility">
        <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 11-4.24-4.24"/></svg>
        <svg id="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="validate-btn" id="validateBtn" type="button">
      <span class="btn-text">VALIDATE KEY</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <div class="spinner"></div>
    </button>

    <div class="info-rows">
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <p>Firebase Encrypted</p>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <p>Expiry Detection Active</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="toastIcon"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="toastMsg"></span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",
  databaseURL: "https://admin-pannel-de3f4-default-rtdb.firebaseio.com",
  projectId: "admin-pannel-de3f4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Matrix Rain
(function(){
  const c = document.getElementById('matrix-canvas');
  const ctx = c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEF{}[]<>/:;=+*&#@$%';
  const fontSize=14;let columns,drops;
  function init(){columns=Math.floor(c.width/fontSize);drops=[];for(let i=0;i<columns;i++)drops[i]=Math.random()*-100}
  init();window.addEventListener('resize',init);
  function draw(){
    ctx.fillStyle='rgba(10,10,10,0.05)';ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#ef4444';ctx.font=fontSize+'px Share Tech Mono';
    for(let i=0;i<drops.length;i++){
      const t=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle=`rgba(239,68,68,${0.08+Math.random()*0.12})`;
      ctx.fillText(t,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>c.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// Particles
(function(){
  const container=document.getElementById('particles-container');
  const particleCount=40;
  for(let i=0;i<particleCount;i++){
    const p=document.createElement('div');
    const size=Math.random()*3+1;
    Object.assign(p.style,{
      position:'absolute',
      width:size+'px',height:size+'px',
      borderRadius:'50%',
      background:'rgba(239,68,68,'+(0.15+Math.random()*0.3)+')',
      left:Math.random()*100+'%',
      top:Math.random()*100+'%',
      animation:'float'+Math.floor(Math.random()*3)+' '+(8+Math.random()*12)+'s ease-in-out infinite',
      animationDelay:'-'+Math.random()*10+'s',
      pointerEvents:'none',
      boxShadow:'0 0 '+(size*3)+'px rgba(239,68,68,0.15)'
    });
    container.appendChild(p);
  }
  const style=document.createElement('style');
  style.textContent=`
    @keyframes float0{0%,100%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(30px,-40px) scale(1.3);opacity:.7}}
    @keyframes float1{0%,100%{transform:translate(0,0) scale(1);opacity:.2}50%{transform:translate(-25px,35px) scale(1.4);opacity:.6}}
    @keyframes float2{0%,100%{transform:translate(0,0) scale(1);opacity:.25}50%{transform:translate(20px,30px) scale(1.2);opacity:.8}}
  `;
  document.head.appendChild(style);
})();

// Toast
function showToast(msg,type='error'){
  const toast=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  const m=document.getElementById('toastMsg');
  toast.className='toast '+type;
  m.textContent=msg;
  if(type==='success')icon.innerHTML='<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
  else if(type==='warning')icon.innerHTML='<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>';
  else icon.innerHTML='<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
  requestAnimationFrame(()=>toast.classList.add('show'));
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>toast.classList.remove('show'),3500);
}

// Eye toggle
document.getElementById('eyeToggle').addEventListener('click',function(){
  const inp=document.getElementById('keyInput');
  const isPass=inp.type==='password';
  inp.type=isPass?'text':'password';
  document.getElementById('eyeOff').style.display=isPass?'none':'block';
  document.getElementById('eyeOn').style.display=isPass?'block':'none';
});

// Validate
document.getElementById('validateBtn').addEventListener('click',function(){
  const key=document.getElementById('keyInput').value.trim();
  if(!key){showToast('Enter a valid access key','warning');return}
  const btn=this;
  btn.classList.add('loading');btn.disabled=true;

  db.ref('keys/'+key).once('value')
    .then(snap=>{
      if(!snap.exists()){
        showToast('Invalid access key','error');
        btn.classList.remove('loading');btn.disabled=false;return;
      }
      const data=snap.val();
      if(data.expiry && data.expiry > Date.now()){
        localStorage.setItem('premium','true');
        localStorage.setItem('accessKey',key);
        showToast('Access granted','success');
        setTimeout(()=>window.location.href='home.html',800);
      } else {
        showToast('Key expired','error');
        btn.classList.remove('loading');btn.disabled=false;
      }
    })
    .catch(()=>{
      showToast('Connection failed','error');
      btn.classList.remove('loading');btn.disabled=false;
    });
});

document.getElementById('keyInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('validateBtn').click();
});
</script>
</body>
</html>
