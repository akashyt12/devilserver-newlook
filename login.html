<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEVIL LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#050505;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* APP */

.app{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    overflow:hidden;
    background:#050505;
}

/* MATRIX */

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.05;
}

/* GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
}

.glow1{
    width:260px;
    height:260px;
    background:#00ff8840;
    top:-120px;
    left:-100px;
}

.glow2{
    width:220px;
    height:220px;
    background:#00ff6640;
    bottom:-100px;
    right:-80px;
}

/* CENTER */

.center{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:24px;
}

/* CARD */

.card{
    width:100%;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(0,255,136,.14);

    backdrop-filter:blur(14px);

    border-radius:32px;

    padding:34px 24px;

    box-shadow:
    0 0 40px rgba(0,255,136,.08);
}

/* LOGO */

.logoBox{
    width:90px;
    height:90px;

    margin:auto;

    border-radius:28px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(0,255,136,.14);

    display:flex;
    justify-content:center;
    align-items:center;

    animation:float 3s ease-in-out infinite;
}

.logo{
    font-size:40px;
    color:#00ff88;

    text-shadow:
    0 0 18px rgba(0,255,136,.45);
}

/* TITLE */

.title{
    margin-top:26px;

    text-align:center;

    font-size:26px;
    font-weight:800;

    color:white;
}

.title span{
    color:#00ff88;

    text-shadow:
    0 0 14px rgba(0,255,136,.45);
}

/* SUB */

.sub{
    margin-top:10px;

    text-align:center;

    font-size:12px;

    color:#8d8d8d;

    letter-spacing:1.5px;
}

/* INPUT */

.inputBox{
    margin-top:30px;
    position:relative;
}

input{
    width:100%;
    height:58px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(0,255,136,.12);

    border-radius:18px;

    outline:none;

    padding:0 18px;

    color:white;

    font-size:15px;

    transition:.25s;
}

input:focus{
    border-color:#00ff88;

    box-shadow:
    0 0 0 4px rgba(0,255,136,.08);
}

input::placeholder{
    color:#777777;
}

/* BUTTON */

button{
    width:100%;
    height:58px;

    margin-top:18px;

    border:none;
    border-radius:18px;

    background:#00ff88;
    color:black;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:.22s;

    box-shadow:
    0 0 25px rgba(0,255,136,.28);
}

button:active{
    transform:scale(.97);
}

/* LOADER */

.loader{
    display:none;

    width:22px;
    height:22px;

    border-radius:50%;

    border:3px solid rgba(0,0,0,.2);
    border-top:3px solid black;

    animation:spin 1s linear infinite;
}

/* INFO */

.info{
    margin-top:18px;

    text-align:center;

    font-size:11px;

    color:#666666;

    line-height:18px;
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translateX(-50%) translateY(120px);

    min-width:280px;

    background:#101010;

    border:1px solid rgba(0,255,136,.18);

    border-radius:18px;

    padding:15px 18px;

    z-index:999;

    transition:.35s;

    box-shadow:
    0 0 25px rgba(0,255,136,.08);
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

.toastTitle{
    color:#00ff88;

    font-size:14px;
    font-weight:700;
}

.toastText{
    margin-top:4px;

    font-size:12px;

    color:#a0a0a0;
}

/* ANIMATION */

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

@keyframes float{

    50%{
        transform:translateY(-8px);
    }

}

/* MOBILE */

@media(max-width:360px){

.title{
    font-size:22px;
}

.card{
    padding:30px 20px;
}

.logoBox{
    width:82px;
    height:82px;
}

.logo{
    font-size:34px;
}

}

</style>
</head>

<body>

<div class="app">

    <!-- MATRIX -->

    <canvas id="matrix"></canvas>

    <!-- GLOW -->

    <div class="glow1"></div>
    <div class="glow2"></div>

    <!-- CENTER -->

    <div class="center">

        <!-- CARD -->

        <div class="card">

            <!-- LOGO -->

            <div class="logoBox">

                <div class="logo">
                    ⚡
                </div>

            </div>

            <!-- TITLE -->

            <div class="title">
                VERIFY <span>ACCESS</span>
            </div>

            <!-- SUB -->

            <div class="sub">
                PREMIUM SERVER LOGIN SYSTEM
            </div>

            <!-- INPUT -->

            <div class="inputBox">

                <input
                type="password"
                id="key"
                placeholder="Enter Access Key">

            </div>

            <!-- BUTTON -->

            <button onclick="login()">

                <span id="btnText">
                    VALIDATE KEY
                </span>

                <div class="loader"
                id="loader"></div>

            </button>

            <!-- INFO -->

            <div class="info">
                Secure Firebase Verification<br>
                Expiry Detection Enabled
            </div>

        </div>

    </div>

</div>

<!-- TOAST -->

<div class="toast" id="toast">

    <div class="toastTitle"
    id="toastTitle">

        Status

    </div>

    <div class="toastText"
    id="toastText">

        Message

    </div>

</div>

<!-- FIREBASE -->

<script type="module">

/* FIREBASE */

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",

authDomain: "admin-pannel-de3f4.firebaseapp.com",

databaseURL: "https://admin-pannel-de3f4-default-rtdb.firebaseio.com",

projectId: "admin-pannel-de3f4",

storageBucket: "admin-pannel-de3f4.firebasestorage.app",

messagingSenderId: "318138798074",

appId: "1:318138798074:web:0252256f3ddc783d815e43",

measurementId: "G-CYXFXYN27Z"

};

/* INIT */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* ELEMENTS */

const btnText =
document.getElementById('btnText');

const loader =
document.getElementById('loader');

/* TOAST */

function showToast(title,text){

    const toast =
    document.getElementById('toast');

    document.getElementById('toastTitle')
    .innerText = title;

    document.getElementById('toastText')
    .innerText = text;

    toast.classList.add('show');

    setTimeout(()=>{

        toast.classList.remove('show');

    },3000);

}

/* LOGIN */

window.login = async function(){

    const key =
    document.getElementById('key')
    .value
    .trim();

    if(key === ''){

        showToast(
        'Empty Key',
        'Please enter access key'
        );

        return;

    }

    btnText.style.display='none';

    loader.style.display='block';

    try{

        /* FIREBASE PATH */

        const keyRef =
        ref(db,'keys/' + key);

        const snapshot =
        await get(keyRef);

        if(snapshot.exists()){

            const data =
            snapshot.val();

            /* EXPIRY */

            const expiry =
            data.expiry || 0;

            const now =
            Date.now();

            if(now > expiry){

                showToast(
                'Key Expired',
                'Your access key has expired'
                );

                btnText.style.display='block';

                loader.style.display='none';

                return;

            }

            /* SAVE */

            localStorage.setItem(
            'premium',
            'true'
            );

            localStorage.setItem(
            'accessKey',
            key
            );

            showToast(
            'Access Granted',
            'Login successful'
            );

            setTimeout(()=>{

                window.location.href =
                'Home.html';

            },1200);

        }else{

            showToast(
            'Invalid Key',
            'Access key not found'
            );

        }

    }catch(err){

        console.log(err);

        showToast(
        'Server Error',
        'Firebase connection failed'
        );

    }

    btnText.style.display='block';

    loader.style.display='none';

}

/* MATRIX */

const canvas =
document.getElementById('matrix');

const ctx =
canvas.getContext('2d');

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const letters='01';

const fontSize=14;

const columns =
canvas.width/fontSize;

const drops=[];

for(let i=0;i<columns;i++){

    drops[i]=1;

}

function draw(){

    ctx.fillStyle='rgba(0,0,0,0.08)';

    ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
    );

    ctx.fillStyle='#00ff88';

    ctx.font=
    fontSize+'px monospace';

    for(let i=0;i<drops.length;i++){

        let text =
        letters[
        Math.floor(
        Math.random()*letters.length
        )
        ];

        ctx.fillText(
        text,
        i*fontSize,
        drops[i]*fontSize
        );

        if(
        drops[i]*fontSize >
        canvas.height &&
        Math.random()>0.97
        ){

            drops[i]=0;

        }

        drops[i]++;

    }

}

setInterval(draw,35);

</script>

</body>
</html>
