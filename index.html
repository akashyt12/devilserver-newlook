<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL PREDICTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#030712;color:#fff}

.loader-screen{position:fixed;inset:0;z-index:999;background:#030712;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .6s,visibility .6s}
.loader-screen.hidden{opacity:0;visibility:hidden}

/* ANIMATED BACKGROUND */
.bg-grid{position:fixed;inset:0;background-image:
  linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);
  background-size:60px 60px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{background-position:60px 60px}}

.bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(150px);opacity:.15;pointer-events:none}
.bg-glow-1{background:#10b981;top:-300px;left:50%;transform:translateX(-50%);animation:floatGlow 8s ease-in-out infinite}
.bg-glow-2{background:#059669;bottom:-300px;right:-200px;animation:floatGlow 10s ease-in-out infinite reverse}
@keyframes floatGlow{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(30px)}}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:#10b981;border-radius:50%;opacity:0;animation:particleFloat 4s ease-in-out infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh) scale(0)}50%{opacity:.6}100%{opacity:0;transform:translateY(-100px) scale(1)}}

/* CENTER CONTENT */
.loader-center{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:40px}

/* LOGO ANIMATION */
.logo-wrap{position:relative;width:140px;height:140px}
.logo-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#10b981;border-right-color:#10b981;animation:ringRotate 2s linear infinite}
.logo-ring:nth-child(2){inset:12px;border-top-color:#34d399;border-left-color:#34d399;animation-duration:3s;animation-direction:reverse}
.logo-ring:nth-child(3){inset:24px;border-bottom-color:#6ee7b7;border-right-color:#6ee7b7;animation-duration:1.5s}
@keyframes ringRotate{to{transform:rotate(360deg)}}

.logo-icon{position:absolute;inset:36px;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#10b981,#059669);border-radius:50%;box-shadow:0 0 60px rgba(16,185,129,.4),inset 0 0 30px rgba(255,255,255,.1);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 60px rgba(16,185,129,.4),inset 0 0 30px rgba(255,255,255,.1)}50%{box-shadow:0 0 80px rgba(16,185,129,.6),inset 0 0 40px rgba(255,255,255,.15)}}

.logo-svg{width:48px;height:48px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}

/* TEXT */
.loader-title{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,#fff 0%,#10b981 50%,#34d399 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:textGlow 3s ease-in-out infinite}
@keyframes textGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(16,185,129,.3))}50%{filter:drop-shadow(0 0 20px rgba(16,185,129,.5))}}

.loader-sub{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:#6b7280;font-weight:500}

/* PROGRESS BAR */
.progress-wrap{width:280px;display:flex;flex-direction:column;align-items:center;gap:12px}
.progress-bar{width:100%;height:3px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#10b981,#34d399,#6ee7b7);border-radius:10px;width:0%;transition:width .3s;box-shadow:0 0 15px rgba(16,185,129,.5)}
.progress-text{font-size:12px;color:#6b7280;letter-spacing:2px;font-weight:500}
.progress-pct{color:#10b981;font-weight:700;font-family:'Space Grotesk',sans-serif}

/* STATUS */
.status-dots{display:flex;gap:8px;align-items:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:statusPulse 1.5s ease-in-out infinite}
.status-dot:nth-child(2){animation-delay:.2s}
.status-dot:nth-child(3){animation-delay:.4s}
@keyframes statusPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.status-text{font-size:11px;color:#4b5563;letter-spacing:2px;margin-left:12px}

/* FOOTER */
.loader-footer{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:16px;z-index:10}
.footer-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,#10b981,transparent)}
.footer-text{font-size:10px;color:#374151;letter-spacing:3px;text-transform:uppercase}

@media(max-width:400px){
  .loader-title{font-size:26px;letter-spacing:3px}
  .logo-wrap{width:120px;height:120px}
  .logo-icon{inset:30px}
  .logo-svg{width:40px;height:40px}
}
</style>
</head>
<body>

<!-- BG EFFECTS -->
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="particles" id="particles"></div>

<!-- LOADER -->
<div class="loader-screen" id="loader">
  <div class="loader-center">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo-icon">
        <svg class="logo-svg" viewBox="0 0 24 24"><path d="M13 3L4 14h7l-2 7 9-11h-7l2-7z"/></svg>
      </div>
    </div>
    <div class="loader-title">DEVIL PREDICTOR</div>
    <div class="loader-sub">QUANTUM AI ENGINE</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text">INITIALIZING <span class="progress-pct" id="progressPct">0%</span></div>
    </div>
    <div class="status-dots">
      <div class="status-dot"></div>
      <div class="status-dot"></div>
      <div class="status-dot"></div>
      <div class="status-text">CONNECTING TO SERVERS</div>
    </div>
  </div>
  <div class="loader-footer">
    <div class="footer-line"></div>
    <div class="footer-text">Secure • Quantum • Fast</div>
  </div>
</div>

<script>
// Particles
const pc=document.getElementById('particles');
for(let i=0;i<30;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*4+'s';p.style.animationDuration=(3+Math.random()*3)+'s';pc.appendChild(p)}

// Progress
let pct=0;const fill=document.getElementById('progressFill');const pctEl=document.getElementById('progressPct');
const iv=setInterval(()=>{pct+=Math.random()*15+5;if(pct>=100){pct=100;clearInterval(iv);setTimeout(()=>{document.getElementById('loader').classList.add('hidden');setTimeout(()=>window.location.href='welcome.html',600)},400)}fill.style.width=pct+'%';pctEl.textContent=Math.floor(pct)+'%'},200);
</script>
</body>
</html>
