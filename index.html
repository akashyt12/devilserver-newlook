<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVIL PREDICTOR - Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        :root {
            --green: #10b981;
            --green-light: #34d399;
            --green-dark: #059669;
            --green-deep: #065f46;
            --bg: #070b14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg) 0%, #0a1a15 50%, var(--bg) 100%);
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lottie-wrapper {
            width: 200px;
            height: 200px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .title {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 12px;
            color: var(--green);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -16px;
        }

        .progress-container {
            width: 280px;
            height: 4px;
            background: var(--green-deep);
            margin-top: 20px;
        }

        .progress-bar {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.1s linear;
        }

        .loading-text {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 11px;
            color: var(--green-light);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .version {
            position: fixed;
            bottom: 30px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 11px;
            color: var(--green-deep);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="lottie-wrapper">
            <lottie-player
                src="https://assets2.lottiefiles.com/packages/lf20_9wmgvdqv.json"
                background="transparent"
                speed="1"
                style="width: 200px; height: 200px;"
                autoplay
            ></lottie-player>
        </div>
        <h1 class="title">DEVIL PREDICTOR</h1>
        <p class="subtitle">SECURE PREDICTION SYSTEM</p>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="loading-text" id="loadingText">INITIALIZING... 0%</p>
    </div>
    <p class="version">v4.0 • SECURE • FAST</p>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadingText = document.getElementById('loadingText');

        const interval = setInterval(() => {
            progress += Math.random() * 8 + 2;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                loadingText.textContent = 'READY';
                setTimeout(() => {
                    window.location.href = 'welcome.html';
                }, 500);
            }
            progressBar.style.width = progress + '%';
            loadingText.textContent = 'INITIALIZING... ' + Math.floor(progress) + '%';
        }, 80);
    </script>
</body>
</html>
