<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL PREDICTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
:root {
  --green: #10b981;
  --green-light: #34d399;
  --green-dark: #059669;
  --bg: #070b14;
  --card: rgba(16,185,129,.04);
  --border: rgba(16,185,129,.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* STATUS BAR */
.status-bar {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:12px 24px;
  border-bottom:1px solid var(--border);
  font-size:11px;
  font-weight:600;
  letter-spacing:3px;
  color:var(--green);
  opacity:0;
  animation:fadeIn .6s ease forwards;
}
.status-dot {
  width:8px; height:8px;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
  border-radius:0;
  animation:pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:.4; }
}

/* MAIN */
main {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px 20px;
  text-align:center;
}

/* LOTTIE */
.lottie-wrap {
  width:280px; height:280px;
  opacity:0;
  animation:fadeIn .8s ease .2s forwards;
}
lottie-player {
  width:100%; height:100%;
  border-radius:0;
}

/* TEXT */
.title {
  font-family:'DM Sans',sans-serif;
  font-size:48px;
  font-weight:700;
  color:#fff;
  margin-top:8px;
  opacity:0;
  animation:fadeSlideUp .7s ease .4s forwards;
}
.subtitle {
  font-size:13px;
  font-weight:500;
  color:var(--green);
  letter-spacing:4px;
  margin-top:12px;
  opacity:0;
  animation:fadeSlideUp .7s ease .55s forwards;
}

/* FEATURES */
.features {
  display:flex;
  gap:16px;
  margin-top:48px;
  flex-wrap:wrap;
  justify-content:center;
}
.feature-card {
  background:var(--card);
  border:1px solid var(--border);
  padding:28px 32px;
  text-align:center;
  min-width:150px;
  opacity:0;
  transition:background .3s, border-color .3s;
}
.feature-card:nth-child(1) { animation:slideUp .6s ease .7s forwards; }
.feature-card:nth-child(2) { animation:slideUp .6s ease .85s forwards; }
.feature-card:nth-child(3) { animation:slideUp .6s ease 1s forwards; }
.feature-card:hover {
  background:rgba(16,185,129,.08);
  border-color:var(--green-dark);
}
.feature-card svg {
  width:28px; height:28px;
  fill:none;
  stroke:var(--green);
  stroke-width:1.8;
  stroke-linecap:square;
  margin-bottom:14px;
}
.feature-card span {
  display:block;
  font-size:11px;
  font-weight:600;
  letter-spacing:3px;
  color:var(--green-light);
}

/* BUTTONS */
.btns {
  display:flex;
  gap:16px;
  margin-top:48px;
  flex-wrap:wrap;
  justify-content:center;
}
.btn {
  display:inline-block;
  padding:14px 40px;
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:2px;
  border-radius:0;
  border:1px solid transparent;
  cursor:pointer;
  text-decoration:none;
  opacity:0;
  transition:all .25s;
  animation:fadeIn .6s ease 1.15s forwards;
}
.btn:hover { transform:scale(1.04); }
.btn:active { transform:scale(.97); }
.btn-primary {
  background:var(--green);
  color:var(--bg);
  border-color:var(--green);
}
.btn-primary:hover { background:var(--green-light); border-color:var(--green-light); }
.btn-secondary {
  background:transparent;
  color:var(--green);
  border-color:var(--green);
}
.btn-secondary:hover { background:rgba(16,185,129,.1); }

/* FOOTER */
footer {
  padding:24px;
  text-align:center;
  font-size:11px;
  font-weight:500;
  letter-spacing:3px;
  color:rgba(16,185,129,.5);
  border-top:1px solid var(--border);
  opacity:0;
  animation:fadeIn .6s ease 1.3s forwards;
}

/* KEYFRAMES */
@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}
@keyframes fadeSlideUp {
  from { opacity:0; transform:translateY(24px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(40px); }
  to { opacity:1; transform:translateY(0); }
}

@media (max-width:600px) {
  .title { font-size:32px; }
  .features { flex-direction:column; align-items:center; }
  .feature-card { width:100%; max-width:260px; }
}
</style>
</head>
<body>

<div class="status-bar">
  <div class="status-dot"></div>
  SYSTEM ONLINE
</div>

<main>
  <div class="lottie-wrap">
    <lottie-player
      src="https://assets5.lottiefiles.com/packages/lf20_VAm4gY.json"
      background="transparent"
      speed="1"
      loop
      autoplay>
    </lottie-player>
  </div>

  <h1 class="title">DEVIL PREDICTOR</h1>
  <p class="subtitle">QUANTUM PREDICTION ENGINE</p>

  <div class="features">
    <div class="feature-card">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.25 3.75 10.05 9 11 5.25-.95 9-5.75 9-11V7l-9-5z"/></svg>
      <span>SECURE</span>
    </div>
    <div class="feature-card">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
      <span>FAST</span>
    </div>
    <div class="feature-card">
      <svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9c0 3.4 2.1 6.3 5 7.4V22h8v-3.6c2.9-1.1 5-4 5-7.4a9 9 0 0 0-9-9z"/><path d="M10 20v-6H8v6"/><path d="M16 20v-6h-2v6"/><path d="M12 10V8"/><path d="M9 12h6"/></svg>
      <span>AI POWER</span>
    </div>
  </div>

  <div class="btns">
    <a href="login.html" class="btn btn-primary">GET STARTED</a>
    <a href="https://t.me/" target="_blank" class="btn btn-secondary">JOIN COMMUNITY</a>
  </div>
</main>

<footer>SECURE &bull; FAST &bull; RELIABLE</footer>

</body>
</html>
