<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL PREDICTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#030712;color:#fff}

/* BG */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{background-position:60px 60px}}
.bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
.bg-glow-1{background:#10b981;top:-250px;left:50%;transform:translateX(-50%)}
.bg-glow-2{background:#059669;bottom:-250px;left:-150px}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:#10b981;border-radius:50%;opacity:0;animation:particleFloat 5s ease-in-out infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh) scale(0)}50%{opacity:.5}100%{opacity:0;transform:translateY(-100px) scale(1)}}

/* MAIN */
.main{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;animation:fadeIn 1s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* TOP STATUS */
.top-status{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.15);border-radius:100px;backdrop-filter:blur(20px);animation:slideDown .8s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.status-pulse{width:8px;height:8px;background:#10b981;border-radius:50%;animation:pulse 2s ease-in-out infinite;box-shadow:0 0 10px #10b981}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.status-label{font-size:11px;color:#6b7280;letter-spacing:2px;text-transform:uppercase;font-weight:500}

/* LOGO */
.logo-outer{position:relative;width:160px;height:160px;margin-bottom:48px}
.logo-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(5,150,105,.05));border:1px solid rgba(16,185,129,.12);border-radius:44px;backdrop-filter:blur(20px);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.logo-inner{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#10b981,#059669);border-radius:28px;display:flex;justify-content:center;align-items:center;box-shadow:0 20px 60px rgba(16,185,129,.3),0 0 40px rgba(16,185,129,.2);position:relative;z-index:2}
.logo-icon::after{content:'';position:absolute;inset:-2px;border-radius:30px;background:linear-gradient(135deg,#10b981,transparent,#34d399);z-index:-1;opacity:.5}
.logo-svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

/* TITLE */
.title-wrap{text-align:center;margin-bottom:16px}
.title{font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:700;letter-spacing:2px;line-height:1.1}
.title .highlight{background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:14px;color:#6b7280;letter-spacing:4px;text-transform:uppercase;margin-top:8px;font-weight:400}

/* FEATURES */
.features{display:flex;gap:24px;margin:40px 0}
.feature{display:flex;flex-direction:column;align-items:center;gap:8px}
.feature-icon{width:48px;height:48px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.12);border-radius:16px;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(10px)}
.feature-icon svg{width:22px;height:22px;stroke:#10b981;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feature-text{font-size:11px;color:#6b7280;letter-spacing:1px;text-transform:uppercase;font-weight:500}

/* BUTTONS */
.btn-group{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.btn{width:100%;height:60px;border:none;border-radius:20px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:all .3s ease;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:opacity .3s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 40px rgba(16,185,129,.3)}
.btn-primary:hover::before{opacity:1}
.btn-secondary{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);color:#10b981;backdrop-filter:blur(10px)}
.btn-secondary:hover{background:rgba(16,185,129,.1)}
.btn-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* DIVIDER */
.divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.3),transparent);margin:24px 0}

/* BOTTOM */
.bottom-info{text-align:center;margin-top:auto;padding-bottom:20px}
.version{font-size:10px;color:#374151;letter-spacing:2px;text-transform:uppercase}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding:20px 32px;padding-bottom:calc(20px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(3,7,18,.95),transparent);backdrop-filter:blur(20px)}
.nav-indicator{width:134px;height:5px;background:rgba(255,255,255,.1);border-radius:100px;margin:0 auto 12px}

@media(max-width:400px){
  .title{font-size:34px}
  .logo-outer{width:130px;height:130px}
  .logo-icon{width:65px;height:65px}
  .features{gap:16px}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="particles" id="particles"></div>

<div class="top-status">
  <div class="status-pulse"></div>
  <div class="status-label">AI Engine Online</div>
</div>

<div class="main">
  <div class="logo-outer">
    <div class="logo-bg"></div>
    <div class="logo-inner">
      <div class="logo-icon">
        <svg class="logo-svg" viewBox="0 0 24 24"><path d="M13 3L4 14h7l-2 7 9-11h-7l2-7z"/></svg>
      </div>
    </div>
  </div>

  <div class="title-wrap">
    <div class="title">DEVIL <span class="highlight">PREDICTOR</span></div>
    <div class="subtitle">Quantum Prediction Engine</div>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="feature-text">Secure</div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="feature-text">Fast</div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </div>
      <div class="feature-text">AI Power</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="location.href='login.html'">
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      START NOW
    </button>
    <button class="btn btn-secondary" onclick="window.open('https://t.me/','_blank')">
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      JOIN TELEGRAM
    </button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-indicator"></div>
</div>

<script>
const pc=document.getElementById('particles');
for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*5+'s';p.style.animationDuration=(4+Math.random()*4)+'s';pc.appendChild(p)}
</script>
</body>
</html>
