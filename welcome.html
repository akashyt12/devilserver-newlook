<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--emerald:#10b981;
--emerald-light:#34d399;
--emerald-dark:#059669;
--emerald-lighter:#6ee7b7;
--bg:#030712;
--card:rgba(255,255,255,.02);
--border:rgba(255,255,255,.06);
--blur:blur(40px);
--text:#f9fafb;
--muted:#6b7280;
--dim:#374151;
}
html{scroll-behavior:smooth}
body{
font-family:'DM Sans',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
position:relative;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}

/* ── GRID OVERLAY ── */
body::before{
content:'';
position:fixed;
inset:0;
background-image:
  linear-gradient(rgba(16,185,129,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(16,185,129,.04) 1px,transparent 1px);
background-size:60px 60px;
z-index:0;
pointer-events:none;
}

/* ── RADIAL BLOBS ── */
.blob{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;opacity:.35}
.blob-1{
width:600px;height:600px;
background:radial-gradient(circle,rgba(16,185,129,.45),transparent 70%);
top:-200px;left:-150px;
animation:blobFloat1 14s ease-in-out infinite;
}
.blob-2{
width:500px;height:500px;
background:radial-gradient(circle,rgba(5,150,105,.35),transparent 70%);
bottom:-180px;right:-100px;
animation:blobFloat2 18s ease-in-out infinite;
}
.blob-3{
width:350px;height:350px;
background:radial-gradient(circle,rgba(52,211,153,.25),transparent 70%);
top:50%;left:50%;
transform:translate(-50%,-50%);
animation:blobFloat3 22s ease-in-out infinite;
}
@keyframes blobFloat1{
0%,100%{transform:translate(0,0) scale(1)}
25%{transform:translate(80px,60px) scale(1.1)}
50%{transform:translate(-40px,100px) scale(.95)}
75%{transform:translate(60px,-30px) scale(1.05)}
}
@keyframes blobFloat2{
0%,100%{transform:translate(0,0) scale(1)}
25%{transform:translate(-70px,-50px) scale(1.08)}
50%{transform:translate(50px,-80px) scale(.92)}
75%{transform:translate(-30px,40px) scale(1.03)}
}
@keyframes blobFloat3{
0%,100%{transform:translate(-50%,-50%) scale(1)}
33%{transform:translate(-40%,-60%) scale(1.15)}
66%{transform:translate(-60%,-40%) scale(.9)}
}

/* ── PARTICLES ── */
.particle{
position:fixed;
border-radius:50%;
pointer-events:none;
z-index:1;
background:var(--emerald);
opacity:0;
animation:particleDrift linear infinite;
}
@keyframes particleDrift{
0%{opacity:0;transform:translateY(100vh) scale(0)}
10%{opacity:1}
90%{opacity:1}
100%{opacity:0;transform:translateY(-10vh) scale(1)}
}

/* ── MAIN CONTENT ── */
.page{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;min-height:100vh}

/* ── FADE UP ── */
.fade-up{
opacity:0;
transform:translateY(30px);
transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1);
}
.fade-up.visible{opacity:1;transform:translateY(0)}

/* ── STATUS BAR ── */
.status-bar{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
z-index:1000;
display:flex;
align-items:center;
gap:10px;
padding:10px 24px;
background:rgba(3,7,18,.6);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid var(--border);
border-radius:100px;
font-family:'Outfit',sans-serif;
font-size:12px;
font-weight:500;
letter-spacing:3px;
color:var(--muted);
text-transform:uppercase;
}
.status-dot{
width:8px;height:8px;
border-radius:50%;
background:var(--emerald);
animation:pulse 2s ease-in-out infinite;
box-shadow:0 0 12px var(--emerald);
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* ── LOGO SECTION ── */
.logo-section{
perspective:800px;
margin-top:140px;
margin-bottom:40px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}
.logo-float{
animation:logoFloat 4s ease-in-out infinite;
transform-style:preserve-3d;
}
@keyframes logoFloat{
0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}
25%{transform:translateY(-14px) rotateX(4deg) rotateY(3deg)}
50%{transform:translateY(-8px) rotateX(-2deg) rotateY(-2deg)}
75%{transform:translateY(-16px) rotateX(3deg) rotateY(-4deg)}
}
.logo-wrap{position:relative;width:180px;height:180px}

/* Pulsing rings */
.logo-ring{
position:absolute;
inset:-20px;
border:1.5px solid rgba(16,185,129,.25);
border-radius:50%;
animation:ringPulse 3s ease-in-out infinite;
}
.logo-ring:nth-child(2){inset:-40px;animation-delay:.8s;opacity:.5}
@keyframes ringPulse{
0%,100%{transform:scale(1);opacity:.3}
50%{transform:scale(1.06);opacity:.7}
}

.logo-box{
width:180px;height:180px;
border-radius:24px;
background:rgba(255,255,255,.03);
border:1px solid var(--border);
backdrop-filter:var(--blur);
-webkit-backdrop-filter:var(--blur);
display:flex;
align-items:center;
justify-content:center;
position:relative;
z-index:2;
box-shadow:0 0 60px rgba(16,185,129,.15),0 0 120px rgba(16,185,129,.06);
}
.logo-inner{
width:90px;height:90px;
border-radius:20px;
background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 32px rgba(16,185,129,.35);
}
.logo-inner svg{width:44px;height:44px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}

/* ── TITLE ── */
.title-section{
text-align:center;
margin-bottom:50px;
}
.title-line{
font-family:'Outfit',sans-serif;
font-size:48px;
font-weight:900;
line-height:1;
letter-spacing:-1px;
}
.title-devil{color:#fff}
.title-predictor{
background:linear-gradient(135deg,var(--emerald),var(--emerald-light));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.subtitle{
font-family:'DM Sans',sans-serif;
font-size:13px;
font-weight:500;
color:var(--muted);
letter-spacing:5px;
margin-top:16px;
text-transform:uppercase;
}
.version-badge{
display:inline-flex;
align-items:center;
margin-top:16px;
padding:6px 16px;
border-radius:100px;
background:rgba(16,185,129,.1);
border:1px solid rgba(16,185,129,.2);
color:var(--emerald);
font-family:'Outfit',sans-serif;
font-size:12px;
font-weight:600;
letter-spacing:2px;
}

/* ── FEATURE CARDS ── */
.features{
display:flex;
gap:24px;
margin-bottom:60px;
flex-wrap:wrap;
justify-content:center;
}
.feature-card{
width:140px;
padding:28px 16px 22px;
border-radius:18px;
background:var(--card);
border:1px solid var(--border);
backdrop-filter:var(--blur);
-webkit-backdrop-filter:var(--blur);
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
cursor:default;
transition:all .4s cubic-bezier(.4,0,.2,1);
}
.feature-card:hover{
transform:translateY(-6px);
border-color:rgba(16,185,129,.25);
box-shadow:0 12px 40px rgba(16,185,129,.1);
}
.feature-icon{
width:56px;height:56px;
border-radius:16px;
border:1px solid rgba(16,185,129,.2);
background:rgba(16,185,129,.04);
display:flex;
align-items:center;
justify-content:center;
}
.feature-icon svg{width:26px;height:26px;color:var(--emerald)}
.feature-label{
font-family:'DM Sans',sans-serif;
font-size:11px;
font-weight:500;
color:var(--muted);
letter-spacing:1px;
text-transform:uppercase;
}

/* ── GAME SHOWCASE ── */
.game-section{
width:100%;
max-width:800px;
margin-bottom:60px;
padding:0 20px;
}
.game-header{
display:flex;
align-items:center;
gap:16px;
margin-bottom:28px;
justify-content:center;
}
.section-title{
font-family:'Outfit',sans-serif;
font-size:14px;
font-weight:600;
letter-spacing:4px;
color:var(--muted);
text-transform:uppercase;
}
.section-line{
flex:1;
height:1px;
background:linear-gradient(90deg,rgba(16,185,129,.3),transparent);
}
.game-track-wrap{
overflow:hidden;
border-radius:20px;
background:var(--card);
border:1px solid var(--border);
backdrop-filter:var(--blur);
-webkit-backdrop-filter:var(--blur);
padding:20px 0;
position:relative;
}
.game-track-wrap::before,.game-track-wrap::after{
content:'';
position:absolute;
top:0;bottom:0;width:80px;z-index:2;pointer-events:none;
}
.game-track-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.game-track-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}

.game-track{
display:flex;
gap:16px;
animation:scrollGames 30s linear infinite;
width:max-content;
}
.game-track:hover{animation-play-state:paused}
@keyframes scrollGames{
0%{transform:translateX(0)}
100%{transform:translateX(-50%)}
}
.game-item{
position:relative;
flex-shrink:0;
cursor:pointer;
}
.game-logo{
width:64px;height:64px;
border-radius:16px;
object-fit:cover;
border:1px solid var(--border);
transition:all .3s cubic-bezier(.4,0,.2,1);
display:block;
background:rgba(255,255,255,.03);
}
.game-item:hover .game-logo{
transform:scale(1.15);
border-color:rgba(16,185,129,.3);
box-shadow:0 8px 24px rgba(16,185,129,.15);
}
.game-tooltip{
position:absolute;
bottom:calc(100% + 10px);
left:50%;
transform:translateX(-50%) translateY(4px);
padding:6px 14px;
border-radius:10px;
background:rgba(3,7,18,.9);
border:1px solid var(--border);
font-family:'DM Sans',sans-serif;
font-size:11px;
font-weight:600;
color:var(--text);
letter-spacing:.5px;
white-space:nowrap;
opacity:0;
pointer-events:none;
transition:all .25s ease;
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
}
.game-tooltip::after{
content:'';
position:absolute;
top:100%;left:50%;
transform:translateX(-50%);
border:5px solid transparent;
border-top-color:rgba(255,255,255,.06);
}
.game-item:hover .game-tooltip{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── STATS ── */
.stats{
display:flex;
gap:20px;
margin-bottom:50px;
flex-wrap:wrap;
justify-content:center;
}
.stat-card{
padding:28px 36px;
border-radius:18px;
background:var(--card);

backdrop-filter:var(--blur);
-webkit-backdrop-filter:var(--blur);
text-align:center;
min-width:140px;

}
.stat-card:hover{
border-color:rgba(16,185,129,.2);

}
.stat-value{
font-family:'Outfit',sans-serif;
font-size:32px;
font-weight:800;
background:linear-gradient(135deg,var(--emerald),var(--emerald-light));

-webkit-text-fill-color:transparent;

line-height:1.2;
}
.stat-label{
font-family:'DM Sans',sans-serif;
font-size:12px;
font-weight:500;
color:var(--muted);
letter-spacing:2px;
text-transform:uppercase;
margin-top:6px;
}

/* ── BUTTONS ── */
.btn-group{
display:flex;
gap:16px;
margin-bottom:60px;
flex-wrap:wrap;
justify-content:center;
}
.btn{
height:64px;
padding:0 40px;
border-radius:18px;
font-family:'Outfit',sans-serif;
font-size:15px;
font-weight:600;
letter-spacing:1.5px;
cursor:pointer;
border:none;
display:inline-flex;
align-items:center;
gap:12px;
transition:all .4s cubic-bezier(.4,0,.2,1);
text-decoration:none;
text-transform:uppercase;
position:relative;
overflow:hidden;
}
.btn:active{transform:scale(.96)}

.btn-primary{
background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));
color:#fff;
box-shadow:0 4px 24px rgba(16,185,129,.3);
}
.btn-primary:hover{
box-shadow:0 8px 40px rgba(16,185,129,.45);
transform:translateX(2px);
}
.btn-primary svg{width:20px;height:20px;transition:transform .3s ease}
.btn-primary:hover svg{transform:translateX(4px)}

.btn-secondary{
background:rgba(16,185,129,.04);
border:1px solid rgba(16,185,129,.15);
color:var(--emerald);
}
.btn-secondary:hover{background:rgba(16,185,129,.08)}
.btn-secondary svg{width:20px;height:20px}

/* ── FOOTER ── */
.footer{
padding:40px 20px;
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
}
.footer-text{
font-family:'DM Sans',sans-serif;
font-size:11px;
font-weight:500;
color:#4b5563;
letter-spacing:4px;

.footer-devil svg{width:20px;height:20px;color:var(--emerald);opacity:.5}

/* ── RESPONSIVE ── */
@media(max-width:640px){
.title-line{font-size:36px}
.subtitle{font-size:11px;letter-spacing:3px}
.features{gap:14px}
.feature-card{width:110px;padding:20px 12px 16px}
.feature-icon{width:48px;height:48px}

.btn{height:56px;padding:0 28px;font-size:13px}
.game-logo{width:52px;height:52px;border-radius:12px}
.game-item{gap:0}
}
</style>
</head>

<script>
/* ── PARTICLES ── */
(function(){
const container=document.getElementById('particles');
const count=35;
for(let i=0;i<count;i++){
const p=document.createElement('div');
p.className='particle';
const size=Math.random()*3+1;
const duration=Math.random()*18+12;
const delay=Math.random()*20;
const left=Math.random()*100;
const drift=(Math.random()-.5)*120;
p.style.cssText=`
  width:${size}px;height:${size}px;
  left:${left}%;
  animation-duration:${duration}s;
  animation-delay:${delay}s;
  --drift:${drift}px;
`;
p.animate([
  {opacity:0,transform:`translateY(100vh) translateX(0) scale(0)`},
  {opacity:.6,offset:.15},
  {opacity:.6,offset:.85},
  {opacity:0,transform:`translateY(-10vh) translateX(${drift}px) scale(1)`}
],{
  duration:duration*1000,
  delay:delay*1000,
  iterations:Infinity,
  easing:'linear'
});
container.appendChild(p);
}
})();

/* ── DUPLICATE GAME TRACK FOR SEAMLESS LOOP ── */
(function(){
const track=document.getElementById('gameTrack');
const clone=track.innerHTML;
track.insertAdjacentHTML('beforeend',clone);
})();

/* ── INTERSECTION OBSERVER FOR FADE-UP ── */
(function(){
const observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      observer.unobserve(e.target);
    }
  });
},{threshold:0.15});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
})();
</script>
</body>
</html>
