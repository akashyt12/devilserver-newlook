<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL PREDICTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--emerald:#10b981;--emerald-light:#34d399;--emerald-dark:#059669;--bg:#030712;--card:rgba(255,255,255,.02);--border:rgba(255,255,255,.06);--text:#f9fafb;--muted:#6b7280;--dim:#374151}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}

/* BG */
.bg{position:fixed;inset:0;z-index:0}
.bg::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% -20%,rgba(16,185,129,.15),transparent),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(5,150,105,.1),transparent)}
.bg-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(16,185,129,.02) 1px,transparent 1px),
  linear-gradient(90deg,rgba(16,185,129,.02) 1px,transparent 1px);
  background-size:80px 80px;animation:gridShift 30s linear infinite}
@keyframes gridShift{to{background-position:80px 80px}}

.aurora{position:fixed;inset:0;overflow:hidden;z-index:0}
.aurora-beam{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:conic-gradient(from 180deg,transparent,rgba(16,185,129,.04),transparent,rgba(52,211,153,.03),transparent);animation:auroraRotate 20s linear infinite;filter:blur(60px)}
@keyframes auroraRotate{to{transform:rotate(360deg)}}

.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:0}
.orb-1{width:400px;height:400px;background:rgba(16,185,129,.1);top:-200px;left:50%;transform:translateX(-50%)}
.orb-2{width:300px;height:300px;background:rgba(5,150,105,.08);bottom:-150px;right:-100px}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;border-radius:50%;animation:particleRise linear infinite}
@keyframes particleRise{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

/* STATUS PILL */
.status-pill{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.12);border-radius:100px;backdrop-filter:blur(20px);animation:slideDown .8s ease-out both}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-30px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.pulse-dot{width:8px;height:8px;background:var(--emerald);border-radius:50%;box-shadow:0 0 12px var(--emerald);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 12px var(--emerald)}50%{box-shadow:0 0 24px var(--emerald),0 0 48px rgba(16,185,129,.3)}}
.pulse-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

/* MAIN */
.main{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px}

/* LOGO - 3D TILT */
.logo-scene{perspective:800px;margin-bottom:48px}
.logo-3d{width:160px;height:160px;transform-style:preserve-3d;animation:logoFloat 5s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:rotateX(5deg) rotateY(-5deg) translateY(0)}50%{transform:rotateX(-5deg) rotateY(5deg) translateY(-15px)}}
.logo-bg{width:100%;height:100%;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.12);border-radius:44px;backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;position:relative;transform:translateZ(30px)}
.logo-bg::before{content:'';position:absolute;inset:-1px;border-radius:45px;background:linear-gradient(135deg,var(--emerald),transparent,var(--emerald-light));opacity:.15;z-index:-1}
.logo-bg::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:60%;height:20px;background:rgba(16,185,129,.15);filter:blur(20px);border-radius:50%}
.logo-icon-wrap{width:80px;height:80px;background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));border-radius:28px;display:flex;justify-content:center;align-items:center;box-shadow:0 20px 60px rgba(16,185,129,.35),0 0 40px rgba(16,185,129,.2),inset 0 1px 0 rgba(255,255,255,.2);position:relative;z-index:2}
.logo-icon-wrap svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}

/* RING EFFECT */
.ring-pulse{position:absolute;inset:-20px;border:1px solid rgba(16,185,129,.1);border-radius:50%;animation:ringPulse 3s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.3);opacity:0}}

/* TITLE */
.title-wrap{text-align:center;animation:fadeUp 1s ease-out .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.title{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;letter-spacing:2px;line-height:1.1}
.title .g{background:linear-gradient(135deg,var(--emerald),var(--emerald-light),#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:gradientShift 4s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.subtitle{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:5px;text-transform:uppercase;margin-top:10px}

/* FEATURES */
.features{display:flex;gap:32px;margin:40px 0;animation:fadeUp 1s ease-out .5s both}
.feature{display:flex;flex-direction:column;align-items:center;gap:10px}
.feature-icon{width:56px;height:56px;background:var(--card);border:1px solid var(--border);border-radius:18px;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(10px);transition:all .3s;position:relative;overflow:hidden}
.feature-icon::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(16,185,129,.05),transparent);opacity:0;transition:opacity .3s}
.feature-icon:hover::before{opacity:1}
.feature-icon:hover{border-color:rgba(16,185,129,.2);transform:translateY(-2px)}
.feature-icon svg{width:24px;height:24px;stroke:var(--emerald);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feature-text{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

/* DIVIDER */
.divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.2),transparent);margin:24px 0;animation:fadeUp 1s ease-out .6s both}

/* BUTTONS */
.btn-group{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;animation:fadeUp 1s ease-out .7s both}
.btn{width:100%;height:62px;border:none;border-radius:20px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:12px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .3s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;box-shadow:0 12px 40px rgba(16,185,129,.35),0 0 0 1px rgba(16,185,129,.3)}
.btn-primary:hover::before{opacity:1}
.btn-primary:hover{box-shadow:0 16px 50px rgba(16,185,129,.45),0 0 0 1px rgba(16,185,129,.4)}
.btn-secondary{background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.12);color:var(--emerald);backdrop-filter:blur(10px)}
.btn-secondary:hover{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* FOOTER */
.footer{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px}
.footer-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--emerald),transparent);opacity:.2}
.footer-text{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:4px;text-transform:uppercase}

/* NAV INDICATOR */
.nav-ind{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,.08);border-radius:100px;z-index:100;margin-bottom:8px}

@media(max-width:400px){
  .title{font-size:36px}
  .logo-3d{width:130px;height:130px}
  .logo-bg{border-radius:36px}
  .logo-icon-wrap{width:65px;height:65px;border-radius:22px}
  .features{gap:20px}
}
</style>
</head>
<body>

<div class="bg"><div class="bg-grid"></div></div>
<div class="aurora"><div class="aurora-beam"></div></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="particles" id="particles"></div>

<div class="status-pill">
  <div class="pulse-dot"></div>
  <div class="pulse-label">AI Engine Online</div>
</div>

<div class="main">
  <div class="logo-scene">
    <div class="logo-3d">
      <div class="ring-pulse"></div>
      <div class="logo-bg">
        <div class="logo-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-2 7 9-11h-7l2-7z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="title-wrap">
    <div class="title">DEVIL <span class="g">PREDICTOR</span></div>
    <div class="subtitle">Quantum Prediction Engine</div>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="feature-text">Secure</div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="feature-text">Fast</div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </div>
      <div class="feature-text">AI Power</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="location.href='login.html'">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      START NOW
    </button>
    <button class="btn btn-secondary" onclick="window.open('https://t.me/','_blank')">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      JOIN TELEGRAM
    </button>
  </div>
</div>

<div class="footer">
  <div class="footer-line"></div>
  <div class="footer-text">Quantum • Secure • Fast</div>
</div>

<div class="nav-ind"></div>

<script>
const pc=document.getElementById('particles');
for(let i=0;i<30;i++){
  const p=document.createElement('div');p.className='p';
  const size=Math.random()*3+1;
  p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:hsl(${150+Math.random()*30},${70+Math.random()*30}%,${60+Math.random()*30}%);animation-delay:${Math.random()*6}s;animation-duration:${4+Math.random()*6}s;opacity:${.2+Math.random()*.4}`;
  pc.appendChild(p);
}

// Parallax on tilt
document.addEventListener('mousemove',e=>{
  const logo=document.querySelector('.logo-3d');
  if(!logo)return;
  const x=(e.clientX/window.innerWidth-.5)*15;
  const y=(e.clientY/window.innerHeight-.5)*15;
  logo.style.transform=`rotateX(${-y}deg) rotateY(${x}deg) translateY(${logo.matches(':hover')?0:0}px)`;
});
</script>
</body>
</html>
