<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devil Predictor - AI Prediction Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap')
:root{--bg:#030712;--g1:#10b981;--g2:#34d399;--g3:#6ee7b7;--g4:#059669;--glass:rgba(255,255,255,.02);--glass-border:rgba(255,255,255,.06);--glass-blur:blur(20px)}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative}

.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;animation:blobFloat 12s ease-in-out infinite alternate}
.blob-1{width:600px;height:600px;background:radial-gradient(circle,var(--g1),transparent 70%);top:-200px;left:-100px}
.blob-2{width:500px;height:500px;background:radial-gradient(circle,var(--g4),transparent 70%);bottom:-200px;right:-100px;animation-delay:-4s}
.blob-3{width:400px;height:400px;background:radial-gradient(circle,var(--g2),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s}
@keyframes blobFloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.1)}100%{transform:translate(-20px,30px) scale(.95)}}

.grid-overlay{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

.particles-layer{position:fixed;inset:0;z-index:1;pointer-events:none}

.main-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:48px;padding:40px 20px;width:100%;max-width:480px}

/* Status Pill */
.status-pill{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:50px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);z-index:100;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:.1s}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--g1);box-shadow:0 0 12px var(--g1),0 0 24px var(--g1);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.status-text{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;color:var(--g2);text-transform:uppercase}

/* 3D Logo */
.logo-scene{perspective:800px;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:.3s}
.logo-float{transform-style:preserve-3d;animation:logoFloat 4s ease-in-out infinite;position:relative}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}25%{transform:translateY(-12px) rotateX(4deg) rotateY(3deg)}50%{transform:translateY(-6px) rotateX(-2deg) rotateY(-4deg)}75%{transform:translateY(-14px) rotateX(3deg) rotateY(2deg)}}
.logo-container{width:160px;height:160px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);display:flex;align-items:center;justify-content:center;position:relative}
.logo-icon-box{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--g1),var(--g4));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(16,185,129,.3)}
.logo-icon-box svg{width:40px;height:40px}
.ring-pulse{position:absolute;inset:-12px;border-radius:36px;border:1px solid rgba(16,185,129,.15);animation:ringPulse 3s ease-out infinite;pointer-events:none}
.ring-pulse:nth-child(2){inset:-24px;border-radius:44px;animation-delay:1s;opacity:.5}
@keyframes ringPulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

/* Title */
.title-group{text-align:center;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:.5s}
.title{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;color:#fff;line-height:1.1}
.title .gradient{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-family:'Inter',sans-serif;font-size:12px;color:#6b7280;letter-spacing:5px;text-transform:uppercase;margin-top:12px}

/* Feature Cards */
.features{display:flex;gap:20px;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:.7s}
.feature-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.feature-icon{width:56px;height:56px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1)}
.feature-icon:hover{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.06);transform:translateY(-2px)}
.feature-icon svg{width:24px;height:24px;stroke:var(--g1);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.feature-label{font-size:11px;color:#6b7280;letter-spacing:1px;text-transform:uppercase;font-weight:500}

/* Divider */
.divider{width:80px;height:2px;border-radius:1px;background:linear-gradient(90deg,transparent,var(--g1),var(--g2),var(--g1),transparent);animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:.9s}

/* Buttons */
.buttons{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:1.1s}
.btn{position:relative;height:62px;border-radius:20px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g4));color:#fff;box-shadow:0 4px 24px rgba(16,185,129,.25)}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--g2),var(--g1));opacity:0;transition:opacity .3s cubic-bezier(.4,0,.2,1);border-radius:20px}
.btn-primary:hover{box-shadow:0 8px 40px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-primary:hover::before{opacity:1}
.btn-primary:active{transform:scale(.96)}
.btn-primary span{position:relative;z-index:1}
.btn-secondary{background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.12);color:var(--g1)}
.btn-secondary::before{content:'';position:absolute;inset:0;background:rgba(16,185,129,.08);opacity:0;transition:opacity .3s cubic-bezier(.4,0,.2,1);border-radius:20px}
.btn-secondary:hover{border-color:rgba(16,185,129,.3);transform:translateY(-1px)}
.btn-secondary:hover::before{opacity:1}
.btn-secondary:active{transform:scale(.96)}
.btn-secondary span{position:relative;z-index:1}

/* Footer */
.footer{text-align:center;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;animation-delay:1.3s;padding-bottom:20px}
.footer-text{font-size:11px;color:#4b5563;letter-spacing:4px;text-transform:uppercase}

/* Animations */
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}

/* Particles */
.particle{position:absolute;width:2px;height:2px;background:var(--g1);border-radius:50%;opacity:.3;animation:particleDrift linear infinite}
@keyframes particleDrift{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-100vh) translateX(40px);opacity:0}}

@media(max-width:500px){
.title{font-size:32px}
.features{gap:12px}
.feature-icon{width:48px;height:48px;border-radius:14px}
.feature-icon svg{width:20px;height:20px}
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grid-overlay"></div>
<div class="particles-layer" id="particles"></div>

<div class="status-pill">
  <div class="status-dot"></div>
  <span class="status-text">AI Engine Online</span>
</div>

<div class="main-content">
  <div class="logo-scene">
    <div class="logo-float">
      <div class="ring-pulse"></div>
      <div class="ring-pulse"></div>
      <div class="logo-container">
        <div class="logo-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="title-group">
    <h1 class="title">DEVIL <span class="gradient">PREDICTOR</span></h1>
    <p class="subtitle">Quantum Prediction Engine</p>
  </div>

  <div class="features">
    <div class="feature-card">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      </div>
      <span class="feature-label">Secure</span>
    </div>
    <div class="feature-card">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span class="feature-label">Quantum</span>
    </div>
    <div class="feature-card">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 3-2 5.5-4 7.5L12 19l-3-2.5C7 14.5 5 12 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      </div>
      <span class="feature-label">Fast</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="buttons">
    <a href="login.html" class="btn btn-primary"><span>Get Started</span></a>
    <a href="https://t.me/" class="btn btn-secondary" target="_blank" rel="noopener"><span>Join Telegram</span></a>
  </div>
</div>

<div class="footer">
  <p class="footer-text">Secure &bull; Quantum &bull; Fast</p>
</div>

<script>
(function(){
  var layer=document.getElementById('particles');
  for(var i=0;i<30;i++){
    var p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.top=Math.random()*100+'%';
    p.style.width=p.style.height=(Math.random()*2+1)+'px';
    p.style.animationDuration=(Math.random()*12+8)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';
    layer.appendChild(p);
  }
})();
</script>
</body>
</html>
