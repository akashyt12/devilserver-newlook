<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEVIL PREDICTOR - Select Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #030712;
            --emerald: #10b981;
            --emerald-light: #34d399;
            --emerald-dark: #059669;
            --emerald-lighter: #6ee7b7;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #6b7280;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: var(--emerald-dark);
            top: -100px;
            left: -100px;
            animation: float1 15s ease-in-out infinite;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: var(--emerald);
            top: 50%;
            right: -80px;
            animation: float2 18s ease-in-out infinite;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: var(--emerald-lighter);
            bottom: 10%;
            left: 20%;
            animation: float3 20s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, -40px); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--emerald);
            border-radius: 50%;
            opacity: 0.4;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.5); }
        }

        /* Top Navigation */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px;
        }

        .nav-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--emerald);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .header-title span {
            background: linear-gradient(135deg, var(--emerald), var(--emerald-lighter));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-input {
            width: 52px;
            height: 52px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 0 16px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .search-input:focus {
            width: 160px;
            border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.05);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .telegram-btn {
            width: 44px;
            height: 44px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .telegram-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--emerald);
        }

        .telegram-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--emerald);
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-lighter));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px 12px;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--emerald);
            font-weight: 600;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--emerald);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px);
            animation: cardEntry 0.6s ease forwards;
        }

        .game-card:hover {
            border-color: var(--emerald);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.15);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card:nth-child(1) { animation-delay: 0.05s; }
        .game-card:nth-child(2) { animation-delay: 0.1s; }
        .game-card:nth-child(3) { animation-delay: 0.15s; }
        .game-card:nth-child(4) { animation-delay: 0.2s; }
        .game-card:nth-child(5) { animation-delay: 0.25s; }
        .game-card:nth-child(6) { animation-delay: 0.3s; }
        .game-card:nth-child(7) { animation-delay: 0.35s; }
        .game-card:nth-child(8) { animation-delay: 0.4s; }
        .game-card:nth-child(9) { animation-delay: 0.45s; }
        .game-card:nth-child(10) { animation-delay: 0.5s; }
        .game-card:nth-child(11) { animation-delay: 0.55s; }
        .game-card:nth-child(12) { animation-delay: 0.6s; }

        .game-image {
            position: relative;
            aspect-ratio: 1.2;
            overflow: hidden;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .game-image img {
            transform: scale(1.08);
        }

        .game-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(3, 7, 18, 0.9), transparent);
            pointer-events: none;
        }

        .game-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .badge-hot {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.9);
            color: white;
        }

        .badge-new {
            background: rgba(59, 130, 246, 0.9);
            color: white;
        }

        .badge-vip {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white;
        }

        .badge-trend {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: white;
        }

        .badge-best {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
        }

        .game-body {
            padding: 14px;
        }

        .game-name {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .game-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-1min {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-1min:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-30sec {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            background: transparent;
            color: var(--emerald);
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-30sec:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--emerald);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: rgba(3, 7, 18, 0.9);
            border-top: 1px solid var(--glass-border);
            padding: 12px 24px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .bottom-nav-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .nav-item.active svg {
            stroke: var(--emerald);
        }

        .nav-item span {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-item.active span {
            color: var(--emerald);
        }

        .nav-item:hover svg {
            stroke: var(--emerald);
        }

        .nav-item:hover span {
            color: var(--emerald);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--emerald-dark);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
        <div class="grid-bg"></div>
        <div id="particles"></div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-content">
            <a href="login.html" class="back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <div class="header-info">
                <div class="header-subtitle">WELCOME BACK</div>
                <div class="header-title">DEVIL <span>PREDICTOR</span></div>
            </div>
            <input type="text" class="search-input" placeholder="Search..." oninput="searchGame(this.value)">
            <a href="https://t.me/" target="_blank" class="telegram-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7.5a2.25 2.25 0 0 0 .126 4.073l4.138 1.3 1.818 5.455a2.25 2.25 0 0 0 3.935.937l2.25-2.25a2.25 2.25 0 0 0 .618-1.706l-.126-4.073 3.75-1.5a2.25 2.25 0 0 0 1.353-2.073l-.6-3a2.25 2.25 0 0 0-2.614-1.412zM10.5 16.5l-1.5-4.5 8.25-3.75-6 6z"/>
                </svg>
            </a>
        </div>
    </nav>

    <!-- Stats Row -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value">12</div>
            <div class="stat-label">GAMES</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">2</div>
            <div class="stat-label">MODES</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">AI</div>
            <div class="stat-label">ENGINE</div>
        </div>
    </div>

    <!-- Section Header -->
    <div class="section-header">
        <h2 class="section-title">Select Game</h2>
        <div class="live-badge">
            <span class="live-dot"></span>
            ALL LIVE
        </div>
    </div>

    <!-- Games Grid -->
    <div class="games-grid" id="gamesGrid"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-content">
            <a href="home.html" class="nav-item active">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>HOME</span>
            </a>
            <a href="support.html" class="nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>SUPPORT</span>
            </a>
        </div>
    </nav>

    <script>
        const games = [
            { key: 'okwin', name: 'OKWIN', desc: 'Instant Win Games', img: 'image1.png', badge: 'hot' },
            { key: '51game', name: '51 GAME', desc: 'Color Prediction', img: 'image2.png', badge: 'live' },
            { key: '55club', name: '55 CLUB', desc: 'Number Games', img: 'image3.png', badge: 'hot' },
            { key: '82lottery', name: '82 LOTTERY', desc: 'Lottery Draws', img: 'image4.png', badge: 'new' },
            { key: 'dmwin', name: 'DM WIN', desc: 'Quick Win Games', img: 'image5.png', badge: 'hot' },
            { key: 'jaiclub', name: 'JAI CLUB', desc: 'Premium Games', img: 'image6.png', badge: 'vip' },
            { key: 'yaarwin', name: 'YAARWIN', desc: 'Fast Win Games', img: 'image7.png', badge: 'hot' },
            { key: 'bdgwin', name: 'BDG WIN', desc: 'Live Games', img: 'image8.png', badge: 'live' },
            { key: 'bigmumbai', name: 'BIG MUMBAI', desc: 'Trending Games', img: 'image9.png', badge: 'trend' },
            { key: 'tiranga', name: 'TIRANGA', desc: 'Live Prediction', img: 'image10.png', badge: 'live' },
            { key: 'tashanwin', name: 'TASHAN WIN', desc: 'Best Win Games', img: 'image11.png', badge: 'best' },
            { key: 'sikkim', name: 'SIKKIM', desc: 'New Win Games', img: 'image12.png', badge: 'new' }
        ];

        function renderGames(filter = '') {
            const grid = document.getElementById('gamesGrid');
            const filtered = games.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()));
            
            grid.innerHTML = filtered.map((game, i) => `
                <div class="game-card" style="animation-delay: ${i * 0.05}s">
                    <div class="game-image">
                        <img src="${game.img}" alt="${game.name}" loading="lazy">
                        <span class="game-badge badge-${game.badge}">${game.badge.toUpperCase()}</span>
                    </div>
                    <div class="game-body">
                        <div class="game-name">${game.name}</div>
                        <div class="game-desc">${game.desc}</div>
                        <div class="game-buttons">
                            <button class="btn-1min" onclick="go('${game.key}', '1min')">1 MIN</button>
                            <button class="btn-30sec" onclick="go('${game.key}', '30sec')">30 SEC</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function go(key, timer) {
            localStorage.setItem('selectedGame', key);
            localStorage.setItem('selectedTimer', timer);
            window.location.href = 'mode.html';
        }

        function searchGame(q) {
            renderGames(q);
        }

        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particle.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();
        renderGames();
    </script>
</body>
</html>
