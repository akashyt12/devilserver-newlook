<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEVIL HOME</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
width:100%;
height:100vh;
overflow:hidden;
background:#050505;
font-family:'Inter',sans-serif;
display:flex;
justify-content:center;
color:white;
}

.app{
position:relative;
width:100%;
max-width:430px;
height:100vh;
overflow:hidden;
background:#050505;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
opacity:.05;
}

.glow1,.glow2{
position:absolute;
border-radius:50%;
filter:blur(90px);
z-index:0;
}

.glow1{
width:240px;
height:240px;
background:#00ff8840;
top:-120px;
left:-80px;
}

.glow2{
width:220px;
height:220px;
background:#00ff6640;
bottom:-100px;
right:-60px;
}

.fixedTop{
position:absolute;
top:0;
left:0;
width:100%;
z-index:10;
padding-bottom:18px;
background:linear-gradient(to bottom,#050505 85%,transparent);
backdrop-filter:blur(18px);
}

.header{
padding:28px 22px 12px;
}

.small{
font-size:12px;
color:#7d7d7d;
letter-spacing:1px;
}

.title{
margin-top:6px;
font-size:30px;
font-weight:800;
color:white;
}

.title span{
color:#00ff88;
text-shadow:0 0 20px rgba(0,255,136,.4);
}

.searchBox{
padding:0 22px;
margin-top:10px;
}

.search{
width:100%;
height:56px;
border:none;
outline:none;
padding:0 20px;
background:rgba(12,12,12,.7);
border:1px solid rgba(255,255,255,.06);
border-radius:20px;
font-size:14px;
color:white;
backdrop-filter:blur(16px);
box-shadow:
0 0 20px rgba(0,255,136,.06),
inset 0 0 12px rgba(255,255,255,.02);
}

.search::placeholder{
color:#666;
}

.games{
position:absolute;
top:170px;
left:0;
width:100%;
height:calc(100vh - 170px);
overflow-y:auto;
padding:22px;
padding-top:10px;
z-index:2;
scroll-behavior:smooth;
}

.games::-webkit-scrollbar{
width:0;
}

.card{
background:rgba(12,12,12,.96);
border:1px solid #1a1a1a;
border-radius:28px;
padding:20px;
margin-bottom:18px;
backdrop-filter:blur(14px);
box-shadow:0 0 25px rgba(0,255,136,.05);
transition:.2s;
}

.card:active{
transform:scale(.98);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
align-items:center;
gap:14px;
}

.logo{
width:56px;
height:56px;
border-radius:18px;
object-fit:cover;
border:1px solid #1f1f1f;
box-shadow:0 0 18px rgba(0,255,136,.08);
}

.game{
font-size:19px;
font-weight:700;
color:white;
}

.badge{
padding:7px 13px;
border-radius:12px;
background:#00ff8815;
border:1px solid #00ff8830;
color:#00ff88;
font-size:11px;
font-weight:700;
letter-spacing:1px;
}

.sub{
margin-top:14px;
font-size:12px;
line-height:18px;
color:#7d7d7d;
}

.row{
display:flex;
gap:12px;
margin-top:20px;
}

.btn{
flex:1;
height:50px;
border:none;
border-radius:16px;
background:#00ff88;
color:black;
font-size:13px;
font-weight:700;
cursor:pointer;
transition:.2s;
box-shadow:0 0 20px rgba(0,255,136,.22);
}

.btn:active{
transform:scale(.96);
}

.btn2{
background:#101010;
color:#00ff88;
border:1px solid #1f1f1f;
box-shadow:none;
}

.space{
height:40px;
}

@media(max-width:360px){

.title{
font-size:25px;
}

.card{
padding:18px;
}

.logo{
width:50px;
height:50px;
}

.game{
font-size:17px;
}

.games{
top:165px;
height:calc(100vh - 165px);
}

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="app">

<div class="glow1"></div>
<div class="glow2"></div>

<div class="fixedTop">

<div class="header">

<div class="small">
WELCOME BACK 👋
</div>

<div class="title">
DEVIL <span>PREDICTOR</span>
</div>

</div>

<div class="searchBox">

<input type="text"
class="search"
id="search"
placeholder="Search games..."
onkeyup="searchGame()">

</div>

</div>

<div class="games" id="gamesContainer">

<script>

const games = [

["OKWIN","image1.png","HOT","AI Prediction Available","okwin"],
["51 GAME","image2.png","LIVE","Smart Signal System","game51"],
["55 CLUB","image3.png","HOT","Fast Prediction Access","club55"],
["82 LOTTERY","image4.png","NEW","Neural AI Analyzer","lottery82"],
["DM WIN","image5.png","HOT","Advanced Win Mode","dmwin"],
["JAI CLUB","image6.png","VIP","Premium AI Detection","jaiclub"],
["YAARWIN","image7.png","HOT","Real Time Signal Engine","yaarwin"],
["BDG WIN","image8.png","LIVE","High Accuracy Prediction","bdgwin"],
["BIG MUMBAI","image9.png","TREND","Fast Win Prediction","bigmumbai"],
["TIRANGA","image10.png","LIVE","AI Smart Prediction","tiranga"],
["TASHAN WIN","image11.png","BEST","Good Win Prediction","tashanwin"],
["SIKKIM","image12.png","NEW","Sikkim AI Engine","sikkim"]

];

const container =
document.getElementById('gamesContainer');

games.forEach(g=>{

container.innerHTML += `

<div class="card gameCard">

<div class="top">

<div class="left">

<img src="${g[1]}" class="logo">

<div class="game">${g[0]}</div>

</div>

<div class="badge">${g[2]}</div>

</div>

<div class="sub">${g[3]}</div>

<div class="row">

<button class="btn"
onclick="go('1m','${g[4]}')">
1 MIN
</button>

<button class="btn btn2"
onclick="go('30s','${g[4]}')">
30 SEC
</button>

</div>

</div>

`;

});

container.innerHTML += `<div class="space"></div>`;

</script>

</div>

</div>

<script>

/* MATRIX */

const canvas =
document.getElementById('matrix');

const ctx =
canvas.getContext('2d');

function resizeCanvas(){

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
'resize',
resizeCanvas
);

const letters='01';
const fontSize=14;
let columns = canvas.width/fontSize;
let drops=[];

function resetDrops(){

columns = canvas.width/fontSize;
drops=[];

for(let i=0;i<columns;i++){

drops[i]=1;

}

}

resetDrops();

function draw(){

ctx.fillStyle='rgba(0,0,0,0.08)';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle='#00ff88';
ctx.font=fontSize+'px monospace';

for(let i=0;i<drops.length;i++){

let text =
letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(
text,
i*fontSize,
drops[i]*fontSize
);

if(
drops[i]*fontSize > canvas.height &&
Math.random()>0.97
){

drops[i]=0;

}

drops[i]++;

}

}

setInterval(draw,35);

/* SEARCH */

function searchGame(){

let input =
document.getElementById('search')
.value
.toLowerCase();

let cards =
document.querySelectorAll('.gameCard');

cards.forEach(card=>{

let game =
card.querySelector('.game')
.innerText
.toLowerCase();

card.style.display =
game.includes(input)
? 'block'
: 'none';

});

}

/* GAME DATA */

const gameData = {

okwin:{
name:'OKWIN',
image:'image1.png'
},

game51:{
name:'51 GAME',
image:'image2.png'
},

club55:{
name:'55 CLUB',
image:'image3.png'
},

lottery82:{
name:'82 LOTTERY',
image:'image4.png'
},

dmwin:{
name:'DM WIN',
image:'image5.png'
},

jaiclub:{
name:'JAI CLUB',
image:'image6.png'
},

yaarwin:{
name:'YAARWIN',
image:'image7.png'
},

bdgwin:{
name:'BDG WIN',
image:'image8.png'
},

bigmumbai:{
name:'BIG MUMBAI',
image:'image9.png'
},

tiranga:{
name:'TIRANGA',
image:'image10.png'
},

tashanwin:{
name:'TASHAN WIN',
image:'image11.png'
},

sikkim:{
name:'SIKKIM',
image:'image12.png'
}

};

/* GO */

function go(type,gameKey){

if(!gameData[gameKey]){

alert("Game not found");
return;

}

const selectedData = {

name: gameData[gameKey].name,
image: gameData[gameKey].image,
timer: type

};

localStorage.setItem(
'selectedGame',
JSON.stringify(selectedData)
);

window.location.href='Mode.html';

}

</script>

</body>
</html>
