<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SELECT GAME</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--green:#10b981;--green-light:#34d399;--green-dark:#059669;
--bg:#070b14;--card:rgba(16,185,129,.04);--border:rgba(16,185,129,.12);
--text:#ffffff;--text-dim:rgba(255,255,255,.5);--text-mid:rgba(255,255,255,.7);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
body{padding-bottom:100px}

/* TOP STICKY */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(7,11,20,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 16px;border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;gap:12px}
.back-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn:active{background:var(--green);border-color:var(--green)}
.back-btn svg{width:18px;height:18px;stroke:var(--green-light);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top-title{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.top-title span{color:var(--green)}
.search-wrap{margin-top:12px;position:relative}
.search-input{width:100%;height:44px;background:rgba(16,185,129,.05);border:1px solid var(--border);padding:0 14px 0 40px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--green)}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.search-icon svg{width:18px;height:18px;stroke:var(--text-dim);fill:none;stroke-width:2;stroke-linecap:round}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat-card{background:var(--card);border:1px solid var(--border);padding:16px 10px;text-align:center;animation:fadeUp .5s ease both}
.stat-val{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:800;color:var(--green)}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim);margin-top:4px}

/* SECTION */
.section-head{padding:8px 16px 10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:.8px;color:var(--text-mid);text-transform:uppercase}
.no-results{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px;display:none}

/* GRID */
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}

/* CARD */
.game-card{background:var(--card);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .25s;animation:fadeUp .5s ease both}
.game-card:active{transform:scale(.97)}
.game-card:hover{border-color:rgba(16,185,129,.3)}

.card-img{width:100%;aspect-ratio:16/10;position:relative;overflow:hidden;background:rgba(16,185,129,.06)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .icon-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(5,150,105,.05))}
.card-img .icon-fallback svg{width:44px;height:44px;stroke:var(--green);fill:none;stroke-width:1.5}
.card-img .overlay{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,rgba(7,11,20,.9),transparent)}

.badge{position:absolute;top:8px;left:8px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border:1px solid}
.badge-hot{background:rgba(16,185,129,.15);color:var(--green-light);border-color:rgba(16,185,129,.3)}
.badge-live{background:rgba(52,211,153,.15);color:var(--green-light);border-color:rgba(52,211,153,.3)}
.badge-new{background:rgba(16,185,129,.2);color:var(--green);border-color:rgba(16,185,129,.4)}
.badge-vip{background:rgba(5,150,105,.15);color:var(--green-dark);border-color:rgba(5,150,105,.3)}

.card-body{padding:10px 12px 12px}
.card-name{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{height:34px;border:none;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.btn:active{transform:scale(.96)}
.btn-green{background:var(--green);color:var(--bg)}
.btn-green:active{background:var(--green-light)}
.btn-outline{background:transparent;border:1px solid var(--green);color:var(--green)}
.btn-outline:active{background:rgba(16,185,129,.1)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.game-card:nth-child(1){animation-delay:.05s}
.game-card:nth-child(2){animation-delay:.1s}
.game-card:nth-child(3){animation-delay:.15s}
.game-card:nth-child(4){animation-delay:.2s}
.game-card:nth-child(5){animation-delay:.25s}
.game-card:nth-child(6){animation-delay:.3s}
.game-card:nth-child(7){animation-delay:.35s}
.game-card:nth-child(8){animation-delay:.4s}
.game-card:nth-child(9){animation-delay:.45s}
.game-card:nth-child(10){animation-delay:.5s}
.game-card:nth-child(11){animation-delay:.55s}
.game-card:nth-child(12){animation-delay:.6s}
.stat-card:nth-child(1){animation-delay:.05s}
.stat-card:nth-child(2){animation-delay:.1s}
.stat-card:nth-child(3){animation-delay:.15s}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-row">
    <div class="back-btn" onclick="location.href='login.html'">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <div class="top-title">SELECT <span>GAME</span></div>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" class="search-input" placeholder="Search games..." id="searchInput" oninput="searchGame()">
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-val">12</div><div class="stat-lbl">Games</div></div>
  <div class="stat-card"><div class="stat-val">2</div><div class="stat-lbl">Modes</div></div>
  <div class="stat-card"><div class="stat-val">AI</div><div class="stat-lbl">Engine</div></div>
</div>

<div class="section-head">ALL GAMES</div>
<div class="no-results" id="noResults">No games found</div>
<div class="games-grid" id="gamesGrid"></div>

<script>
const GAMES=[
{key:'OKWIN',name:'OKWIN',img:'image1.png',badge:'hot'},
{key:'51GAME',name:'51 GAME',img:'image2.png',badge:'live'},
{key:'55CLUB',name:'55 CLUB',img:'image3.png',badge:'new'},
{key:'82LOTTERY',name:'82 LOTTERY',img:'image4.png',badge:'hot'},
{key:'DMWIN',name:'DM WIN',img:'image5.png',badge:'live'},
{key:'JAICLUB',name:'JAI CLUB',img:'image6.png',badge:'new'},
{key:'YAARWIN',name:'YAARWIN',img:'image7.png',badge:'hot'},
{key:'BDGWIN',name:'BDG WIN',img:'image8.png',badge:'vip'},
{key:'BIGMUMBAI',name:'BIG MUMBAI',img:'image9.png',badge:'live'},
{key:'TIRANGA',name:'TIRANGA',img:'image10.png',badge:'new'},
{key:'TASHANWIN',name:'TASHAN WIN',img:'image11.png',badge:'hot'},
{key:'SIKKIM',name:'SIKKIM',img:'image12.png',badge:'vip'}
];

function go(key,timer){
  localStorage.setItem('selectedGame',key);
  localStorage.setItem('selectedTimer',timer);
  location.href='mode.html';
}

function imgErr(el){
  el.style.display='none';
  el.nextElementSibling.style.display='flex';
}

function searchGame(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const cards=document.querySelectorAll('.game-card');
  let found=0;
  cards.forEach(c=>{
    const name=c.dataset.name.toLowerCase();
    const show=name.includes(q);
    c.style.display=show?'':'none';
    if(show)found++;
  });
  document.getElementById('noResults').style.display=found?'none':'block';
  document.getElementById('gamesGrid').style.display=found?'grid':'none';
}

function renderGames(){
  const g=document.getElementById('gamesGrid');
  g.innerHTML=GAMES.map((gm,i)=>{
    const bcls='badge-'+gm.badge;
    const btext=gm.badge.toUpperCase();
    return `<div class="game-card" data-name="${gm.name}" style="animation-delay:${(i*0.05).toFixed(2)}s">
      <div class="card-img">
        <img src="${gm.img}" alt="${gm.name}" onerror="imgErr(this)">
        <div class="icon-fallback"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="1"/><path d="M8 2v20M16 2v20M2 8h20M2 16h20"/></svg></div>
        <div class="overlay"></div>
        <div class="badge ${bcls}">${btext}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${gm.name}</div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="event.stopPropagation();go('${gm.key}',60)">1 MIN</button>
          <button class="btn btn-outline" onclick="event.stopPropagation();go('${gm.key}',30)">30 SEC</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

renderGames();
</script>
</body>
</html>
