<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEVIL PREDICTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#ef4444;--red-light:#f87171;--red-dark:#dc2626;
  --bg:#0a0a0a;--card:rgba(239,68,68,.03);--border:rgba(239,68,68,.1);
  --glow:rgba(239,68,68,.15);--glass:rgba(255,255,255,.04);
  --text:#e5e5e5;--muted:#737373;--dim:#525252;
}
html{scroll-behavior:smooth}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
canvas#matrix{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.12}
.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(239,68,68,.015) 2px,rgba(239,68,68,.015) 4px);
}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;background:var(--red);
  border-radius:50%;animation:floatUp linear infinite;
  box-shadow:0 0 6px var(--red),0 0 12px var(--red-dark);
}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:.6}
  100%{transform:translateY(-10vh) scale(1.5);opacity:0}
}
.content{position:relative;z-index:2;max-width:480px;margin:0 auto;padding-bottom:100px}

.top-section{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(10,10,10,.85);
  border-bottom:1px solid var(--border);
  padding:16px 20px 12px;
}
.top-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header-left{display:flex;flex-direction:column;gap:2px}
.welcome-back{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--muted);letter-spacing:3px;text-transform:uppercase;
}
.title-main{
  font-family:'Space Grotesk',sans-serif;font-size:28px;
  font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,#fff 0%,var(--red-light) 50%,var(--red) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.title-main .g{
  color:var(--red);-webkit-text-fill-color:var(--red);
  text-shadow:0 0 20px var(--glow),0 0 40px rgba(239,68,68,.2);
}
.telegram-btn{
  width:44px;height:44px;border-radius:12px;
  background:var(--glass);border:1px solid var(--border);
  backdrop-filter:blur(10px);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:all .3s;
  color:var(--red);font-size:20px;
}
.telegram-btn:hover{
  background:rgba(239,68,68,.1);border-color:var(--red);
  box-shadow:0 0 20px var(--glow);
}
.search-wrap{position:relative}
.search-input{
  width:100%;height:52px;border-radius:14px;padding:0 20px 0 48px;
  background:var(--glass);border:1px solid var(--border);
  color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;
  outline:none;transition:all .3s;
}
.search-input::placeholder{color:var(--dim)}
.search-input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--glow)}
.search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:16px;pointer-events:none;
}

.stats-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:16px 20px 8px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 10px;text-align:center;
  transition:all .3s;
}
.stat-card:hover{border-color:var(--red);box-shadow:0 0 15px var(--glow)}
.stat-val{
  font-family:'Space Grotesk',sans-serif;font-size:24px;
  font-weight:700;color:var(--red);
}
.stat-label{
  font-size:11px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:1px;
}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 12px;
}
.section-title{
  font-family:'Space Grotesk',sans-serif;font-size:18px;
  font-weight:600;color:#fff;
}
.live-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;font-size:11px;
  font-weight:600;text-transform:uppercase;letter-spacing:1px;
  background:rgba(239,68,68,.12);color:var(--red);
  border:1px solid rgba(239,68,68,.25);
  animation:pulseBadge 2s ease-in-out infinite;
}
.live-badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--red);animation:blink 1.5s ease-in-out infinite;
}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.games-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  padding:0 20px;
}
.game-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  opacity:0;transform:translateY(30px);
  animation:cardIn .6s ease forwards;
}
.game-card:nth-child(1){animation-delay:.05s}
.game-card:nth-child(2){animation-delay:.1s}
.game-card:nth-child(3){animation-delay:.15s}
.game-card:nth-child(4){animation-delay:.2s}
.game-card:nth-child(5){animation-delay:.25s}
.game-card:nth-child(6){animation-delay:.3s}
.game-card:nth-child(7){animation-delay:.35s}
.game-card:nth-child(8){animation-delay:.4s}
.game-card:nth-child(9){animation-delay:.45s}
.game-card:nth-child(10){animation-delay:.5s}
.game-card:nth-child(11){animation-delay:.55s}
.game-card:nth-child(12){animation-delay:.6s}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}
.game-card:hover{
  border-color:var(--red);
  box-shadow:0 0 25px var(--glow),0 8px 32px rgba(0,0,0,.4);
  transform:translateY(-4px) !important;
}
.card-img{
  position:relative;width:100%;aspect-ratio:1.2;
  overflow:hidden;background:rgba(239,68,68,.03);
}
.card-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .5s;
}
.game-card:hover .card-img img{transform:scale(1.08)}
.card-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(10,10,10,.95) 100%);
}
.card-badge{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:3px 10px;border-radius:6px;font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:1px;
}
.badge-hot{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(239,68,68,.5)}
.badge-live{background:var(--red-dark);color:#fff;animation:blink 1.5s ease-in-out infinite}
.badge-new{background:#3b82f6;color:#fff}
.badge-vip{background:#a855f7;color:#fff}
.badge-trend{background:#f97316;color:#fff}
.badge-best{background:var(--red);color:#fff}
.card-info{padding:12px 12px 14px}
.card-name{
  font-family:'Space Grotesk',sans-serif;font-size:14px;
  font-weight:600;color:#fff;margin-bottom:3px;
}
.card-desc{
  font-size:11px;color:var(--muted);margin-bottom:10px;
  line-height:1.4;
}
.card-btns{display:flex;gap:6px}
.btn{
  flex:1;height:34px;border-radius:8px;border:none;
  font-family:'Outfit',sans-serif;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;justify-content:center;
  gap:4px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  color:#fff;box-shadow:0 2px 10px rgba(239,68,68,.3);
}
.btn-primary:hover{box-shadow:0 4px 20px rgba(239,68,68,.5);transform:translateY(-1px)}
.btn-secondary{
  background:var(--glass);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{border-color:var(--red);color:var(--red)}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(10,10,10,.9);
  border-top:1px solid var(--border);
  padding:10px 20px;padding-bottom:max(10px,env(safe-area-inset-bottom));
}
.nav-inner{
  display:flex;align-items:center;justify-content:center;
  gap:40px;max-width:480px;margin:0 auto;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;
  gap:4px;cursor:pointer;transition:all .3s;
  padding:4px 16px;border-radius:12px;
  text-decoration:none;
}
.nav-item.active{background:rgba(239,68,68,.1)}
.nav-item.active .nav-icon{color:var(--red);filter:drop-shadow(0 0 8px var(--glow))}
.nav-item.active .nav-label{color:var(--red)}
.nav-icon{font-size:22px;color:var(--muted);transition:all .3s}
.nav-label{
  font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;
}

.hidden{display:none!important}

@media(max-width:360px){
  .games-grid{grid-template-columns:1fr 1fr;gap:8px}
  .title-main{font-size:24px}
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="scanlines"></div>
<div class="particles" id="particles"></div>

<div class="content">
  <!-- TOP SECTION -->
  <div class="top-section">
    <div class="top-header">
      <div class="header-left">
        <span class="welcome-back">Welcome Back</span>
        <div class="title-main">DEVIL PREDICTOR<span class="g">.</span></div>
      </div>
      <a class="telegram-btn" href="https://t.me/" target="_blank" title="Telegram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
      </a>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" type="text" placeholder="Search games..." oninput="searchGame(this.value)">
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val">12</div>
      <div class="stat-label">Games</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">2</div>
      <div class="stat-label">Modes</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">AI</div>
      <div class="stat-label">Engine</div>
    </div>
  </div>

  <!-- SECTION HEADER -->
  <div class="section-header">
    <div class="section-title">Select Game</div>
    <div class="live-badge">ALL LIVE</div>
  </div>

  <!-- GAMES GRID -->
  <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-item active" href="home.html">
      <span class="nav-icon">&#127968;</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" href="support.html">
      <span class="nav-icon">&#128172;</span>
      <span class="nav-label">Support</span>
    </a>
  </div>
</div>

<script>
const games=[
  {key:"okwin",name:"OKWIN",desc:"Premium prediction platform with instant results",badge:"hot",img:"image1.png"},
  {key:"51game",name:"51 GAME",desc:"Live gaming experience with real-time updates",badge:"live",img:"image2.png"},
  {key:"55club",name:"55 CLUB",desc:"Exclusive club games with high win rates",badge:"hot",img:"image3.png"},
  {key:"82lottery",name:"82 LOTTERY",desc:"New lottery system with AI-powered predictions",badge:"new",img:"image4.png"},
  {key:"dmwin",name:"DM WIN",desc:"Daily winning predictions with proven accuracy",badge:"hot",img:"image5.png"},
  {key:"jaiclub",name:"JAI CLUB",desc:"VIP exclusive club with premium features",badge:"vip",img:"image6.png"},
  {key:"yaarwin",name:"YAARWIN",desc:"Trusted platform with consistent daily wins",badge:"hot",img:"image7.png"},
  {key:"bdgwin",name:"BDG WIN",desc:"Live betting guide with smart AI analysis",badge:"live",img:"image8.png"},
  {key:"bigmumbai",name:"BIG MUMBAI",desc:"Trending game with massive reward pools",badge:"trend",img:"image9.png"},
  {key:"tiranga",name:"TIRANGA",desc:"Live national games with secure predictions",badge:"live",img:"image10.png"},
  {key:"tashanwin",name:"TASHAN WIN",desc:"Best-in-class prediction engine with top accuracy",badge:"best",img:"image11.png"},
  {key:"sikkim",name:"SIKKIM",desc:"New regional lottery with exciting new format",badge:"new",img:"image12.png"}
];

const badgeLabels={hot:"HOT",live:"LIVE",new:"NEW",vip:"VIP",trend:"TREND",best:"BEST"};
const badgeClasses={hot:"badge-hot",live:"badge-live",new:"badge-new",vip:"badge-vip",trend:"badge-trend",best:"badge-best"};

function renderGames(list){
  const g=document.getElementById("gamesGrid");
  g.innerHTML=list.map((gm,i)=>`
    <div class="game-card" data-name="${gm.name.toLowerCase()}" onclick="go('${gm.key}',60)">
      <div class="card-img">
        <img src="${gm.img}" alt="${gm.name}" onerror="this.onerror=null;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 160%22><rect fill=%22%23111%22 width=%22200%22 height=%22160%22/><text fill=%22%23333%22 font-family=%22monospace%22 font-size=%2214%22 x=%22100%22 y=%2285%22 text-anchor=%22middle%22>${gm.name}</text></svg>'">
        <span class="card-badge ${badgeClasses[gm.badge]}">${badgeLabels[gm.badge]}</span>
      </div>
      <div class="card-info">
        <div class="card-name">${gm.name}</div>
        <div class="card-desc">${gm.desc}</div>
        <div class="card-btns">
          <button class="btn btn-primary" onclick="event.stopPropagation();go('${gm.key}',60)">1 MIN</button>
          <button class="btn btn-secondary" onclick="event.stopPropagation();go('${gm.key}',30)">30 SEC</button>
        </div>
      </div>
    </div>
  `).join("");
}

function go(key,timer){
  localStorage.setItem("selectedGame",key);
  localStorage.setItem("selectedTimer",timer);
  window.location.href="mode.html";
}

function searchGame(q){
  const v=q.toLowerCase().trim();
  document.querySelectorAll(".game-card").forEach(c=>{
    c.style.display=!v||c.dataset.name.includes(v)?"":"none";
  });
}

// MATRIX CANVAS
(function(){
  const c=document.getElementById("matrix"),ctx=c.getContext("2d");
  let w,h,cols,drops;
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;cols=Math.floor(w/14);drops=Array(cols).fill(1)}
  resize();window.addEventListener("resize",resize);
  const chars="DEVILPREDICTOR0123456789ABCDEF";
  function draw(){
    ctx.fillStyle="rgba(10,10,10,.05)";ctx.fillRect(0,0,w,h);
    ctx.fillStyle="#ef4444";ctx.font="14px monospace";
    for(let i=0;i<drops.length;i++){
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch,i*14,drops[i]*14);
      if(drops[i]*14>h&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// PARTICLES
(function(){
  const c=document.getElementById("particles");
  for(let i=0;i<25;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(6+Math.random()*8)+"s";
    p.style.animationDelay=Math.random()*10+"s";
    p.style.width=p.style.height=(1+Math.random()*2)+"px";
    c.appendChild(p);
  }
})();

renderGames(games);
</script>
</body>
</html>
