<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Predictor - Prediction Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030712;--green1:#10b981;--green2:#34d399;--green3:#059669;--red:#ef4444;--violet:#8b5cf6;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06);--glass-border2:rgba(16,185,129,0.15)}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden;position:relative}
body.filter-blur #content-wrap{filter:blur(12px);pointer-events:none}

.blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.18;pointer-events:none;z-index:0}
.blob1{width:500px;height:500px;background:var(--green1);top:-10%;left:-10%;animation:blobMove1 18s ease-in-out infinite alternate}
.blob2{width:400px;height:400px;background:var(--green3);bottom:-10%;right:-10%;animation:blobMove2 22s ease-in-out infinite alternate}
.blob3{width:350px;height:350px;background:var(--green2);top:40%;left:50%;animation:blobMove3 20s ease-in-out infinite alternate}
@keyframes blobMove1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,60px) scale(1.15)}}
@keyframes blobMove2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-60px,-80px) scale(1.1)}}
@keyframes blobMove3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,-50px) scale(.9)}}

#grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(16,185,129,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,0.04) 1px,transparent 1px);background-size:60px 60px}

#particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

#content-wrap{position:relative;z-index:1;min-height:100vh}
.page{max-width:420px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}

.glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:20px;padding:20px;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(16,185,129,0.04) 0%,transparent 50%);pointer-events:none;border-radius:inherit}

.fade-up{opacity:0;transform:translateY(30px);animation:fadeUp .6s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* 1. Top Card */
.top-card{display:flex;align-items:center;gap:14px}
.game-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--green1),var(--green3));display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.game-info{flex:1}
.game-name{font-size:16px;font-weight:700;margin-bottom:4px}
.mode-tag{display:inline-block;padding:4px 10px;border-radius:8px;background:rgba(16,185,129,0.15);color:var(--green1);font-size:11px;font-weight:600;letter-spacing:.5px}
.status-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:rgba(255,255,255,0.5)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green1);animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}

/* 2. Timer Card */
.timer-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.timer-label{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,0.4)}
.timer-ring-wrap{position:relative;width:130px;height:130px}
.timer-ring-wrap svg{width:130px;height:130px;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:rgba(255,255,255,0.03);stroke-width:6}
.timer-ring-fill{fill:none;stroke:var(--green1);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.timer-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:var(--green1);transition:color .3s}
.timer-value.danger{color:var(--red)}
.timer-mode{position:absolute;right:-10px;top:50%;transform:translateY(-50%)}

/* 3. Period Card */
.period-card{display:flex;flex-direction:column;gap:8px}
.period-label{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,0.4)}
.period-value{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;word-break:break-all;color:rgba(255,255,255,0.9)}

/* 4. Prediction Card */
.prediction-card{display:flex;flex-direction:column;align-items:center;gap:10px}
.prediction-inner{width:100%;background:linear-gradient(135deg,rgba(16,185,129,0.08),rgba(5,150,105,0.04));border:1px solid var(--glass-border2);border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.prediction-label{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--green1)}
.prediction-value{font-family:'Space Grotesk',sans-serif;font-size:80px;font-weight:700;color:var(--green1);line-height:1;transition:color .3s}
.prediction-value.color-red{color:var(--red)}
.prediction-value.color-violet{color:var(--violet)}
.prediction-sub{font-size:13px;color:rgba(255,255,255,0.4)}

/* 5. History Card */
.history-card{display:flex;flex-direction:column;gap:12px}
.history-label{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,0.4)}
.history-grid{display:flex;gap:8px;flex-wrap:wrap}
.history-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif}
.history-dot.bg-green{background:var(--green1)}
.history-dot.bg-red{background:var(--red)}
.history-dot.bg-violet{background:var(--violet)}

/* 6. Predict Button */
.predict-btn{width:100%;padding:16px;border:none;border-radius:16px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s}
.predict-btn.ready{background:linear-gradient(135deg,var(--green1),var(--green3));color:#fff;box-shadow:0 0 30px rgba(16,185,129,0.3)}
.predict-btn.ready:active{transform:scale(.97)}
.predict-btn.locked{background:rgba(255,255,255,0.03);color:#4b5563;cursor:not-allowed}
.predict-btn.loading{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.3);cursor:wait}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--green1);border-radius:50%;animation:spin .8s linear infinite;display:none}
.predict-btn.loading .spinner{display:block}
.predict-btn.loading .btn-text{display:none}
.predict-btn.loading .btn-arrow{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-arrow{display:inline-block;transition:transform .2s}

/* 7. Bottom Info */
.bottom-info{display:flex;justify-content:center;gap:24px;padding:8px 0}
.info-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.35);font-weight:500}
.info-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center}
.info-icon svg{width:18px;height:18px;stroke:var(--green1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div id="grid-bg"></div>
<canvas id="particles-canvas"></canvas>

<div id="content-wrap">
<div class="page">

<!-- 1. Top Card -->
<div class="glass top-card fade-up" style="animation-delay:.05s">
  <div class="game-logo">🎯</div>
  <div class="game-info">
    <div class="game-name">Win Go</div>
    <div><span class="mode-tag" id="modeTag">30 SEC MODE</span></div>
    <div class="status-row">
      <span class="pulse-dot"></span>
      <span>Live Server</span>
    </div>
  </div>
</div>

<!-- 2. Timer Card -->
<div class="glass timer-card fade-up" style="animation-delay:.12s">
  <div class="timer-label">LIVE TIMER</div>
  <div class="timer-ring-wrap">
    <svg viewBox="0 0 130 130">
      <circle class="timer-ring-bg" cx="65" cy="65" r="58"/>
      <circle class="timer-ring-fill" id="timerRing" cx="65" cy="65" r="58" stroke-dasharray="364.42" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-value" id="timerValue">30</div>
  </div>
  <div class="timer-mode"><span class="mode-tag" id="timerModeTag">30S</span></div>
</div>

<!-- 3. Period Card -->
<div class="glass period-card fade-up" style="animation-delay:.19s">
  <div class="period-label">NEXT PERIOD</div>
  <div class="period-value" id="periodValue">Loading...</div>
</div>

<!-- 4. Prediction Card -->
<div class="glass prediction-card fade-up" style="animation-delay:.26s">
  <div class="prediction-inner">
    <div class="prediction-label">AI PREDICTION</div>
    <div class="prediction-value" id="predictionValue">--</div>
    <div class="prediction-sub" id="predictionSub">Tap to generate prediction</div>
  </div>
</div>

<!-- 5. History Card -->
<div class="glass history-card fade-up" style="animation-delay:.33s">
  <div class="history-label">RECENT RESULTS</div>
  <div class="history-grid" id="historyGrid"></div>
</div>

<!-- 6. Button -->
<button class="predict-btn ready" id="predictBtn" onclick="handlePredict()">
  <span class="btn-text">GET PREDICTION</span>
  <span class="btn-arrow">&#10132;</span>
  <span class="spinner"></span>
</button>

<!-- 7. Bottom Info -->
<div class="glass bottom-info fade-up" style="animation-delay:.47s">
  <div class="info-item">
    <div class="info-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <span>Secure</span>
  </div>
  <div class="info-item">
    <div class="info-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
    <span>AI Power</span>
  </div>
  <div class="info-item">
    <div class="info-icon"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
    <span>Fast</span>
  </div>
</div>

</div>
</div>

<script>
// Anti-devil
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&e.key==='I'))e.preventDefault()});
window.addEventListener('blur',()=>document.body.classList.add('filter-blur'));
window.addEventListener('focus',()=>document.body.classList.remove('filter-blur'));

// Particles
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
function createParticles(){
  particles=[];
  for(let i=0;i<15;i++){
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+0.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,o:Math.random()*.4+.1});
  }
}
createParticles();
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(16,185,129,${p.o})`;
    ctx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Game data
const games={
  'okwin':{name:'OKWIN',img:'image1.png'},
  '51game':{name:'51 GAME',img:'image2.png'},
  '55club':{name:'55 CLUB',img:'image3.png'},
  '82lottery':{name:'82 LOTTERY',img:'image4.png'},
  'dmwin':{name:'DM WIN',img:'image5.png'},
  'jaiclub':{name:'JAI CLUB',img:'image6.png'},
  'yaarwin':{name:'YAARWIN',img:'image7.png'},
  'bdgwin':{name:'BDG WIN',img:'image8.png'},
  'bigmumbai':{name:'BIG MUMBAI',img:'image9.png'},
  'tiranga':{name:'TIRANGA',img:'image10.png'},
  'tashanwin':{name:'TASHAN WIN',img:'image11.png'},
  'sikkim':{name:'SIKKIM',img:'image12.png'}
};
const selectedGame=localStorage.getItem('selectedGame')||'okwin';
const gameData=games[selectedGame]||games['okwin'];
document.querySelector('.game-logo').innerHTML=`<img src="${gameData.img}" alt="${gameData.name}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`;
document.querySelector('.game-name').textContent=gameData.name;

// Timer logic
const selectedTimer=localStorage.getItem('selectedTimer')||'30';
const TOTAL_TIME=parseInt(selectedTimer);
let timerType=selectedTimer==='60'?'1m':'30s';
document.getElementById('modeTag').textContent=selectedTimer==='60'?'1 MIN MODE':'30 SEC MODE';
document.getElementById('timerModeTag').textContent=selectedTimer==='60'?'60S':'30S';
let currentTime=TOTAL_TIME;
let timerInterval=null;
const timerRing=document.getElementById('timerRing');
const timerValueEl=document.getElementById('timerValue');
const circumference=2*Math.PI*58;
timerRing.style.strokeDasharray=circumference;
timerRing.style.strokeDashoffset=0;

function updateTimer(){
  const pct=currentTime/TOTAL_TIME;
  timerRing.style.strokeDashoffset=circumference*(1-pct);
  timerValueEl.textContent=currentTime;
  if(currentTime<=5){timerValueEl.classList.add('danger');timerRing.style.stroke='#ef4444'}
  else{timerValueEl.classList.remove('danger');timerRing.style.stroke='#10b981'}
  if(currentTime<=0){
    currentTime=TOTAL_TIME;
    updatePeriod();
  }
}
function startTimer(){
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{currentTime--;updateTimer()},1000);
}

// Period
function updatePeriod(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const period=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(30-Math.floor(currentTime/30)*30)}`;
  document.getElementById('periodValue').textContent=period;
}
updatePeriod();

// History
function getHistoryColor(n){
  if([1,3,7,9].includes(n))return'bg-green';
  if([2,4,6,8].includes(n))return'bg-red';
  return'bg-violet';
}
const historyGrid=document.getElementById('historyGrid');
let recentNumbers=[];
function renderHistory(){
  historyGrid.innerHTML='';
  recentNumbers.forEach(n=>{
    const d=document.createElement('div');
    d.className='history-dot '+getHistoryColor(n);
    d.textContent=n;
    historyGrid.appendChild(d);
  });
  if(recentNumbers.length===0){
    for(let i=0;i<8;i++){
      const n=Math.floor(Math.random()*10);
      const d=document.createElement('div');
      d.className='history-dot '+getHistoryColor(n);
      d.textContent=n;
      historyGrid.appendChild(d);
      recentNumbers.push(n);
    }
  }
}
renderHistory();

// Prediction Algorithm
function firstGaps(numbers){
  const gaps=[];
  for(let i=0;i<numbers.length-1;i++){gaps.push(Math.abs(numbers[i]-numbers[i+1]))}
  return gaps;
}
function makeLayers(gaps){
  let current=[...gaps];let binary=[];let leftover=null;
  while(current.length>1){
    const next=[];
    for(let i=0;i<current.length-1;i++){
      const diff=Math.abs(current[i]-current[i+1]);
      if(diff<=1)next.push(diff);
    }
    leftover=current.length%2!==0?current[current.length-1]:null;
    current=[...next];binary=[...current];
    if(current.length<=1)break;
  }
  return{binary,leftover};
}
function predictBS(binary){
  const zeros=binary.filter(x=>x===0).length;
  const ones=binary.filter(x=>x===1).length;
  const last=binary[binary.length-1]||0;
  if(last===1)return ones%2!==0?'BIG':'SMALL';
  return zeros%2!==0?'SMALL':'BIG';
}
function predictNumber(binary,leftover,bs){
  if(leftover!==null){
    const pool=bs==='BIG'?[5,6,7,8,9]:[0,1,2,3,4];
    const filtered=pool.filter(x=>x%2===leftover%2);
    return filtered[Math.floor(Math.random()*filtered.length)];
  }
  return Math.floor(Math.random()*10);
}

// Fetch API
let latestData=null;
async function fetchHistory(){
  const url=timerType==='1m'
    ?'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageSize=10&pageNo=1'
    :'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=10&pageNo=1';
  try{
    const res=await fetch(url);
    const data=await res.json();
    latestData=data;
    if(data&&data.data&&data.data.list){
      recentNumbers=data.data.list.slice(0,8).map(item=>parseInt(item.number));
      renderHistory();
    }
  }catch(e){console.error('Fetch error',e)}
}

// Button
const btn=document.getElementById('predictBtn');
const predValue=document.getElementById('predictionValue');
const predSub=document.getElementById('predictionSub');
let isPredicting=false;

btn.addEventListener('click',e=>{
  if(isPredicting)return;
  navigator.vibrate([10,30,10]);
});

async function handlePredict(){
  if(isPredicting)return;
  isPredicting=true;
  btn.className='predict-btn loading';
  await fetchHistory();
  const nums=recentNumbers.length?recentNumbers.slice(0,8):Array.from({length:8},()=>Math.floor(Math.random()*10));
  const gaps=firstGaps(nums);
  const{binary,leftover}=makeLayers(gaps);
  const bs=predictBS(binary);
  const num=predictNumber(binary,leftover,bs);
  predValue.textContent=num;
  predValue.className='prediction-value';
  if([0,5].includes(num))predValue.classList.add('color-violet');
  else if([2,4,6,8].includes(num))predValue.classList.add('color-red');
  predSub.textContent=`${bs} | Period #${document.getElementById('periodValue').textContent.slice(-4)}`;
  recentNumbers.unshift(num);
  if(recentNumbers.length>8)recentNumbers.pop();
  renderHistory();
  btn.className='predict-btn locked';
  setTimeout(()=>{
    btn.className='predict-btn ready';
    isPredicting=false;
  },3000);
}

startTimer();
</script>
</body>
</html>
