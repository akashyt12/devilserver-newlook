<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVIL PREDICTOR • SYNC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #050505;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      color: white;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      overflow-y: auto;
      position: relative;
      background: #050505;
    }

    .app::-webkit-scrollbar {
      width: 0;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.05;
      pointer-events: none;
    }

    .glow1,
    .glow2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
    }

    .glow1 {
      width: 240px;
      height: 240px;
      background: #00ff8840;
      top: -120px;
      left: -80px;
    }

    .glow2 {
      width: 220px;
      height: 220px;
      background: #00ff6640;
      bottom: -100px;
      right: -60px;
    }

    .main {
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    .topCard {
      background: rgba(12, 12, 12, .96);
      border: 1px solid #1a1a1a;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 136, .06);
    }

    .gameTop {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gameImage {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      object-fit: cover;
      border: 1px solid #1f1f1f;
      box-shadow: 0 0 20px rgba(0, 255, 136, .15);
      background: #0f0f0f;
    }

    .small {
      font-size: 11px;
      color: #777;
      letter-spacing: 1px;
    }

    .gameName {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 800;
    }

    .gameName span {
      color: #00ff88;
    }

    .modeBox {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 14px;
      background: #00ff8815;
      border: 1px solid #00ff8835;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ff88;
    }

    .status {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9a9a9a;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88;
      animation: pulse 1s infinite;
    }

    .card {
      margin-top: 18px;
      background: rgba(12, 12, 12, .96);
      border: 1px solid #1a1a1a;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 0 22px rgba(0, 255, 136, .04);
    }

    .label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #6d6d6d;
      margin-bottom: 12px;
    }

    .timer {
      font-size: 42px;
      font-weight: 800;
      color: #00ff88;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .timer.urgent {
      color: #ff4444;
      text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
    }

    .period {
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .predict {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      font-size: 58px;
      font-weight: 800;
      color: #00ff88;
      text-shadow: 0 0 18px rgba(0, 255, 136, .35);
      transition: all 0.3s;
    }

    button {
      width: 100%;
      height: 58px;
      margin-top: 20px;
      border: none;
      border-radius: 20px;
      background: #00ff88;
      color: black;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: .2s;
      box-shadow: 0 0 25px rgba(0, 255, 136, .25);
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      background: #1a3a2a;
      color: #555;
      box-shadow: none;
      cursor: not-allowed;
    }

    .loader {
      display: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, .25);
      border-top: 3px solid black;
      animation: spin 1s linear infinite;
      position: absolute;
    }

    .footer {
      margin-top: 22px;
      margin-bottom: 30px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      color: #666;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      50% {
        opacity: .3;
      }
    }

    @keyframes periodFlash {
      0%, 100% {
        color: #00ff88;
      }
      50% {
        color: #ffffff;
        text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
      }
    }

    .period-updated {
      animation: periodFlash 0.6s ease-in-out;
    }

    @media(max-width:360px) {
      .gameImage {
        width: 64px;
        height: 64px;
      }
      .gameName {
        font-size: 20px;
      }
      .timer {
        font-size: 36px;
      }
      .period {
        font-size: 17px;
      }
      .predict {
        min-height: 100px;
      }
    }
  </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="app">
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="main">
    <div class="topCard">
      <div class="gameTop">
        <img src="" id="gameImage" class="gameImage" alt="Game">
        <div>
          <div class="small">CONNECTED GAME</div>
          <div class="gameName" id="gameName">OKWIN</div>
          <div class="modeBox" id="timerMode">30 SEC MODE</div>
        </div>
      </div>
      <div class="status">
        <div class="dot"></div>
        AI SERVER CONNECTED
      </div>
    </div>
    <div class="card">
      <div class="label">LIVE TIMER</div>
      <div class="timer" id="timer">00:30</div>
    </div>
    <div class="card">
      <div class="label">NEXT PERIOD</div>
      <div class="period" id="nextPeriod">----</div>
    </div>
    <div class="card">
      <div class="label">AI PREDICTION</div>
      <div class="predict" id="prediction">--</div>
    </div>
    <button id="predictBtn" type="button">
      <span id="btnText">GET PREDICTION</span>
      <div class="loader" id="loader"></div>
    </button>
    <div class="footer">Secure - AI Powered - Fast</div>
  </div>
</div>

<script>
  (function() {
    /* =========================
       SECURE SETTINGS
    ========================= */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
      if (
        e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
        (e.ctrlKey && e.shiftKey && e.keyCode === 74) ||
        (e.ctrlKey && e.keyCode === 85)
      ) {
        return false;
      }
    };
    window.addEventListener('blur', () => { document.body.style.filter = 'blur(14px)'; });
    window.addEventListener('focus', () => { document.body.style.filter = 'blur(0px)'; });

    /* =========================
       STORAGE & DEFAULTS
    ========================= */
    const fallbackImage = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
        <rect width="144" height="144" rx="34" fill="#07130d"/>
        <circle cx="72" cy="72" r="44" fill="#00ff88" opacity=".14"/>
        <path d="M43 86 L62 39 L78 72 L91 51 L104 86 Z" fill="#00ff88"/>
      </svg>
    `);
    
    const selectedGame = JSON.parse(localStorage.getItem('selectedGame') || 'null') || {
      name: 'OKWIN',
      image: fallbackImage
    };
    const timerType = localStorage.getItem('timerType') === '1m' ? '1m' : '30s';
    const predictionMode = localStorage.getItem('predictionMode') === 'NUMBER' ? 'NUMBER' : 'BIG SMALL';

    /* =========================
       UI ELEMENTS
    ========================= */
    document.getElementById('gameImage').src = selectedGame.image || fallbackImage;
    document.getElementById('gameName').innerHTML = selectedGame.name || 'OKWIN';
    document.getElementById('timerMode').innerText = timerType === '1m' ? '1 MIN MODE' : '30 SEC MODE';

    const API_URL = timerType === '1m'
      ? 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageSize=10&pageNo=1'
      : 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=10&pageNo=1';

    const timerEl = document.getElementById('timer');
    const nextPeriodEl = document.getElementById('nextPeriod');
    const predictionEl = document.getElementById('prediction');
    const btn = document.getElementById('predictBtn');
    const btnText = document.getElementById('btnText');
    const loader = document.getElementById('loader');

    /* =========================
       STATE
    ========================= */
    let latestData = [];
    let currentPeriod = '';
    let shownNextPeriod = '';
    let predictedForPeriod = '';
    let isFetching = false;
    let predictionLocked = false;       // true when prediction already given for current period
    const totalTime = timerType === '1m' ? 60 : 30;
    
    // Timer sync correction: we will align with server time (no -10 sec offset)
    let serverTimeOffset = 0; // milliseconds, will be estimated

    /* =========================
       PERIOD HELPERS
    ========================= */
    function addOneToNumericString(value) {
      const digits = String(value || '').trim();
      if (!/^\d+$/.test(digits)) return '';
      let carry = 1;
      let result = '';
      for (let i = digits.length - 1; i >= 0; i--) {
        const sum = Number(digits[i]) + carry;
        result = String(sum % 10) + result;
        carry = sum > 9 ? 1 : 0;
      }
      return carry ? '1' + result : result;
    }

    function incrementPeriod(period) {
      if (!period) return '----';
      const clean = String(period).trim();
      if (/^\d+$/.test(clean)) {
        return addOneToNumericString(clean);
      }
      const hyphenated = clean.match(/^(.+?)(\d+)$/);
      if (hyphenated) {
        const prefix = hyphenated[1];
        const num = hyphenated[2];
        const next = addOneToNumericString(num).padStart(num.length, '0');
        return prefix + next;
      }
      return '----';
    }

    function readIssue(row) {
      return String(row?.issueNumber || row?.issue || row?.periodNo || row?.period || '').trim();
    }

    function readNumber(row) {
      const raw = row?.number ?? row?.openCode ?? row?.result ?? row?.digit;
      const match = String(raw ?? '').match(/\d/);
      return match ? Number(match[0]) : NaN;
    }

    /* =========================
       FETCH DATA & SYNC TIME
    ========================= */
    async function fetchData() {
      try {
        const res = await fetch(API_URL + '&t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        // Estimate server time offset from response Date header if available
        const serverDate = res.headers.get('Date');
        if (serverDate) {
          const serverTime = new Date(serverDate).getTime();
          if (!isNaN(serverTime)) {
            serverTimeOffset = serverTime - Date.now();
          }
        }
        return Array.isArray(data?.data?.list) ? data.data.list : [];
      } catch (err) {
        console.log('Fetch error:', err.message);
        return [];
      }
    }

    /* =========================
       BUTTON UI HELPERS
    ========================= */
    function setButtonReady() {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      btn.style.background = '#00ff88';
      btn.style.color = 'black';
      btn.style.boxShadow = '0 0 25px rgba(0,255,136,.25)';
      btnText.style.display = 'block';
      loader.style.display = 'none';
    }

    function setButtonLocked() {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.pointerEvents = 'none';
      btn.style.background = '#1a3a2a';
      btn.style.color = '#555';
      btn.style.boxShadow = 'none';
      btnText.style.display = 'block';
      loader.style.display = 'none';
    }

    function setButtonLoading() {
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';
      btnText.style.display = 'none';
      loader.style.display = 'block';
    }

    function resetPrediction() {
      predictionEl.innerText = '--';
      predictionEl.style.color = '#00ff88';
      predictionEl.style.fontSize = '58px';
      predictionEl.style.textShadow = '0 0 18px rgba(0,255,136,.35)';
    }

    function renderNextPeriod(nextPeriod) {
      if (!nextPeriod || nextPeriod === shownNextPeriod) return;
      shownNextPeriod = nextPeriod;
      nextPeriodEl.innerText = shownNextPeriod;
      nextPeriodEl.classList.remove('period-updated');
      void nextPeriodEl.offsetWidth;
      nextPeriodEl.classList.add('period-updated');

      // If period changed, reset prediction lock and UI
      if (predictedForPeriod !== shownNextPeriod) {
        resetPrediction();
        predictionLocked = false;
        // Enable button if timer is in valid range (0-30 sec elapsed)
        updateButtonStateByTimer();
      }
    }

    /* =========================
       TIMER LOGIC (SYNCED, NO -10 OFFSET)
    ========================= */
    function getServerNow() {
      return new Date(Date.now() + serverTimeOffset);
    }

    function getRemainingSeconds() {
      const now = getServerNow();
      const seconds = now.getSeconds();
      const ms = now.getMilliseconds();
      let elapsed;
      if (timerType === '30s') {
        elapsed = seconds % 30;
      } else {
        elapsed = seconds; // 1m mode: 0-59
      }
      // remaining = totalTime - elapsed - (1 if ms>0 to show correct countdown)
      const remaining = totalTime - elapsed - (ms > 0 ? 1 : 0);
      return Math.max(0, remaining);
    }

    function getElapsedSeconds() {
      const now = getServerNow();
      const seconds = now.getSeconds();
      return timerType === '30s' ? (seconds % 30) : seconds;
    }

    function updateTimerUI() {
      const remaining = getRemainingSeconds();
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timerEl.innerText = `${m}:${s}`;

      if (remaining <= 5 && remaining > 0) {
        timerEl.classList.add('urgent');
      } else {
        timerEl.classList.remove('urgent');
      }

      // Auto enable/disable button based on timer and prediction lock
      updateButtonStateByTimer();

      // When timer hits 0, trigger period update
      if (remaining === 0) {
        handleTimerZero();
      }
    }

    function updateButtonStateByTimer() {
      const elapsed = getElapsedSeconds();
      // Enable only in first half? Actually requirement: "jab 30sec time start get prediction button enable ho jaye"
      // So button should be enabled when timer just started (elapsed small) AND prediction not yet given.
      // We'll enable when elapsed <= 2 seconds (start of period) and lock after prediction.
      // But also need to disable after prediction given. We use predictionLocked flag.
      if (predictionLocked) {
        setButtonLocked();
        return;
      }
      
      // Enable at very beginning of period (elapsed 0-2 sec) to allow prediction
      if (elapsed >= 0 && elapsed <= 2) {
        setButtonReady();
      } else {
        // Outside the start window, keep disabled unless already ready? We'll lock.
        setButtonLocked();
      }
    }

    let lastZeroTrigger = '';
    function handleTimerZero() {
      const now = getServerNow();
      const minute = now.getMinutes();
      const second = now.getSeconds();
      const key = `${minute}-${second}`;
      if (key === lastZeroTrigger) return;
      lastZeroTrigger = key;
      
      // Fetch new period data
      setTimeout(() => updatePeriodLive(false), 900);
      setTimeout(() => updatePeriodLive(false), 2500);
    }

    /* =========================
       UPDATE PERIOD FROM API
    ========================= */
    async function updatePeriodLive(force = false) {
      if (isFetching && !force) return false;
      isFetching = true;
      const data = await fetchData();
      isFetching = false;

      if (data.length === 0) {
        updateTimerUI();
        return false;
      }

      latestData = data;
      const latestIssue = readIssue(data[0]);
      if (!latestIssue) {
        updateTimerUI();
        return false;
      }

      currentPeriod = latestIssue;
      renderNextPeriod(incrementPeriod(currentPeriod));
      updateTimerUI();
      return true;
    }

    /* =========================
       PREDICTION ENGINE
    ========================= */
    function firstGaps(numbers) {
      const gaps = [];
      for (let i = 0; i < numbers.length - 1; i++) {
        gaps.push(Math.abs(numbers[i] - numbers[i + 1]));
      }
      return gaps;
    }

    function makeLayers(gaps) {
      let current = [...gaps];
      let binary = [];
      let leftover = null;
      while (current.length > 1) {
        const next = [];
        for (let i = 0; i < current.length - 1; i++) {
          const diff = Math.abs(current[i] - current[i + 1]);
          if (diff <= 1) next.push(diff);
        }
        leftover = current.length % 2 !== 0 ? current[current.length - 1] : null;
        current = [...next];
        binary = [...current];
        if (current.length <= 1) break;
      }
      return { binary, leftover };
    }

    function predictBS(binary) {
      const zeros = binary.filter(x => x === 0).length;
      const ones = binary.filter(x => x === 1).length;
      const last = binary[binary.length - 1] || 0;
      if (last === 1) {
        return ones % 2 !== 0 ? 'BIG' : 'SMALL';
      }
      return zeros % 2 !== 0 ? 'SMALL' : 'BIG';
    }

    function predictNumber(binary, leftover, bs) {
      if (leftover !== null) {
        const pool = bs === 'BIG' ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
        const filtered = pool.filter(x => x % 2 === leftover % 2);
        return filtered[Math.floor(Math.random() * filtered.length)];
      }
      return Math.floor(Math.random() * 10);
    }

    function applyNumberColor(num) {
      predictionEl.style.textShadow = '0 0 18px rgba(255,255,255,.15)';
      if (num === 1 || num === 3 || num === 7 || num === 9) {
        predictionEl.style.color = '#00ff88';
      } else if (num === 2 || num === 4 || num === 6 || num === 8) {
        predictionEl.style.color = '#ff3b3b';
      } else if (num === 0) {
        predictionEl.style.color = '#ff4dff';
      } else if (num === 5) {
        predictionEl.style.color = '#b266ff';
      }
    }

    /* =========================
       GET PREDICTION BUTTON ACTION
    ========================= */
    async function onPredictClick() {
      if (predictionLocked || isFetching) return;
      if (!shownNextPeriod || shownNextPeriod === '----') {
        await updatePeriodLive(true);
      }
      
      setButtonLoading();

      // Ensure fresh data
      await updatePeriodLive(true);

      const numbers = latestData.map(readNumber).filter(num => Number.isInteger(num));
      if (numbers.length < 2 || !shownNextPeriod || shownNextPeriod === '----') {
        predictionEl.innerText = 'NO DATA';
        predictionEl.style.color = '#ff4444';
        predictionEl.style.fontSize = '28px';
        predictionEl.style.textShadow = '0 0 18px rgba(255,68,68,.35)';
        setButtonReady();
        return;
      }

      let gaps = firstGaps(numbers);
      let { binary, leftover } = makeLayers(gaps);
      if (binary.length === 0) binary = [0];

      const bs = predictBS(binary);
      const num = predictNumber(binary, leftover, bs);

      if (predictionMode === 'NUMBER') {
        predictionEl.style.fontSize = '110px';
        predictionEl.innerText = num;
        applyNumberColor(num);
      } else {
        predictionEl.style.fontSize = '58px';
        predictionEl.style.color = '#00ff88';
        predictionEl.style.textShadow = '0 0 18px rgba(0,255,136,.35)';
        predictionEl.innerText = bs;
      }

      predictedForPeriod = shownNextPeriod;
      predictionLocked = true;
      setButtonLocked();
    }

    btn.addEventListener('click', onPredictClick);

    /* =========================
       MATRIX EFFECT
    ========================= */
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const letters = '01';
    const fontSize = 14;
    let columns = 0;
    let drops = [];

    function sizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array.from({ length: columns }, () => 1);
    }

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff88';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.97) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    sizeCanvas();
    setInterval(draw, 35);
    window.addEventListener('resize', sizeCanvas);

    /* =========================
       INITIAL LOAD & INTERVALS
    ========================= */
    updateTimerUI();
    updatePeriodLive(true);
    
    // Refresh timer every 250ms
    setInterval(updateTimerUI, 250);
    // Periodic data refresh
    setInterval(() => updatePeriodLive(false), 10000);
    
    // Also reset prediction lock when period changes externally (extra safety)
    setInterval(() => {
      if (shownNextPeriod && predictedForPeriod !== shownNextPeriod && predictionLocked) {
        predictionLocked = false;
        updateButtonStateByTimer();
      }
    }, 500);
  })();
</script>
</body>
</html>
