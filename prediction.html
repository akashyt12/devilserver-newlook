<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Devil Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
:root{--green:#10b981;--green-light:#34d399;--green-dark:#059669;--bg:#070b14;--card:rgba(16,185,129,.04);--border:rgba(16,185,129,.12);--text:#f0fdf4;--text-dim:rgba(16,185,129,.45)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(16,185,129,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(5,150,105,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.blur-overlay{position:fixed;inset:0;background:rgba(7,11,20,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.blur-overlay.active{opacity:1;visibility:visible}
.blur-overlay .msg{text-align:center;color:var(--green);font-weight:600;font-size:.95rem;line-height:1.8}
.blur-overlay .msg svg{display:block;margin:0 auto 14px;width:48px;height:48px;stroke:var(--green);fill:none;stroke-width:1.5}
.container{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:20px 14px 120px}
.back-btn{position:fixed;top:14px;left:14px;z-index:200;width:44px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.back-btn:hover{background:rgba(16,185,129,.1);border-color:var(--green)}
.back-btn:active{transform:scale(.95)}
.back-btn svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.card{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.25}
.card-label{display:block;font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-family:'DM Sans',sans-serif;margin-bottom:12px}
.game-info{display:flex;align-items:center;gap:12px}
.game-icon{width:44px;height:44px;min-width:44px;background:linear-gradient(135deg,var(--green-dark),var(--green));border-radius:2px;display:flex;align-items:center;justify-content:center}
.game-icon svg{width:22px;height:22px;fill:#fff}
.game-name{font-size:.95rem;font-weight:700;color:var(--text);font-family:'DM Sans',sans-serif}
.game-tags{display:flex;gap:6px;margin-top:5px}
.tag{font-size:.55rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:2px;text-transform:uppercase}
.tag-mode{background:rgba(16,185,129,.14);color:var(--green-light)}
.tag-status{background:rgba(52,211,153,.14);color:var(--green)}
.dot-live{display:inline-block;width:5px;height:5px;background:var(--green);border-radius:1px;margin-right:4px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.timer-row{display:flex;align-items:center;justify-content:space-between}
.timer-svg-wrap{position:relative;width:76px;height:76px}
.timer-svg-wrap svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(16,185,129,.1);stroke-width:5}
.ring-fg{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:square;transition:stroke-dashoffset 1s linear}
.timer-svg-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800;color:var(--green-light);font-family:'DM Sans',sans-serif}
.timer-right{text-align:right}
.timer-right .sub{font-size:.65rem;color:var(--text-dim);margin-bottom:2px}
.timer-right .big{font-size:2rem;font-weight:800;color:var(--green-light);font-family:'DM Sans',sans-serif;line-height:1}
.timer-right .big span{font-size:.85rem;font-weight:500;color:var(--text-dim);margin-left:2px}
.period-row{display:flex;align-items:center;justify-content:space-between}
.period-num{font-size:1.2rem;font-weight:800;color:var(--green);font-family:'DM Sans',sans-serif;letter-spacing:.06em}
.period-right{text-align:right}
.period-right .cd-val{font-size:1.6rem;font-weight:800;color:var(--green-light);font-family:'DM Sans',sans-serif;line-height:1}
.period-right .cd-lbl{font-size:.6rem;color:var(--text-dim);margin-top:2px}
.pred-card{text-align:center;padding:28px 16px}
.pred-value{font-size:4rem;font-weight:800;line-height:1;margin:8px 0;font-family:'DM Sans',sans-serif;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s}
.pred-value.pop{transform:scale(1.12)}
.pred-value.c-green{color:var(--green)}
.pred-value.c-red{color:#ef4444}
.pred-value.c-violet{color:#a78bfa}
.pred-type{font-size:.8rem;font-weight:700;color:var(--green-light);letter-spacing:.12em;text-transform:uppercase}
.hist-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.hist-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border-radius:2px;transition:transform .15s}
.hist-cell:active{transform:scale(.9)}
.hist-cell.c-green{background:rgba(16,185,129,.18);color:var(--green-light);border:1px solid rgba(16,185,129,.25)}
.hist-cell.c-red{background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.hist-cell.c-violet{background:rgba(167,139,250,.18);color:#c4b5fd;border:1px solid rgba(167,139,250,.25)}
.pred-btn{width:100%;padding:17px;background:linear-gradient(135deg,var(--green-dark),var(--green));border:none;border-radius:2px;font-size:.85rem;font-weight:700;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;box-shadow:0 0 0 0 rgba(16,185,129,0)}
.pred-btn:hover{background:linear-gradient(135deg,var(--green),var(--green-light));box-shadow:0 4px 24px rgba(16,185,129,.25)}
.pred-btn:active{transform:scale(.98)}
.pred-btn:disabled{opacity:.5;cursor:not-allowed}
.pred-btn .shimmer{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transition:left .6s}
.pred-btn:hover .shimmer{left:100%}
.lottie-wrap{display:flex;justify-content:center;margin:20px 0 16px}
.lottie-wrap lottie-player{width:170px;height:170px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat-item{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:14px 8px;text-align:center}
.feat-icon{width:36px;height:36px;margin:0 auto 8px;background:rgba(16,185,129,.1);border-radius:2px;display:flex;align-items:center;justify-content:center}
.feat-icon svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:square}
.feat-title{font-size:.68rem;font-weight:700;color:var(--text);font-family:'DM Sans',sans-serif}
.feat-desc{font-size:.55rem;color:var(--text-dim);margin-top:2px}
</style>
</head>
<body>
<div class="blur-overlay" id="blurOverlay">
<div class="msg">
<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
Tab Lost Focus<br>Prediction Paused
</div>
</div>

<div class="back-btn" onclick="history.back()">
<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div class="container">
<div class="card">
<span class="card-label">Game Information</span>
<div class="game-info">
<div class="game-icon">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
</div>
<div>
<div class="game-name">Win Go</div>
<div class="game-tags">
<span class="tag tag-mode" id="modeTag">BIG/SMALL</span>
<span class="tag tag-status"><span class="dot-live"></span>ACTIVE</span>
</div>
</div>
</div>
</div>

<div class="card">
<span class="card-label">Countdown Timer</span>
<div class="timer-row">
<div class="timer-svg-wrap">
<svg viewBox="0 0 76 76">
<circle class="ring-bg" cx="38" cy="38" r="34"/>
<circle class="ring-fg" id="ringFg" cx="38" cy="38" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/>
</svg>
<div class="timer-svg-num" id="timerSvgNum">60</div>
</div>
<div class="timer-right">
<div class="sub">Seconds Left</div>
<div class="big" id="timerBig">60<span>sec</span></div>
</div>
</div>
</div>

<div class="card">
<span class="card-label">Period Information</span>
<div class="period-row">
<div>
<div class="sub" style="font-size:.65rem;color:var(--text-dim);margin-bottom:2px">Next Period</div>
<div class="period-num" id="periodNum">---</div>
</div>
<div class="period-right">
<div class="cd-val" id="cdVal">00:00</div>
<div class="cd-lbl">Time Remaining</div>
</div>
</div>
</div>

<div class="card pred-card">
<div class="card-label">Next Prediction</div>
<div class="pred-value c-green" id="predValue">--</div>
<div class="pred-type" id="predType">PREDICTING...</div>
</div>

<div class="card">
<span class="card-label">History (Last 8)</span>
<div class="hist-grid" id="histGrid"></div>
</div>

<button class="pred-btn" id="predBtn" onclick="getPrediction()">
<span class="shimmer"></span>&#9889; GET PREDICTION
</button>

<div class="lottie-wrap">
<lottie-player id="lottieAnim" src="https://assets3.lottiefiles.com/packages/lf20_u4yrau.json" background="transparent" speed="1" style="width:170px;height:170px" loop autoplay></lottie-player>
</div>

<div class="feat-grid">
<div class="feat-item">
<div class="feat-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
<div class="feat-title">Anti-Devil</div>
<div class="feat-desc">Protected</div>
</div>
<div class="feat-item">
<div class="feat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
<div class="feat-title">Real-Time</div>
<div class="feat-desc">Live Data</div>
</div>
<div class="feat-item">
<div class="feat-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
<div class="feat-title">Accurate</div>
<div class="feat-desc">Algorithm</div>
</div>
</div>
</div>

<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='C'))||(e.ctrlKey&&e.key==='u'))e.preventDefault()});
window.addEventListener('blur',()=>document.getElementById('blurOverlay').classList.add('active'));
window.addEventListener('focus',()=>document.getElementById('blurOverlay').classList.remove('active'));

const CIRC=2*Math.PI*34;
let timer=60;

function updateTimer(){
const off=((60-timer)/60)*CIRC;
document.getElementById('ringFg').style.strokeDashoffset=off;
document.getElementById('timerSvgNum').textContent=timer;
document.getElementById('timerBig').innerHTML=timer+'<span>sec</span>';
const m=Math.floor(timer/60),s=timer%60;
document.getElementById('cdVal').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

setInterval(()=>{timer=timer>0?timer-1:60;updateTimer()},1000);

function numColor(n){
if(n===0)return{c:'c-violet',t:'VIOLET'};
if(n%2===0)return{c:'c-red',t:'RED'};
return{c:'c-green',t:'GREEN'};
}

function firstGaps(d){const g=[];for(let i=1;i<d.length;i++)g.push(Math.abs(d[i]-d[i-1]));return g}
function makeLayers(g){const l=[];for(let i=0;i<g.length;i+=3)l.push(g.slice(i,i+3));return l}
function predBS(l){let s=0;l.forEach(a=>a.forEach(b=>s+=b));return s%2===0?'BIG':'SMALL'}
function predNum(l,bs){let n=0;l.forEach(a=>a.forEach(b=>n+=b));n%=10;return bs==='BIG'?(n<5?n+5:n):(n>=5?n-5:n)}

function renderHist(arr){
document.getElementById('histGrid').innerHTML=arr.map(n=>{const{c}=numColor(n);return'<div class="hist-cell '+c+'">'+n+'</div>'}).join('');
}

function rndHistory(){const a=[];for(let i=0;i<8;i++)a.push(Math.floor(Math.random()*10));return a}

async function fetchData(){
try{
const r=await fetch('https://draw.ar-lottery01.com/api/lobby/basicLottery/trend/hisNo4987498?lotteryId=4987498&pageNo=1&pageSize=30');
const j=await r.json();
if(j&&j.data&&j.data.list)return j.data.list.map(x=>parseInt(x.no));
}catch(e){}
return rndHistory();
}

async function getPrediction(){
const btn=document.getElementById('predBtn');
const pv=document.getElementById('predValue');
const pt=document.getElementById('predType');
btn.disabled=true;btn.textContent='ANALYZING...';pt.textContent='PROCESSING...';

const data=await fetchData();
const hist=data.slice(-8);
renderHist(hist);
const gaps=firstGaps(data);
const layers=makeLayers(gaps);
const bs=predBS(layers);
const num=predNum(layers,bs);
const{c,t}=numColor(num);

pv.className='pred-value '+c;
pv.textContent=num;
pv.classList.add('pop');
setTimeout(()=>pv.classList.remove('pop'),350);
pt.textContent=t+' \u2014 '+bs;

document.getElementById('modeTag').textContent='NUMBER MODE';

const now=new Date();now.setMinutes(now.getMinutes()+1);
document.getElementById('periodNum').textContent=now.getHours()+''+String(now.getMinutes()).padStart(2,'0');

document.getElementById('lottieAnim').play();

btn.disabled=false;btn.innerHTML='<span class="shimmer"></span>&#9889; GET PREDICTION';
}

renderHist([3,8,1,7,0,4,6,2]);
updateTimer();

setInterval(()=>{
const n=new Date(),nx=new Date(n);nx.setMinutes(nx.getMinutes()+1);nx.setSeconds(0);
timer=Math.floor((nx-n)/1000);updateTimer();
},1000);
</script>
</body>
</html>
