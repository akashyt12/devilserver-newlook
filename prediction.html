<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL PREDICTOR • SYNC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--emerald:#10b981;--emerald-light:#34d399;--emerald-dark:#059669;--bg:#030712;--card:rgba(255,255,255,.02);--border:rgba(255,255,255,.06);--text:#f9fafb;--muted:#6b7280;--dim:#374151}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}

.bg{position:fixed;inset:0;z-index:0}
.bg::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% -20%,rgba(16,185,129,.1),transparent),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(5,150,105,.06),transparent)}
.bg-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(16,185,129,.015) 1px,transparent 1px),
  linear-gradient(90deg,rgba(16,185,129,.015) 1px,transparent 1px);
  background-size:80px 80px;animation:gridShift 30s linear infinite}
@keyframes gridShift{to{background-position:80px 80px}}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;border-radius:50%;animation:particleRise linear infinite}
@keyframes particleRise{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

/* SCROLL */
.scroll{width:100%;height:100%;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* MAIN */
.main{position:relative;z-index:10;width:100%;min-height:100%;padding:20px;display:flex;flex-direction:column;gap:14px}

/* TOP CARD */
.top-card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:20px;backdrop-filter:blur(20px);position:relative;overflow:hidden;animation:fadeUp .5s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.top-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.2),transparent)}

.game-row{display:flex;align-items:center;gap:14px}
.game-logo{width:60px;height:60px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.12);border-radius:18px;display:flex;justify-content:center;align-items:center;overflow:hidden;flex-shrink:0}
.game-logo img{width:100%;height:100%;object-fit:cover}
.game-info{flex:1;min-width:0}
.game-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.game-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-top:2px}
.game-name .g{color:var(--emerald)}
.game-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.08);border-radius:8px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--emerald);font-weight:600;letter-spacing:1px}
.game-tag svg{width:10px;height:10px;stroke:var(--emerald);fill:none;stroke-width:2}

.s-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;background:rgba(16,185,129,.03);border:1px solid rgba(16,185,129,.06);border-radius:12px}
.s-dot{width:6px;height:6px;background:var(--emerald);border-radius:50%;box-shadow:0 0 10px var(--emerald);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 10px var(--emerald)}50%{box-shadow:0 0 20px var(--emerald),0 0 40px rgba(16,185,129,.2)}}
.s-text{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px;backdrop-filter:blur(20px);position:relative;overflow:hidden;animation:fadeUp .5s ease-out both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.12),transparent)}
.c-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}

/* TIMER */
.timer-wrap{display:flex;align-items:center;justify-content:center;gap:24px}
.timer-circle{width:130px;height:130px;position:relative;display:flex;justify-content:center;align-items:center}
.timer-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer-svg circle{fill:none;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.03);stroke-width:4}
.ring-fill{stroke:var(--emerald);stroke-width:4;stroke-dasharray:361.283;stroke-dashoffset:0;transition:stroke-dashoffset .4s ease,stroke .3s}
.ring-fill.urgent{stroke:#ef4444}
.timer-val{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:var(--emerald);transition:color .3s}
.timer-val.urgent{color:#ef4444;text-shadow:0 0 25px rgba(239,68,68,.4)}
.timer-side{display:flex;flex-direction:column;gap:8px}
.mode-tag{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.1);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--emerald);font-weight:600;letter-spacing:1px}
.mode-tag svg{width:14px;height:14px;stroke:var(--emerald);fill:none;stroke-width:2}

/* PERIOD */
.period-val{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;word-break:break-all;letter-spacing:1px;padding:16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:16px;text-align:center;transition:all .3s}
.period-val.flash{animation:periodFlash .6s ease-in-out}
@keyframes periodFlash{0%,100%{color:var(--text);text-shadow:none}50%{color:var(--emerald);text-shadow:0 0 25px rgba(16,185,129,.4)}}

/* PREDICTION */
.pred-box{min-height:160px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;background:linear-gradient(135deg,rgba(16,185,129,.02),rgba(16,185,129,.005));border:1px solid rgba(16,185,129,.06);border-radius:22px;position:relative;overflow:hidden}
.pred-box::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(16,185,129,.04),transparent 70%);pointer-events:none}
.pred-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.pred-val{font-family:'Space Grotesk',sans-serif;font-size:80px;font-weight:800;color:var(--emerald);text-shadow:0 0 50px rgba(16,185,129,.3);transition:all .4s cubic-bezier(.4,0,.2,1);line-height:1}
.pred-val.big{color:var(--emerald)}
.pred-val.small{color:#f59e0b}
.pred-val.n-green{color:var(--emerald)}
.pred-val.n-red{color:#ef4444}
.pred-val.n-violet{color:#a855f7}
.pred-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1px}

/* BUTTON */
.pred-btn{width:100%;height:62px;border:none;border-radius:22px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.pred-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .3s}
.pred-btn:active{transform:scale(.96)}
.pred-btn.ready{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;box-shadow:0 12px 40px rgba(16,185,129,.35),0 0 0 1px rgba(16,185,129,.3)}
.pred-btn.ready:hover::before{opacity:1}
.pred-btn.locked{background:rgba(255,255,255,.03);color:var(--dim);cursor:not-allowed;box-shadow:none;border:1px solid var(--border)}
.pred-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-load{display:none;width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HISTORY */
.history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.h-item{width:36px;height:36px;border-radius:10px;display:flex;justify-content:center;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.05)}
.h-green{background:rgba(16,185,129,.1);color:var(--emerald);border-color:rgba(16,185,129,.15)}
.h-red{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.15)}
.h-violet{background:rgba(168,85,247,.1);color:#a855f7;border-color:rgba(168,85,247,.15)}

/* BOTTOM INFO */
.b-info{display:flex;justify-content:center;gap:28px;padding:12px 0}
.b-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.b-icon{width:42px;height:42px;background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.08);border-radius:14px;display:flex;justify-content:center;align-items:center}
.b-icon svg{width:18px;height:18px;stroke:var(--emerald);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-text{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

.footer{text-align:center;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}

@media(max-width:400px){
  .timer-circle{width:110px;height:110px}
  .timer-val{font-size:34px}
  .pred-val{font-size:64px}
}
</style>
</head>
<body>

<div class="bg"><div class="bg-grid"></div></div>
<div class="particles" id="particles"></div>

<div class="scroll">
  <div class="main">
    <!-- TOP -->
    <div class="top-card">
      <div class="game-row">
        <div class="game-logo"><img src="" id="gameImage" alt="Game"></div>
        <div class="game-info">
          <div class="game-lbl">Connected Game</div>
          <div class="game-name" id="gameName">OKWIN</div>
          <div class="game-tag">
            <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span id="modeTag">30 SEC MODE</span>
          </div>
        </div>
      </div>
      <div class="s-row">
        <div class="s-dot"></div>
        <div class="s-text">Quantum AI Server Connected</div>
      </div>
    </div>

    <!-- TIMER -->
    <div class="card" style="animation-delay:.1s">
      <div class="c-label">Live Timer</div>
      <div class="timer-wrap">
        <div class="timer-circle">
          <svg class="timer-svg" viewBox="0 0 130 130">
            <circle class="ring-bg" cx="65" cy="65" r="57.5"/>
            <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="57.5"/>
          </svg>
          <div class="timer-val" id="timer">00:30</div>
        </div>
        <div class="timer-side">
          <div class="mode-tag">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="timerModeText">30 SEC</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PERIOD -->
    <div class="card" style="animation-delay:.2s">
      <div class="c-label">Next Period</div>
      <div class="period-val" id="nextPeriod">----</div>
    </div>

    <!-- PREDICTION -->
    <div class="card" style="animation-delay:.3s">
      <div class="pred-box">
        <div class="pred-label">AI Prediction</div>
        <div class="pred-val" id="prediction">--</div>
        <div class="pred-sub" id="predSub">Tap button to predict</div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="card" style="animation-delay:.35s">
      <div class="c-label">Recent Results</div>
      <div class="history" id="history"></div>
    </div>

    <!-- BUTTON -->
    <button class="pred-btn ready" id="predBtn" onclick="onPredict()">
      <span id="btnText">GET PREDICTION</span>
      <div class="btn-load" id="btnLoad"></div>
      <svg id="btnIcon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </button>

    <!-- BOTTOM -->
    <div class="b-info">
      <div class="b-item"><div class="b-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div class="b-text">Secure</div></div>
      <div class="b-item"><div class="b-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></div><div class="b-text">AI Power</div></div>
      <div class="b-item"><div class="b-icon"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div class="b-text">Fast</div></div>
    </div>
    <div class="footer">Secure • Quantum • Fast</div>
  </div>
</div>

<script>
(function(){
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.onkeydown=function(e){if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&e.keyCode===73)||(e.ctrlKey&&e.shiftKey&&e.keyCode===74)||(e.ctrlKey&&e.keyCode===85))return false};
  window.addEventListener('blur',()=>{document.body.style.filter='blur(10px)'});
  window.addEventListener('focus',()=>{document.body.style.filter='none'});

  const fb='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144"><rect width="144" height="144" rx="34" fill="#07130d"/><circle cx="72" cy="72" r="44" fill="#10b981" opacity=".14"/><path d="M43 86 L62 39 L78 72 L91 51 L104 86 Z" fill="#10b981"/></svg>');
  const sg=JSON.parse(localStorage.getItem('selectedGame')||'null')||{name:'OKWIN',image:fb};
  const tt=localStorage.getItem('timerType')==='1m'?'1m':'30s';
  const pm=localStorage.getItem('predictionMode')==='NUMBER'?'NUMBER':'BIG SMALL';

  document.getElementById('gameImage').src=sg.image||fb;
  document.getElementById('gameImage').onerror=function(){this.src=fb};
  document.getElementById('gameName').innerHTML=sg.name||'OKWIN';
  document.getElementById('modeTag').innerText=tt==='1m'?'1 MIN MODE':'30 SEC MODE';
  document.getElementById('timerModeText').innerText=tt==='1m'?'1 MIN':'30 SEC';

  const API=tt==='1m'?'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageSize=10&pageNo=1':'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=10&pageNo=1';

  const timerEl=document.getElementById('timer');
  const ringFill=document.getElementById('ringFill');
  const nextPEl=document.getElementById('nextPeriod');
  const predEl=document.getElementById('prediction');
  const predSub=document.getElementById('predSub');
  const btn=document.getElementById('predBtn');
  const btnText=document.getElementById('btnText');
  const btnLoad=document.getElementById('btnLoad');
  const btnIcon=document.getElementById('btnIcon');
  const histEl=document.getElementById('history');

  let latest=[],curP='',shownP='',predP='',isFetch=false,predLock=false;
  const totT=tt==='1m'?60:30;
  const circ=2*Math.PI*57.5;
  let sOff=0;

  function addOne(v){const d=String(v||'').trim();if(!/^\d+$/.test(d))return'';let c=1,r='';for(let i=d.length-1;i>=0;i--){const s=Number(d[i])+c;r=String(s%10)+r;c=s>9?1:0}return c?'1'+r:r}
  function incP(p){if(!p)return'----';const c=String(p).trim();if(/^\d+$/.test(c))return addOne(c);const h=c.match(/^(.+?)(\d+)$/);if(h)return h[1]+addOne(h[2]).padStart(h[2].length,'0');return'----'}
  function rI(r){return String(r?.issueNumber||r?.issue||r?.periodNo||r?.period||'').trim()}
  function rN(r){const raw=r?.number??r?.openCode??r?.result??r?.digit;const m=String(raw??'').match(/\d/);return m?Number(m[0]):NaN}

  async function fetchData(){
    try{const res=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();const sd=res.headers.get('Date');if(sd){const st=new Date(sd).getTime();if(!isNaN(st))sOff=st-Date.now()}
    return Array.isArray(d?.data?.list)?d.data.list:[]}catch(e){return[]}
  }

  function setReady(){btn.className='pred-btn ready';btn.disabled=false;btnText.style.display='block';btnLoad.style.display='none';btnIcon.style.display='block'}
  function setLocked(){btn.className='pred-btn locked';btn.disabled=true;btnText.style.display='block';btnLoad.style.display='none';btnIcon.style.display='none'}
  function setLoading(){btn.className='pred-btn locked';btn.disabled=true;btnText.style.display='none';btnLoad.style.display='block';btnIcon.style.display='none'}

  function resetPred(){predEl.innerText='--';predEl.className='pred-val';predSub.innerText='Tap button to predict'}

  function renderP(np){if(!np||np===shownP)return;shownP=np;nextPEl.innerText=shownP;nextPEl.classList.remove('flash');void nextPEl.offsetWidth;nextPEl.classList.add('flash');if(predP!==shownP){resetPred();predLock=false;updateBtn()}}

  function gSN(){return new Date(Date.now()+sOff)}
  function gRem(){const n=gSN();const s=n.getSeconds();const ms=n.getMilliseconds();const el=tt==='30s'?s%30:s;return Math.max(0,totT-el-(ms>0?1:0))}
  function gEl(){const n=gSN();return tt==='30s'?n.getSeconds()%30:n.getSeconds()}

  function updateTimer(){
    const rem=gRem();const m=String(Math.floor(rem/60)).padStart(2,'0');const s=String(rem%60).padStart(2,'0');
    timerEl.innerText=m+':'+s;
    const ur=rem<=5&&rem>0;
    timerEl.classList.toggle('urgent',ur);ringFill.classList.toggle('urgent',ur);
    ringFill.style.strokeDashoffset=circ*(1-rem/totT);
    updateBtn();if(rem===0)handleZero();
  }

  function updateBtn(){if(predLock){setLocked();return}const el=gEl();if(el>=0&&el<=18)setReady();else setLocked()}

  let lz='';
  function handleZero(){const n=gSN();const k=n.getMinutes()+'-'+n.getSeconds();if(k===lz)return;lz=k;setTimeout(()=>updP(false),900);setTimeout(()=>updP(false),2500)}

  async function updP(f=false){if(isFetch&&!f)return false;isFetch=true;const d=await fetchData();isFetch=false;if(!d.length){updateTimer();return false}latest=d;const li=rI(d[0]);if(!li){updateTimer();return false}curP=li;renderP(incP(curP));updateTimer();renderHistory();return true}

  function renderHistory(){
    histEl.innerHTML='';
    const last8=latest.slice(0,8);
    last8.forEach(r=>{
      const num=rN(r);if(isNaN(num))return;
      let cls='h-violet';
      if(num===1||num===3||num===7||num===9)cls='h-green';
      else if(num===2||num===4||num===6||num===8)cls='h-red';
      histEl.innerHTML+=`<div class="h-item ${cls}">${num}</div>`;
    });
  }

  function firstGaps(n){const g=[];for(let i=0;i<n.length-1;i++)g.push(Math.abs(n[i]-n[i+1]));return g}
  function makeLayers(g){let c=[...g],b=[],lo=null;while(c.length>1){const nx=[];for(let i=0;i<c.length-1;i++){const df=Math.abs(c[i]-c[i+1]);if(df<=1)nx.push(df)}lo=c.length%2!==0?c[c.length-1]:null;c=[...nx];b=[...c];if(c.length<=1)break}return{b,lo}}
  function predBS(b){const z=b.filter(x=>x===0).length;const o=b.filter(x=>x===1).length;const l=b[b.length-1]||0;if(l===1)return o%2!==0?'BIG':'SMALL';return z%2!==0?'SMALL':'BIG'}
  function predNum(b,lo,bs){if(lo!==null){const p=bs==='BIG'?[5,6,7,8,9]:[0,1,2,3,4];const f=p.filter(x=>x%2===lo%2);return f[Math.floor(Math.random()*f.length)]}return Math.floor(Math.random()*10)}
  function applyColor(n){predEl.className='pred-val';if(n===1||n===3||n===7||n===9)predEl.classList.add('n-green');else if(n===2||n===4||n===6||n===8)predEl.classList.add('n-red');else if(n===0||n===5)predEl.classList.add('n-violet')}

  async function onPredict(){
    if(predLock||isFetch)return;
    if(!shownP||shownP==='----')await updP(true);
    setLoading();await updP(true);
    const nums=latest.map(rN).filter(n=>Number.isInteger(n));
    if(nums.length<2||!shownP||shownP==='----'){predEl.innerText='NO DATA';predEl.className='pred-val';predEl.style.color='#ef4444';predSub.innerText='Insufficient data';setReady();return}
    let gaps=firstGaps(nums);let{b,lo}=makeLayers(gaps);if(!b.length)b=[0];
    const bs=predBS(b);const num=predNum(b,lo,bs);
    if(pm==='NUMBER'){predEl.innerText=num;predEl.style.fontSize='80px';applyColor(num);predSub.innerText='Number Prediction'}
    else{predEl.innerText=bs;predEl.style.fontSize='56px';predEl.className='pred-val '+(bs==='BIG'?'big':'small');predSub.innerText='Big/Small Prediction'}
    predP=shownP;predLock=true;setLocked();if(navigator.vibrate)navigator.vibrate([10,30,10]);
  }
  window.onPredict=onPredict;

  // Matrix canvas
  const cvs=document.createElement('canvas');cvs.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.025;pointer-events:none';document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d');const lt='01';const fs=14;let cols=0;let dr=[];
  function sz(){cvs.width=innerWidth;cvs.height=innerHeight;cols=Math.floor(cvs.width/fs);dr=Array.from({length:cols},()=>1)}
  function dw(){ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#10b981';ctx.font=fs+'px monospace';for(let i=0;i<dr.length;i++){ctx.fillText(lt[Math.floor(Math.random()*lt.length)],i*fs,dr[i]*fs);if(dr[i]*fs>cvs.height&&Math.random()>.97)dr[i]=0;dr[i]++}}
  sz();setInterval(dw,35);addEventListener('resize',sz);

  updateTimer();updP(true);
  setInterval(updateTimer,250);
  setInterval(()=>updP(false),10000);
  setInterval(()=>{if(shownP&&predP!==shownP&&predLock){predLock=false;updateBtn()}},500);

  const pc=document.getElementById('particles');
  for(let i=0;i<18;i++){const p=document.createElement('div');p.className='p';const s=Math.random()*3+1;p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:hsl(${150+Math.random()*30},${70+Math.random()*30}%,${60+Math.random()*30}%);animation-delay:${Math.random()*6}s;animation-duration:${4+Math.random()*6}s;opacity:${.15+Math.random()*.3}`;pc.appendChild(p)}
})();
</script>
</body>
</html>
