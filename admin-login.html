<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}
body{
background:#050505;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}
.card{
width:90%;
max-width:390px;
padding:30px;
background:rgba(255,255,255,.04);
border:1px solid rgba(0,255,136,.15);
border-radius:30px;
box-shadow:0 0 30px rgba(0,255,136,.08);
}
.title{
font-size:28px;
font-weight:800;
text-align:center;
}
.title span{
color:#00ff88;
}
.sub{
margin-top:10px;
text-align:center;
font-size:12px;
color:#888;
}
input{
width:100%;
height:56px;
margin-top:18px;
background:#0f0f0f;
border:1px solid rgba(0,255,136,.14);
border-radius:18px;
padding:0 18px;
color:white;
outline:none;
}
button{
width:100%;
height:56px;
margin-top:18px;
border:none;
border-radius:18px;
background:#00ff88;
color:black;
font-weight:700;
font-size:15px;
}
</style>
</head>
<body>
<div class="card">
<div class="title">ADMIN <span>LOGIN</span></div>
<div class="sub">CONTROL ACCESS SYSTEM</div>
<input type="password" id="user" placeholder="Admin Username">
<input type="password" id="pass" placeholder="Admin Password">
<button onclick="login()">LOGIN PANEL</button>
</div>
<script>
function login(){
let u=document.getElementById('user').value;
let p=document.getElementById('pass').value;
if(u==='admin'&&p==='admin123'){
localStorage.setItem('admin','true');
window.location.href='admin-home.html';
}else{
alert('Invalid Admin Login');
}
}
</script>
</body>
</html>
