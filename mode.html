<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Mode - Devil Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --green-light: #34d399;
            --green-dark: #059669;
            --bg: #070b14;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --card-bg: #0f1724;
            --border: #1a2535;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 44px;
            height: 44px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--green-dark);
            border-color: var(--green);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            fill: none;
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        /* Header */
        .header {
            text-align: center;
            padding-top: 70px;
            margin-bottom: 24px;
            animation: fadeUp 0.5s ease forwards;
        }

        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: var(--bg);
        }

        .game-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .sync-tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--green-dark);
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--green);
            letter-spacing: 1px;
            border-radius: 2px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            animation: fadeUp 0.5s ease 0.1s forwards;
            opacity: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 0;
            animation: pulse 2s infinite;
        }

        .status-text {
            font-size: 12px;
            color: var(--green);
            font-weight: 500;
        }

        /* Section Title */
        .section-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            animation: fadeUp 0.5s ease 0.2s forwards;
            opacity: 0;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
            animation: fadeUp 0.5s ease 0.3s forwards;
            opacity: 0;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 2px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .card:hover {
            border-color: var(--green-dark);
            background: rgba(16, 185, 129, 0.05);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.selected {
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.1);
        }

        .card.selected::before {
            background: var(--green);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 2px;
        }

        .card.selected .card-icon {
            background: var(--green);
        }

        .card-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--green);
            fill: none;
            stroke-width: 2;
        }

        .card.selected .card-icon svg {
            stroke: var(--bg);
        }

        .card-value {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .card-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card.selected .card-value {
            color: var(--green);
        }

        /* Mode Cards */
        .mode-section {
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease 0.4s forwards;
            opacity: 0;
        }

        .mode-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 2px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .mode-card:hover {
            border-color: var(--green-dark);
            background: rgba(16, 185, 129, 0.05);
        }

        .mode-card:active {
            transform: scale(0.98);
        }

        .mode-card.selected {
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.1);
        }

        .mode-card.selected::before {
            background: var(--green);
        }

        .mode-card-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mode-icon {
            width: 48px;
            height: 48px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mode-card.selected .mode-icon {
            background: var(--green);
        }

        .mode-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--green);
            fill: none;
            stroke-width: 2;
        }

        .mode-card.selected .mode-icon svg {
            stroke: var(--bg);
        }

        .mode-info {
            text-align: left;
            flex: 1;
        }

        .mode-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .mode-card.selected .mode-title {
            color: var(--green);
        }

        .mode-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Continue Button */
        .continue-section {
            animation: fadeUp 0.5s ease 0.5s forwards;
            opacity: 0;
        }

        .continue-btn {
            width: 100%;
            padding: 18px;
            background: var(--border);
            border: none;
            border-radius: 2px;
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: not-allowed;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .continue-btn.ready {
            background: var(--green);
            color: var(--bg);
            cursor: pointer;
        }

        .continue-btn.ready:hover {
            background: var(--green-light);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .continue-btn.ready:active {
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
            }
        }

        .card.selected .card-icon,
        .mode-card.selected .mode-icon {
            animation: glow 2s infinite;
        }

        /* Selection feedback */
        .vibrate {
            animation: vibrate 0.1s ease;
        }

        @keyframes vibrate {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back Button -->
        <button class="back-btn" onclick="goBack()">
            <svg viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
        </button>

        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="game-name">DEVIL PREDICTOR</h1>
            <span class="sync-tag">AI SYNCED</span>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Server Connected</span>
        </div>

        <!-- Timer Section -->
        <h2 class="section-title">SELECT SPEED</h2>
        <div class="card-grid">
            <div class="card" onclick="selTimer(30, this)">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <div class="card-value">30 SEC</div>
                <div class="card-label">Quick Round</div>
            </div>
            <div class="card" onclick="selTimer(60, this)">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <div class="card-value">1 MIN</div>
                <div class="card-label">Standard</div>
            </div>
        </div>

        <!-- Mode Section -->
        <div class="mode-section">
            <h2 class="section-title">SELECT MODE</h2>
            <div class="mode-card" onclick="selMode('bigsmall', this)">
                <div class="mode-card-content">
                    <div class="mode-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>
                        </svg>
                    </div>
                    <div class="mode-info">
                        <div class="mode-title">BIG / SMALL</div>
                        <div class="mode-desc">Predict the size outcome</div>
                    </div>
                </div>
            </div>
            <div class="mode-card" onclick="selMode('number', this)">
                <div class="mode-card-content">
                    <div class="mode-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 7h16M4 12h16M4 17h16"/>
                            <circle cx="8" cy="7" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                            <circle cx="10" cy="17" r="2"/>
                        </svg>
                    </div>
                    <div class="mode-info">
                        <div class="mode-title">NUMBER</div>
                        <div class="mode-desc">Predict exact number</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Continue Button -->
        <div class="continue-section">
            <button class="continue-btn" id="continueBtn" onclick="cont()">SELECT OPTIONS TO CONTINUE</button>
        </div>
    </div>

    <script>
        let timer = null;
        let mode = null;

        function selTimer(t, el) {
            if (navigator.vibrate) navigator.vibrate(10);
            
            el.classList.add('vibrate');
            setTimeout(() => el.classList.remove('vibrate'), 100);
            
            document.querySelectorAll('.card-grid .card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            
            timer = t;
            checkReady();
        }

        function selMode(m, el) {
            if (navigator.vibrate) navigator.vibrate(10);
            
            el.classList.add('vibrate');
            setTimeout(() => el.classList.remove('vibrate'), 100);
            
            document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            
            mode = m;
            checkReady();
        }

        function checkReady() {
            const btn = document.getElementById('continueBtn');
            if (timer && mode) {
                btn.classList.add('ready');
                btn.textContent = 'CONTINUE';
            } else {
                btn.classList.remove('ready');
                btn.textContent = 'SELECT OPTIONS TO CONTINUE';
            }
        }

        function cont() {
            if (!timer || !mode) return;
            
            if (navigator.vibrate) navigator.vibrate(20);
            
            localStorage.setItem('selectedTimer', timer);
            localStorage.setItem('selectedMode', mode);
            
            const btn = document.getElementById('continueBtn');
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                window.location.href = 'prediction.html';
            }, 150);
        }

        function goBack() {
            if (navigator.vibrate) navigator.vibrate(10);
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
