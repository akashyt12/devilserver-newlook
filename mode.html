<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEVIL MODE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#050505;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    color:white;
}

.app{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    overflow:hidden;
    background:#050505;
}

/* MATRIX */

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    opacity:.05;
    z-index:0;
}

/* GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
}

.glow1{
    width:240px;
    height:240px;
    background:#00ff8850;
    top:-120px;
    left:-80px;
}

.glow2{
    width:220px;
    height:220px;
    background:#00ff6640;
    bottom:-80px;
    right:-90px;
}

/* MAIN */

.main{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    overflow-y:auto;
    padding:24px 22px 40px;
}

.main::-webkit-scrollbar{
    width:0;
}

/* TOP */

.topBar{
    display:flex;
    align-items:center;
    gap:14px;
}

/* IMAGE */

.gameImage{
    width:75px;
    height:75px;
    border-radius:22px;
    object-fit:cover;
    border:1px solid #1f1f1f;

    background:#111;

    box-shadow:
    0 0 25px rgba(0,255,136,.18);
}

/* INFO */

.gameInfo{
    flex:1;
}

.small{
    font-size:11px;
    color:#6f6f6f;
    letter-spacing:1px;
}

.gameName{
    margin-top:5px;
    font-size:24px;
    font-weight:800;
    color:white;
}

.gameName span{
    color:#00ff88;
}

/* TIMER */

.timerType{
    margin-top:8px;

    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 14px;

    border-radius:14px;

    background:#00ff8815;
    border:1px solid #00ff8835;

    color:#00ff88;

    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
}

/* STATUS */

.status{
    margin-top:28px;

    width:100%;

    padding:14px 18px;

    border-radius:18px;

    background:rgba(15,15,15,.92);

    border:1px solid #1c1c1c;

    display:flex;
    align-items:center;
    gap:10px;

    font-size:12px;
    color:#d0d0d0;

    backdrop-filter:blur(12px);
}

/* DOT */

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#00ff88;

    box-shadow:
    0 0 12px #00ff88;

    animation:pulse 1s infinite;
}

/* TITLE */

.title{
    margin-top:36px;
    font-size:28px;
    font-weight:800;
    line-height:38px;
}

.title span{
    color:#00ff88;
}

/* SUB */

.sub{
    margin-top:12px;
    font-size:13px;
    color:#7a7a7a;
    line-height:22px;
}

/* BUTTONS */

.buttons{
    margin-top:34px;
}

/* BUTTON */

.btn{
    width:100%;

    padding:24px;

    margin-bottom:18px;

    border:none;
    outline:none;

    border-radius:28px;

    background:rgba(14,14,14,.92);

    border:1px solid #1c1c1c;

    color:white;

    cursor:pointer;

    transition:.25s;

    backdrop-filter:blur(14px);

    box-shadow:
    0 0 30px rgba(0,255,136,.05);
}

.btn:active{
    transform:scale(.98);
}

/* BUTTON TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* MODE */

.mode{
    font-size:21px;
    font-weight:800;
}

/* ICON */

.icon{
    width:52px;
    height:52px;

    border-radius:18px;

    background:#00ff88;

    color:black;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    font-weight:700;

    box-shadow:
    0 0 25px rgba(0,255,136,.30);
}

/* TEXT */

.text{
    margin-top:12px;

    font-size:12px;
    line-height:20px;

    color:#888;
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;

    font-size:11px;
    color:#5f5f5f;
    letter-spacing:1px;
}

/* ANIMATION */

@keyframes pulse{

    50%{
        opacity:.35;
        transform:scale(.8);
    }

}

/* MOBILE */

@media(max-width:360px){

    .title{
        font-size:24px;
        line-height:34px;
    }

    .mode{
        font-size:18px;
    }

    .btn{
        padding:20px;
    }

    .gameImage{
        width:65px;
        height:65px;
    }

    .gameName{
        font-size:20px;
    }

}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="app">

    <div class="glow1"></div>
    <div class="glow2"></div>

    <div class="main">

        <!-- TOP -->

        <div class="topBar">

            <img src="image1.png"
            id="gameImage"
            class="gameImage">

            <div class="gameInfo">

                <div class="small">
                    CONNECTED GAME
                </div>

                <div class="gameName"
                id="gameName">
                    OKWIN
                </div>

                <div class="timerType"
                id="timerType">
                    ⚡ 1 MIN MODE
                </div>

            </div>

        </div>

        <!-- STATUS -->

        <div class="status">

            <div class="dot"></div>

            AI SERVER CONNECTED SUCCESSFULLY

        </div>

        <!-- TITLE -->

        <div class="title">
            SELECT <span>PREDICTION MODE</span>
        </div>

        <!-- SUB -->

        <div class="sub">
            Choose your AI prediction engine and continue to advanced smart signal analysis system.
        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <!-- BIG SMALL -->

            <button class="btn"
            onclick="selectMode('BIG SMALL')">

                <div class="top">

                    <div class="mode">
                        BIG / SMALL
                    </div>

                    <div class="icon">
                        ⚡
                    </div>

                </div>

            </button>

            <!-- NUMBER -->

            <button class="btn"
            onclick="selectMode('NUMBER')">

                <div class="top">

                    <div class="mode">
                        NUMBER MODE
                    </div>

                    <div class="icon">
                        🔢
                    </div>

                </div>

                
            </button>

        </div>

        <!-- FOOTER -->

        <div class="footer">
            Secure • AI Powered • Fast
        </div>

    </div>

</div>

<script>

/* =========================
   GET GAME DATA
========================= */

const gameData =
JSON.parse(
localStorage.getItem('selectedGame')
);

/* REDIRECT */

if(!gameData){

window.location.href='home.html';

}

/* =========================
   SET UI
========================= */

/* IMAGE */

document.getElementById('gameImage')
.src = gameData.image;

/* NAME */

document.getElementById('gameName')
.innerText = gameData.name;

/* TIMER */

if(gameData.timer === '1m'){

document.getElementById('timerType')
.innerHTML =
'⚡ 1 MIN MODE';

}else{

document.getElementById('timerType')
.innerHTML =
'⚡ 30 SEC MODE';

}

/* =========================
   SAVE MODE
========================= */

function selectMode(mode){

/* SAVE PREDICTION MODE */

localStorage.setItem(
'predictionMode',
mode
);

/* SAVE TIMER AGAIN */

localStorage.setItem(
'timerType',
gameData.timer
);

/* SAVE GAME AGAIN */

localStorage.setItem(
'selectedGame',
JSON.stringify(gameData)
);

/* GO NEXT */

window.location.href =
'Prediction.html';

}

/* =========================
   MATRIX EFFECT
========================= */

const canvas =
document.getElementById('matrix');

const ctx =
canvas.getContext('2d');

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const letters='01';

const fontSize=14;

const columns =
canvas.width/fontSize;

const drops=[];

for(let i=0;i<columns;i++){

drops[i]=1;

}

function draw(){

ctx.fillStyle='rgba(0,0,0,0.08)';

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle='#00ff88';

ctx.font=
fontSize+'px monospace';

for(let i=0;i<drops.length;i++){

let text =
letters[
Math.floor(
Math.random()*letters.length
)
];

ctx.fillText(
text,
i*fontSize,
drops[i]*fontSize
);

if(
drops[i]*fontSize >
canvas.height &&
Math.random()>0.97
){

drops[i]=0;

}

drops[i]++;

}

}

setInterval(draw,35);

</script>

</body>
</html>
