<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Selection - Devil Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #030712;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-disabled: #4b5563;
      --glow: 0 0 30px rgba(16, 185, 129, 0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--emerald-500);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-30px) translateX(20px);
        opacity: 0.6;
      }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--emerald-500), transparent);
      top: -100px;
      right: -100px;
    }

    .blob-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--emerald-600), transparent);
      bottom: -80px;
      left: -80px;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--emerald-400), transparent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.08;
    }

    .grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(20px);
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--emerald-500);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 100px 20px 120px;
      position: relative;
      z-index: 1;
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo-box {
      width: 72px;
      height: 72px;
      background: var(--glass-bg);
      border: 2px solid var(--emerald-500);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .logo-box svg {
      width: 36px;
      height: 36px;
      fill: var(--emerald-500);
    }

    .header-info {
      flex: 1;
    }

    .game-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sync-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--emerald-400);
      letter-spacing: 1px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--emerald-500);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: var(--emerald-500);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(2);
      }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-text span {
      color: var(--emerald-400);
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .section-title span {
      color: var(--emerald-400);
    }

    .timer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    .timer-card {
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
    }

    .timer-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .timer-card.selected {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1));
      border-color: var(--emerald-500);
      box-shadow: var(--glow);
    }

    .timer-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .timer-card.selected .timer-icon {
      border-color: var(--emerald-500);
      background: rgba(16, 185, 129, 0.1);
    }

    .timer-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s;
    }

    .timer-card.selected .timer-icon svg {
      stroke: var(--emerald-400);
    }

    .timer-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .timer-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .mode-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .mode-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
    }

    .mode-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .mode-card.selected {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.08));
      border-color: var(--emerald-500);
    }

    .mode-icon {
      width: 60px;
      height: 60px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .mode-card.selected .mode-icon {
      border-color: var(--emerald-500);
      background: rgba(16, 185, 129, 0.1);
    }

    .mode-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s;
    }

    .mode-card.selected .mode-icon svg {
      stroke: var(--emerald-400);
    }

    .mode-info {
      flex: 1;
    }

    .mode-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .mode-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .check-circle {
      width: 28px;
      height: 28px;
      border: 2px solid var(--emerald-500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .mode-card.selected .check-circle {
      background: var(--emerald-500);
    }

    .check-circle svg {
      width: 14px;
      height: 14px;
      stroke: var(--bg);
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .mode-card.selected .check-circle svg {
      opacity: 1;
    }

    .continue-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 100;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    .continue-btn {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: not-allowed;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-disabled);
    }

    .continue-btn.ready {
      background: linear-gradient(135deg, var(--emerald-500), var(--emerald-600));
      color: white;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }

    .continue-btn.ready:hover {
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    .continue-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid"></div>
  <div id="particles"></div>

  <a href="login.html" class="back-btn">
    <svg viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>

  <div class="container">
    <div class="header">
      <div class="logo-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="header-info">
        <div class="game-name" id="gameName">Loading...</div>
        <span class="sync-tag">AI SYNCED</span>
      </div>
    </div>

    <div class="status-bar glass">
      <div class="pulse-dot"></div>
      <div class="status-text">Quantum AI Server <span>Connected</span></div>
    </div>

    <div class="section-title">SELECT <span>TIMER</span></div>
    <div class="timer-grid">
      <div class="timer-card" data-timer="30" onclick="selTimer(this)">
        <div class="timer-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="timer-label">30 SEC</div>
        <div class="timer-desc">Fast Mode</div>
      </div>
      <div class="timer-card" data-timer="60" onclick="selTimer(this)">
        <div class="timer-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="timer-label">1 MIN</div>
        <div class="timer-desc">Stable Mode</div>
      </div>
    </div>

    <div class="section-title">SELECT <span>MODE</span></div>
    <div class="mode-stack">
      <div class="mode-card" data-mode="bigsmall" onclick="selMode(this)">
        <div class="mode-icon">
          <svg viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="mode-info">
          <div class="mode-name">BIG / SMALL</div>
          <div class="mode-desc">Predict 0-4 or 5-9</div>
        </div>
        <div class="check-circle">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
      <div class="mode-card" data-mode="number" onclick="selMode(this)">
        <div class="mode-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </div>
        <div class="mode-info">
          <div class="mode-name">NUMBER MODE</div>
          <div class="mode-desc">Predict exact 0-9</div>
        </div>
        <div class="check-circle">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="continue-bar">
    <button class="continue-btn" id="continueBtn" onclick="cont()">
      <span>CONTINUE</span>
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <script>
    const games = {
      'okwin': { name: 'OKWIN', img: 'image1.png' },
      '51game': { name: '51 GAME', img: 'image2.png' },
      '55club': { name: '55 CLUB', img: 'image3.png' },
      '82lottery': { name: '82 LOTTERY', img: 'image4.png' },
      'dmwin': { name: 'DM WIN', img: 'image5.png' },
      'jaiclub': { name: 'JAI CLUB', img: 'image6.png' },
      'yaarwin': { name: 'YAARWIN', img: 'image7.png' },
      'bdgwin': { name: 'BDG WIN', img: 'image8.png' },
      'bigmumbai': { name: 'BIG MUMBAI', img: 'image9.png' },
      'tiranga': { name: 'TIRANGA', img: 'image10.png' },
      'tashanwin': { name: 'TASHAN WIN', img: 'image11.png' },
      'sikkim': { name: 'SIKKIM', img: 'image12.png' }
    };

    let selectedGame = localStorage.getItem('selectedGame') || 'okwin';
    let timerSelected = null;
    let modeSelected = null;

    function init() {
      const game = games[selectedGame] || games['okwin'];
      document.getElementById('gameName').textContent = game.name;
      const logoBox = document.querySelector('.logo-box');
      logoBox.innerHTML = `<img src="${game.img}" alt="${game.name}" style="width:100%;height:100%;object-fit:cover;border-radius:18px;">`;
    }

    function selTimer(el) {
      if (timerSelected) {
        timerSelected.classList.remove('selected');
      }
      if (timerSelected === el) {
        timerSelected = null;
      } else {
        el.classList.add('selected');
        timerSelected = el;
        navigator.vibrate(10);
      }
      chk();
    }

    function selMode(el) {
      if (modeSelected) {
        modeSelected.classList.remove('selected');
      }
      if (modeSelected === el) {
        modeSelected = null;
      } else {
        el.classList.add('selected');
        modeSelected = el;
        navigator.vibrate(10);
      }
      chk();
    }

    function chk() {
      const btn = document.getElementById('continueBtn');
      if (timerSelected && modeSelected) {
        btn.classList.add('ready');
      } else {
        btn.classList.remove('ready');
      }
    }

    function cont() {
      if (!timerSelected || !modeSelected) return;
      
      localStorage.setItem('timerType', timerSelected.dataset.timer);
      localStorage.setItem('predictionMode', modeSelected.dataset.mode);
      localStorage.setItem('selectedGame', selectedGame);
      
      window.location.href = 'prediction.html';
    }

    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (6 + Math.random() * 6) + 's';
        container.appendChild(particle);
      }
    }

    init();
    createParticles();
  </script>
</body>
</html>
