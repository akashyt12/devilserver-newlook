<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}
body{
background:#050505;
color:white;
}
.header{
padding:22px;
font-size:28px;
font-weight:800;
}
.header span{
color:#00ff88;
}
.container{
padding:20px;
}
.card{
background:#0d0d0d;
border:1px solid rgba(0,255,136,.14);
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 0 20px rgba(0,255,136,.05);
}
.label{
font-size:12px;
color:#888;
margin-bottom:12px;
}
.value{
font-size:32px;
font-weight:800;
color:#00ff88;
}
input,select{
width:100%;
height:56px;
margin-top:15px;
background:#121212;
border:1px solid rgba(0,255,136,.15);
border-radius:18px;
padding:0 16px;
color:white;
outline:none;
}
button{
width:100%;
height:56px;
margin-top:16px;
border:none;
border-radius:18px;
background:#00ff88;
color:black;
font-size:15px;
font-weight:700;
}
.keyBox{
margin-top:18px;
padding:16px;
background:#111;
border-radius:18px;
border:1px solid rgba(0,255,136,.14);
word-break:break-all;
font-size:13px;
}
.list{
margin-top:18px;
}
.userItem{
padding:16px;
background:#111;
border-radius:18px;
border:1px solid rgba(0,255,136,.12);
margin-bottom:14px;
}
.userItem h3{
font-size:15px;
color:#00ff88;
margin-bottom:8px;
}
.deleteBtn{
background:#ff3d3d;
color:white;
margin-top:10px;
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
</style>
</head>
<body>
<div class="header">
ADMIN <span>PANEL</span>
</div>
<div class="container">
<div class="card">
<div class="label">ACTIVE USERS</div>
<div class="value" id="activeUsers">0</div>
</div>

<div class="row">
<div class="card">
<div class="label">TOTAL KEYS</div>
<div class="value" id="totalKeys">0</div>
</div>
<div class="card">
<div class="label">ONLINE</div>
<div class="value" id="online">1</div>
</div>
</div>

<div class="card">
<div class="label">CREATE KEY</div>
<input type="text" id="username" placeholder="User Name">
<select id="expiry">
<option value="30">30 Minutes</option>
<option value="60">1 Hour</option>
<option value="1440">1 Day</option>
<option value="4320">3 Days</option>
<option value="10080">7 Days</option>
<option value="21600">15 Days</option>
<option value="43200">1 Month</option>
<option value="permanent">Permanent</option>
</select>
<button onclick="createKey()">CREATE ACCESS KEY</button>
<div class="keyBox" id="generatedKey">No Key Generated</div>
</div>

<div class="card">
<div class="label">ALL USERS & KEYS</div>
<div class="list" id="userList"></div>
</div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getDatabase,
ref,
set,
get,
remove,
onValue
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig={
apiKey:'AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko',
authDomain:'admin-pannel-de3f4.firebaseapp.com',
databaseURL:'https://admin-pannel-de3f4-default-rtdb.firebaseio.com',
projectId:'admin-pannel-de3f4',
storageBucket:'admin-pannel-de3f4.firebasestorage.app',
messagingSenderId:'318138798074',
appId:'1:318138798074:web:0252256f3ddc783d815e43'
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

function randomKey(){
return 'DEVIL-'+Math.random().toString(36).substring(2,8).toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase();
}

window.createKey=async function(){

const username=document.getElementById('username').value;
const expiry=document.getElementById('expiry').value;

if(username===''){
alert('Enter Username');
return;
}

const key=randomKey();

let expiryTime;
if(expiry==='permanent'){
expiryTime=9999999999999;
}else{
expiryTime=Date.now()+(parseInt(expiry)*60000);
}

await set(ref(db,'keys/'+key),{
username:username,
key:key,
expiry:expiryTime,
created:Date.now(),
status:'active'
});

document.getElementById('generatedKey').innerText=key;
document.getElementById('username').value='';

loadUsers();

}

async function loadUsers(){

const snap=await get(ref(db,'keys'));

const list=document.getElementById('userList');

list.innerHTML='';

let total=0;

if(snap.exists()){

const data=snap.val();

const keys=Object.keys(data);

total=keys.length;

keys.forEach(k=>{

const item=data[k];

const div=document.createElement('div');

div.className='userItem';

let expiryText='Permanent';

if(item.expiry!==9999999999999){

const date=new Date(item.expiry);

expiryText=date.toLocaleString();

}

const active=item.expiry>Date.now();

if(active){

div.innerHTML=`
<h3>${item.username}</h3>
<p>KEY: ${item.key}</p>
<p>STATUS: Active</p>
<p>EXPIRY: ${expiryText}</p>
<button class="deleteBtn" onclick="deleteKey('${item.key}')">DELETE KEY</button>
`;

}else{

div.innerHTML=`
<h3>${item.username}</h3>
<p>KEY: ${item.key}</p>
<p>STATUS: Expired</p>
<p>EXPIRY: ${expiryText}</p>
<button class="deleteBtn" onclick="deleteKey('${item.key}')">DELETE KEY</button>
`;

}
list.appendChild(div);

});

}

document.getElementById('totalKeys').innerText=total;
document.getElementById('activeUsers').innerText=total;

}

window.deleteKey=async function(key){

await remove(ref(db,'keys/'+key));

loadUsers();

}

loadUsers();

setInterval(()=>{
loadUsers();
},5000);

</script>
</body>
</html>
