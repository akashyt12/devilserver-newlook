<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEVIL PREDICTOR</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    background:#050505;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* APP */

.app{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    overflow:hidden;
    background:#050505;
}

/* GREEN GLOW */

.light{
    position:absolute;
    width:260px;
    height:260px;
    background:#00ff8840;
    border-radius:50%;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    filter:blur(50px);
    animation:float 5s ease-in-out infinite;
}

/* DOTS */

.dot1,
.dot2,
.dot3{
    position:absolute;
    border-radius:50%;
    background:#1b1b1b;
}

.dot1{
    width:8px;
    height:8px;
    top:120px;
    left:40px;
}

.dot2{
    width:12px;
    height:12px;
    top:180px;
    right:45px;
}

.dot3{
    width:6px;
    height:6px;
    bottom:160px;
    left:60px;
}

/* MATRIX BG */

.matrix{
    position:absolute;
    inset:0;
    opacity:.05;

    background-image:
    linear-gradient(rgba(0,255,136,.2) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,.2) 1px, transparent 1px);

    background-size:28px 28px;
}

/* CENTER */

.center{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:24px;
    position:relative;
    z-index:2;
}

/* LOGO BOX */

.logoBox{
    width:92px;
    height:92px;

    border-radius:28px;

    background:#0f0f0f;
    border:1px solid #1f1f1f;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 30px rgba(0,255,136,.08),
    inset 0 0 20px rgba(0,255,136,.03);

    animation:updown 2.5s ease-in-out infinite;
}

/* LOGO */

.logo{
    font-size:36px;
    color:#00ff88;

    text-shadow:
    0 0 15px rgba(0,255,136,.5);
}

/* TITLE */

.title{
    margin-top:28px;

    font-size:23px;
    font-weight:700;

    color:white;

    letter-spacing:.5px;
}

.title span{
    color:#00ff88;
}

/* SUBTITLE */

.sub{
    margin-top:8px;

    font-size:11px;
    color:#7c7c7c;

    letter-spacing:2px;
    text-transform:uppercase;
}

/* LOADING */

.loading{
    margin-top:28px;

    display:flex;
    align-items:center;
    gap:8px;

    font-size:12px;
    color:#b5b5b5;
}

.pulse{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#00ff88;

    box-shadow:
    0 0 12px #00ff88;

    animation:pulse 1s infinite;
}

/* LOADER */

.loader{
    margin-top:28px;

    width:44px;
    height:44px;

    border-radius:50%;

    border:3px solid #1d1d1d;
    border-top:3px solid #00ff88;

    animation:spin 1s linear infinite;
}

/* FOOTER */

.footer{
    position:absolute;
    bottom:38px;
    left:50%;

    transform:translateX(-50%);

    font-size:11px;
    color:#5f5f5f;

    letter-spacing:1px;
}

/* ANIMATIONS */

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    50%{
        opacity:.3;
        transform:scale(.8);
    }
}

@keyframes float{
    50%{
        transform:translateX(-50%) scale(1.1);
    }
}

@keyframes updown{
    50%{
        transform:translateY(-8px);
    }
}

/* MOBILE */

@media(max-width:360px){

.title{
    font-size:20px;
}

.logoBox{
    width:80px;
    height:80px;
}

.logo{
    font-size:30px;
}

}

</style>
</head>

<body>

<div class="app">

    <div class="matrix"></div>

    <div class="light"></div>

    <div class="dot1"></div>
    <div class="dot2"></div>
    <div class="dot3"></div>

    <div class="center">

        <div class="logoBox">
            <div class="logo">⚡</div>
        </div>

        <div class="title">
            DEVIL <span>PREDICTOR</span>
        </div>

        <div class="sub">
            Secure Prediction System
        </div>

        <div class="loading">
            <div class="pulse"></div>
            Connecting Server...
        </div>

        <div class="loader"></div>

    </div>

    <div class="footer">
        Secure • Fast • Connected
    </div>

</div>

<script>

setTimeout(()=>{

window.location.href='Welcome.html';

},3000);

</script>

</body>
</html>
